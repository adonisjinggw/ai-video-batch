<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 视频工具 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            padding: 12px 20px;
            gap: 8px;
            border-bottom: 1px solid #222;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: var(--bg-card);
            border: none;
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
        }

        .tab.active {
            background: var(--accent);
            color: #000;
        }

        .main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            color: var(--text);
            font-size: 16px;
            resize: none;
            min-height: 100px;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .settings-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .setting-item {
            flex: 1;
        }

        .setting-item label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .setting-item select,
        .setting-item input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .generate-btn:disabled {
            opacity: 0.5;
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
        }

        .upload-area .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .upload-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }

        .result-section {
            margin-top: 24px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            display: none;
        }

        .result-title {
            font-size: 16px;
            margin-bottom: 16px;
        }

        .result-video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .result-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-input);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .result-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>🎬 视频工具</h1>
        <div style="width:50px;"></div>
    </header>
    <div class="tabs">
        <button class="tab active" onclick="switchPanel('t2v')">📝 文生视频</button>
        <button class="tab" onclick="switchPanel('i2v')">🖼️ 图生视频</button>
        <button class="tab" onclick="switchPanel('ref')">🔗 视频克隆</button>
    </div>
    <main class="main">
        <div class="panel active" id="panel-t2v">
            <div class="input-section">
                <label class="input-label">✨ 描述你想要的视频内容</label>
                <textarea class="input-box" id="t2vPrompt" placeholder="例如：一只可爱的猫咪在草地上奔跑..."></textarea>
            </div>
            <div class="settings-row">
                <div class="setting-item"><label>模型</label>
                    <select id="t2vModel">
                        <option value="sora-2-all">Sora-2 (15秒)</option>
                        <option value="sora-2-pro-all">Sora-2 Pro (15秒)</option>
                        <option value="veo-3.1">Veo 3.1 (8秒)</option>
                        <option value="grok-video-3">Grok Video (6秒)</option>
                    </select>
                </div>
                <div class="setting-item"><label>比例</label>
                    <select id="t2vRatio">
                        <option value="16:9">16:9 横屏</option>
                        <option value="9:16">9:16 竖屏</option>
                        <option value="1:1">1:1 方形</option>
                    </select>
                </div>
            </div>
            <button class="generate-btn" onclick="generateT2V()">⚡ 生成视频</button>
            <div class="loading" id="t2vLoading">
                <div class="spinner"></div>
                <div>视频生成中，大约需要1-3分钟...</div>
            </div>
            <div class="result-section" id="t2vResult">
                <div class="result-title">🎬 生成结果</div><video class="result-video" id="t2vVideo" controls
                    playsinline></video>
                <div class="result-actions"><button class="result-btn" onclick="downloadVideo('t2v')">⬇️
                        下载</button><button class="result-btn primary" onclick="generateT2V()">🔄 重新生成</button></div>
            </div>
        </div>
        <div class="panel" id="panel-i2v">
            <div class="input-section">
                <label class="input-label">🖼️ 上传参考图片</label>
                <input type="file" id="i2vImageInput" accept="image/*" style="display:none"
                    onchange="previewI2VImage(this)">
                <div class="upload-area" onclick="document.getElementById('i2vImageInput').click()">
                    <div class="icon">📷</div>
                    <div>点击上传图片</div><img class="upload-preview" id="i2vPreview">
                </div>
            </div>
            <div class="input-section"><label class="input-label">✨ 动作描述（可选）</label><textarea class="input-box"
                    id="i2vPrompt" placeholder="例如：图片中的人物转头微笑..." style="min-height:60px;"></textarea></div>
            <div class="settings-row">
                <div class="setting-item"><label>模型</label><select id="i2vModel">
                        <option value="sora-2-all">Sora-2 (15秒)</option>
                        <option value="sora-2-pro-all">Sora-2 Pro (15秒)</option>
                        <option value="veo-3.1">Veo 3.1 (8秒)</option>
                        <option value="grok-video-3">Grok Video (6秒)</option>
                    </select></div>
                <div class="setting-item"><label>比例</label><select id="i2vRatio">
                        <option value="16:9">16:9 横屏</option>
                        <option value="9:16">9:16 竖屏</option>
                        <option value="1:1">1:1 方形</option>
                    </select></div>
            </div>
            <button class="generate-btn" onclick="generateI2V()">⚡ 生成视频</button>
            <div class="loading" id="i2vLoading">
                <div class="spinner"></div>
                <div>视频生成中...</div>
            </div>
            <div class="result-section" id="i2vResult">
                <div class="result-title">🎬 生成结果</div><video class="result-video" id="i2vVideo" controls
                    playsinline></video>
                <div class="result-actions"><button class="result-btn" onclick="downloadVideo('i2v')">⬇️
                        下载</button><button class="result-btn primary" onclick="generateI2V()">🔄 重新生成</button></div>
            </div>
        </div>
        <div class="panel" id="panel-ref">
            <div class="input-section">
                <label class="input-label">📁 上传参考视频或输入URL</label>
                <input type="file" id="refVideoInput" accept="video/*" onchange="previewRefVideo(this)"
                    style="width:100%;background:var(--bg-input);border:1px solid #333;border-radius:8px;padding:12px;color:var(--text);margin-bottom:12px;">
                <input type="text" id="refUrl" placeholder="或输入视频URL..."
                    style="width:100%;background:var(--bg-input);border:1px solid #333;border-radius:8px;padding:12px;color:var(--text);margin-bottom:12px;">
                <video id="refPreviewVideo" controls style="width:100%;display:none;border-radius:8px;"></video>
            </div>
            <div class="input-section"><label class="input-label">✨ 克隆提示词</label><textarea class="input-box"
                    id="refPrompt" placeholder="例如：保持视频风格，但把主角换成一只熊猫..." style="min-height:80px;"></textarea></div>
            <div class="settings-row">
                <div class="setting-item"><label>模型</label><select id="refModel">
                        <option value="sora-2-all">Sora-2 (15秒)</option>
                        <option value="sora-2-pro-all">Sora-2 Pro (15秒)</option>
                        <option value="veo-3.1">Veo 3.1 (8秒)</option>
                        <option value="grok-video-3">Grok Video (6秒)</option>
                    </select></div>
                <div class="setting-item"><label>比例</label><select id="refRatio">
                        <option value="16:9">16:9</option>
                        <option value="9:16">9:16</option>
                        <option value="1:1">1:1</option>
                    </select></div>
            </div>
            <button class="generate-btn" onclick="generateRef()">⚡ 克隆视频</button>
            <div class="loading" id="refLoading">
                <div class="spinner"></div>
                <div>视频克隆中...</div>
            </div>
            <div class="result-section" id="refResult">
                <div class="result-title">🎬 克隆结果</div><video class="result-video" id="refVideo" controls
                    playsinline></video>
                <div class="result-actions"><button class="result-btn" onclick="downloadVideo('ref')">⬇️
                        下载</button><button class="result-btn primary" onclick="generateRef()">🔄 重新克隆</button></div>
            </div>
        </div>
    </main>
    <div class="toast" id="toast"></div>
    <script>
        // 返回函数 - 优先使用历史记录，否则跳转到主页
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';
            
            if (fromMobile) {
                location.href = 'mobile.html?skip_welcome=1';
            } else {
                location.href = 'index.html';
            }
        }

        // 使用 NVAuth 模块
        var _sbClient = null, currentUser = null, userQuota = 0;
        let authInitialized = false;

        // 视频生成费用（成本×2，1胶片=¥0.1）
        const VIDEO_COST = {
            'sora-2-all': 7,        // 成本¥1.08/15秒 → 售价¥2.16 → 7胶片
            'sora-2-pro-all': 14,   // pro版2倍价格 → 14胶片
            'veo-3.1': 7,           // 成本¥0.35 → 售价¥0.70 → 7胶片
            'grok-video-3': 5       // 成本¥0.25 → 售价¥0.50 → 5胶片
        };

        // 🔧 图片压缩函数（防止413错误）
        function compressImage(dataUrl, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[video-tools] 页面加载完成，开始初始化...');
            
            // 🔧 修复：确保所有生成按钮事件正确绑定（支持移动端触摸）
            // 文生视频按钮
            const t2vBtns = document.querySelectorAll('#panel-t2v .generate-btn');
            t2vBtns.forEach(btn => {
                btn.onclick = null;
                btn.addEventListener('click', function(e) {
                    console.log('[video-tools] 文生视频按钮被点击 (click)');
                    generateT2V();
                });
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('[video-tools] 文生视频按钮被点击 (touchend)');
                    generateT2V();
                });
            });
            
            // 图生视频按钮
            const i2vBtns = document.querySelectorAll('#panel-i2v .generate-btn');
            i2vBtns.forEach(btn => {
                btn.onclick = null;
                btn.addEventListener('click', function(e) {
                    console.log('[video-tools] 图生视频按钮被点击 (click)');
                    generateI2V();
                });
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('[video-tools] 图生视频按钮被点击 (touchend)');
                    generateI2V();
                });
            });
            
            // 视频克隆按钮
            const refBtns = document.querySelectorAll('#panel-ref .generate-btn');
            refBtns.forEach(btn => {
                btn.onclick = null;
                btn.addEventListener('click', function(e) {
                    console.log('[video-tools] 视频克隆按钮被点击 (click)');
                    generateRef();
                });
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('[video-tools] 视频克隆按钮被点击 (touchend)');
                    generateRef();
                });
            });
            
            console.log('[video-tools] 按钮事件已绑定');
            
            if (typeof NVAuth !== 'undefined') {
                await checkUser();
            }
            console.log('[video-tools] 初始化完成');
        });

        async function checkUser() {
            try {
                // 等待认证状态就绪
                await Promise.race([
                    typeof __nvAuthReadyPromise !== 'undefined' ? __nvAuthReadyPromise : Promise.resolve(),
                    new Promise(resolve => setTimeout(resolve, 3000))
                ]);
                
                currentUser = await NVAuth.getCurrentUser();
                if (currentUser) {
                    console.log('[video-tools] 用户已登录:', currentUser.email);
                    await loadUserQuota();
                } else {
                    console.log('[video-tools] 用户未登录');
                }
            } catch (e) { console.error('检查用户失败:', e); }
            
            // 标记认证初始化完成
            authInitialized = true;
            console.log('[video-tools] 认证初始化完成, currentUser:', currentUser ? currentUser.email : 'null');
        }

        async function loadUserQuota() {
            try {
                const profile = await NVAuth.getUserProfile(currentUser.id);
                userQuota = profile?.quota_balance || 0;
                console.log('[video-tools] 用户胶片:', userQuota);
            } catch (e) { console.error('加载配额失败:', e); }
        }

        // 预扣费函数
        async function preDeduct(cost, description) {
            // 🔧 修复：确保cost是整数（数据库是INTEGER类型）
            cost = Math.ceil(cost);
            
            // 等待认证初始化完成
            if (!authInitialized) {
                const waitStart = Date.now();
                while (!authInitialized && (Date.now() - waitStart) < 3000) {
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            
            if (!currentUser) { showToast('请先登录'); return false; }
            if (userQuota < cost) { showToast(`胶片不足，需要${cost}胶片`); return false; }
            try {
                const res = await fetch('/api/supabase-proxy', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consume', userId: currentUser.id, amount: cost, description })
                });
                const data = await res.json().catch(() => ({}));
                
                // 🔧 修复：先检查 HTTP 状态码
                if (!res.ok) {
                    if (res.status === 400 && data.error === 'INSUFFICIENT_BALANCE') {
                        throw new Error('余额不足，请先充值');
                    }
                    throw new Error(data.message || data.error || `服务器错误: ${res.status}`);
                }
                
                if (data.success || data.newBalance !== undefined) {
                    userQuota = data.newBalance ?? data.quotaBalance ?? userQuota - cost;
                    localStorage.setItem('film_balance', String(userQuota));
                    console.log(`🎞️ 预扣费成功: -${cost}胶片, 余额=${userQuota}`);
                    return true;
                }
                throw new Error(data.message || data.error || '扣费失败');
            } catch (e) { showToast('扣费失败: ' + e.message); return false; }
        }

        // ✅ 已移除退款函数 - 后端成功扣费后不再退款，避免成本损耗

        let currentVideoUrls = { t2v: '', i2v: '', ref: '' };
        let i2vImageData = '', refVideoData = '';
        function switchPanel(panel) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); document.querySelectorAll('.panel').forEach(p => p.classList.remove('active')); event.target.classList.add('active'); document.getElementById('panel-' + panel).classList.add('active'); }
        function previewI2VImage(input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = async (e) => { const compressed = await compressImage(e.target.result, 1200, 0.8); document.getElementById('i2vPreview').src = compressed; document.getElementById('i2vPreview').style.display = 'block'; i2vImageData = compressed; }; reader.readAsDataURL(input.files[0]); } }
        // 上传视频到图床获取URL
        async function uploadVideoToHost(base64Data) {
            try {
                showToast('正在上传视频...');
                const base64 = base64Data.replace(/^data:video\/\w+;base64,/, '');
                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const blob = new Blob([bytes], { type: 'video/mp4' });
                
                const formData = new FormData();
                formData.append('reqtype', 'fileupload');
                formData.append('fileToUpload', blob, 'video.mp4');
                
                const res = await fetch('https://catbox.moe/user/api.php', {
                    method: 'POST',
                    body: formData
                });
                
                if (res.ok) {
                    const url = await res.text();
                    if (url && url.startsWith('http')) {
                        console.log('[video-tools] 视频上传成功:', url);
                        return url.trim();
                    }
                }
                throw new Error('上传失败');
            } catch (e) {
                console.error('[video-tools] 视频上传失败:', e);
                return null;
            }
        }
        
        let refVideoFile = null;
        function previewRefVideo(input) { 
            if (input.files && input.files[0]) { 
                const file = input.files[0];
                if (file.size > 50 * 1024 * 1024) {
                    showToast('视频文件不能超过50MB');
                    input.value = '';
                    return;
                }
                refVideoFile = file;
                const url = URL.createObjectURL(file); 
                document.getElementById('refPreviewVideo').src = url; 
                document.getElementById('refPreviewVideo').style.display = 'block'; 
                document.getElementById('refUrl').value = ''; 
                showToast('视频已选择，点击生成时会自动上传');
            } 
        }
        function getFixedDuration(model) { if (model.includes('grok')) return 6; if (model.includes('veo')) return 8; return 15; }
        async function generateT2V() { const prompt = document.getElementById('t2vPrompt').value.trim(); if (!prompt) { showToast('请输入视频描述'); return; } const model = document.getElementById('t2vModel').value; const ratio = document.getElementById('t2vRatio').value; const duration = getFixedDuration(model); const cost = VIDEO_COST[model] || 8; if (!await preDeduct(cost, '文生视频')) return; document.getElementById('t2vLoading').style.display = 'block'; document.getElementById('t2vResult').style.display = 'none'; try { const response = await fetch('/api/sora2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'text-to-video', prompt, model, aspect_ratio: ratio, duration }) }); if (!response.ok) throw new Error('API错误: ' + response.status); const data = await response.json(); if (data.error) throw new Error(data.message || data.error); if (data.task_id || data.id) { showToast('视频生成中，请稍候...'); const taskId = data.task_id || data.id; const videoUrl = await pollVideoResult(taskId, data._source, data._endpoint); if (videoUrl) { currentVideoUrls.t2v = videoUrl; document.getElementById('t2vVideo').src = videoUrl; document.getElementById('t2vResult').style.display = 'block'; showToast('视频生成成功！'); } else { throw new Error('未获取到视频'); } } else if (data.video_url || data.url) { currentVideoUrls.t2v = data.video_url || data.url; document.getElementById('t2vVideo').src = currentVideoUrls.t2v; document.getElementById('t2vResult').style.display = 'block'; showToast('视频生成成功！'); } else { throw new Error('未获取到视频'); } } catch (error) { showToast('生成失败：' + error.message); } finally { document.getElementById('t2vLoading').style.display = 'none'; } }
        async function generateI2V() { if (!i2vImageData) { showToast('请先上传图片'); return; } const prompt = document.getElementById('i2vPrompt').value.trim(); const model = document.getElementById('i2vModel').value; const ratio = document.getElementById('i2vRatio').value; const duration = getFixedDuration(model); const cost = VIDEO_COST[model] || 8; if (!await preDeduct(cost, '图生视频')) return; document.getElementById('i2vLoading').style.display = 'block'; document.getElementById('i2vResult').style.display = 'none'; try { const response = await fetch('/api/sora2', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'image-to-video', prompt: prompt || 'animate this image smoothly', image_url: i2vImageData, model, aspect_ratio: ratio, duration }) }); if (!response.ok) throw new Error('API错误: ' + response.status); const data = await response.json(); if (data.error) throw new Error(data.message || data.error); if (data.task_id || data.id) { showToast('视频生成中，请稍候...'); const taskId = data.task_id || data.id; const videoUrl = await pollVideoResult(taskId, data._source, data._endpoint); if (videoUrl) { currentVideoUrls.i2v = videoUrl; document.getElementById('i2vVideo').src = videoUrl; document.getElementById('i2vResult').style.display = 'block'; showToast('视频生成成功！'); } else { throw new Error('未获取到视频'); } } else if (data.video_url || data.url) { currentVideoUrls.i2v = data.video_url || data.url; document.getElementById('i2vVideo').src = currentVideoUrls.i2v; document.getElementById('i2vResult').style.display = 'block'; showToast('视频生成成功！'); } else { throw new Error('未获取到视频'); } } catch (error) { showToast('生成失败：' + error.message); } finally { document.getElementById('i2vLoading').style.display = 'none'; } }
        async function generateRef() { 
            let refUrl = document.getElementById('refUrl').value.trim(); 
            
            // 如果有本地文件，先上传获取URL
            if (refVideoFile && !refUrl) {
                const reader = new FileReader();
                const base64 = await new Promise((resolve) => {
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(refVideoFile);
                });
                refUrl = await uploadVideoToHost(base64);
                if (!refUrl) {
                    showToast('视频上传失败，请直接输入URL');
                    return;
                }
            }
            
            if (!refUrl) { showToast('请上传视频或输入URL'); return; } 
            if (!refUrl.startsWith('http')) { showToast('请输入有效的视频URL'); return; } 
            const prompt = document.getElementById('refPrompt').value.trim(); 
            if (!prompt) { showToast('请输入视频描述'); return; } 
            const model = document.getElementById('refModel').value; 
            const ratio = document.getElementById('refRatio').value; 
            const duration = getFixedDuration(model); 
            const cost = VIDEO_COST[model] || 8; 
            if (!await preDeduct(cost, '视频克隆')) return; 
            document.getElementById('refLoading').style.display = 'block'; 
            document.getElementById('refResult').style.display = 'none'; 
            try { 
                const response = await fetch('/api/sora2', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ action: 'text-to-video', prompt: prompt, video_url: refUrl, model, aspect_ratio: ratio, duration }) 
                }); 
                if (!response.ok) throw new Error('API错误: ' + response.status); 
                const data = await response.json(); 
                if (data.error) throw new Error(data.message || data.error); 
                if (data.task_id || data.id) { 
                    showToast('视频生成中，请稍候...'); 
                    const taskId = data.task_id || data.id; 
                    const videoUrl = await pollVideoResult(taskId, data._source, data._endpoint); 
                    if (videoUrl) { 
                        currentVideoUrls.ref = videoUrl; 
                        document.getElementById('refVideo').src = videoUrl; 
                        document.getElementById('refResult').style.display = 'block'; 
                        showToast('视频克隆成功！'); 
                    } else { throw new Error('未获取到视频'); } 
                } else if (data.video_url || data.url) { 
                    currentVideoUrls.ref = data.video_url || data.url; 
                    document.getElementById('refVideo').src = currentVideoUrls.ref; 
                    document.getElementById('refResult').style.display = 'block'; 
                    showToast('视频克隆成功！'); 
                } else { throw new Error('未获取到视频'); } 
            } catch (error) { 
                showToast('克隆失败：' + error.message); 
            } finally { 
                document.getElementById('refLoading').style.display = 'none'; 
                refVideoFile = null;
            } 
        }
        
        // 轮询视频生成结果
        async function pollVideoResult(taskId, source, endpoint) {
            const maxAttempts = 60;
            for (let i = 0; i < maxAttempts; i++) {
                await new Promise(r => setTimeout(r, 5000));
                try {
                    const res = await fetch('/api/sora2', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'poll', task_id: taskId, _source: source, _endpoint: endpoint })
                    });
                    if (!res.ok) continue;
                    const data = await res.json();
                    const status = (data.status || data.state || '').toUpperCase();
                    if (status === 'COMPLETED' || status === 'SUCCEEDED' || status === 'SUCCESS' || status === 'DONE') {
                        return data.output_url || data.video_url || data.url || data.data?.output_url || data.data?.video_url;
                    }
                    if (status === 'FAILED' || status === 'ERROR') {
                        throw new Error(data.error || data.message || '视频生成失败');
                    }
                } catch (e) { if (e.message.includes('失败')) throw e; }
            }
            throw new Error('视频生成超时');
        }
        function downloadVideo(type) { const url = currentVideoUrls[type]; if (!url) return; const a = document.createElement('a'); a.href = url; a.download = 'video_' + Date.now() + '.mp4'; a.target = '_blank'; a.click(); showToast('开始下载'); }
        function showToast(msg) { const toast = document.getElementById('toast'); toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); }
    </script>
