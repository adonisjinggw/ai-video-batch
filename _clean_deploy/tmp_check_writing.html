<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>鉁嶏笍 AI鍐欎綔 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .type-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .type-tab {
            padding: 10px 16px;
            background: var(--bg-card);
            border: 1px solid #333;
            border-radius: 20px;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .type-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            color: var(--text);
            font-size: 16px;
            resize: none;
            min-height: 120px;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .settings-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .setting-item {
            flex: 1;
        }

        .setting-item label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .setting-item select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 24px;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
        }

        .result-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .result-text {
            font-size: 15px;
            line-height: 1.8;
            white-space: pre-wrap;
            color: var(--text);
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .result-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-dark);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .result-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }

        /* 馃幀 杞棰?婕敾寮圭獥鏍峰紡 */
        .convert-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .convert-modal {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .convert-modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: var(--accent);
        }

        .convert-option-group {
            margin-bottom: 16px;
        }

        .convert-option-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: block;
        }

        .convert-option-row {
            display: flex;
            gap: 8px;
        }

        .convert-option-btn {
            flex: 1;
            padding: 12px 8px;
            border-radius: 10px;
            border: 2px solid #333;
            background: var(--bg-dark);
            color: var(--text);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .convert-option-btn.active {
            border-color: var(--accent);
            background: rgba(250,204,21,0.15);
            color: var(--accent);
        }

        .convert-option-btn:hover {
            border-color: #555;
        }

        .convert-modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .convert-modal-btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .convert-modal-btn.cancel {
            background: #333;
            color: #999;
        }

        .convert-modal-btn.confirm {
            background: linear-gradient(135deg, #facc15, #eab308);
            color: #000;
        }

        .convert-modal-btn:hover {
            transform: translateY(-2px);
        }

        .history-section {
            margin-top: 32px;
            border-top: 1px solid #222;
            padding-top: 20px;
        }

        .history-item {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .history-item-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--accent);
        }

        .history-item-preview {
            font-size: 13px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 馃啎 鎵归噺妯″紡鏍峰紡 */
        .batch-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .batch-toggle-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-card);
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .batch-toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .batch-item {
            position: relative;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            overflow: hidden;
            min-height: 160px;
            display: flex;
            flex-direction: column;
        }
        .batch-item textarea {
            width: 100%;
            flex: 1;
            min-height: 100px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 13px;
            padding: 10px;
            resize: none;
            line-height: 1.5;
        }
        .batch-item textarea:focus {
            outline: none;
        }
        .batch-item-params {
            display: flex;
            flex-wrap: wrap;
            gap: 3px;
            padding: 4px 5px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid #222;
        }
        .batch-item-params select {
            flex: 1;
            min-width: 45%;
            padding: 3px 2px;
            font-size: 9px;
            background: var(--bg-card);
            border: 1px solid #333;
            border-radius: 4px;
            color: var(--text);
            cursor: pointer;
        }
        .batch-item.generating {
            border-color: var(--accent);
        }
        .batch-item.generating::before {
            content: '鉁嶏笍';
            position: absolute;
            top: 4px;
            right: 4px;
            font-size: 16px;
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .batch-item.done {
            border-color: #22c55e;
        }
        .batch-item.error {
            border-color: #ef4444;
        }
        .batch-result-section {
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid #333;
        }
        .batch-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .batch-result-header h3 {
            margin: 0;
            font-size: 16px;
            color: var(--accent);
        }
        .batch-result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .batch-action-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: var(--bg-input);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .batch-action-btn:hover {
            border-color: var(--accent);
        }
        .batch-action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .batch-result-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .batch-result-item {
            background: var(--bg-dark);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #333;
        }
        .batch-result-item.selected {
            border-color: #22c55e;
        }
        .batch-result-item.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .batch-result-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .batch-result-item-index {
            background: var(--accent);
            color: #000;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .batch-result-item-actions {
            display: flex;
            gap: 6px;
        }
        .batch-result-item-actions button {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
            border: 1px solid #444;
            background: var(--bg-card);
            color: var(--text-dim);
            cursor: pointer;
        }
        .batch-result-item-text {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">鈫?杩斿洖</button>
        <h1>鉁嶏笍 AI鍐欎綔</h1>
        <div style="width: 50px;"></div>
    </header>

    <main class="main">
        <div class="type-tabs">
            <button class="type-tab active" data-type="story" onclick="switchType('story')">馃摉 鏁呬簨</button>
            <button class="type-tab" data-type="article" onclick="switchType('article')">馃摑 鏂囩珷</button>
            <button class="type-tab" data-type="script" onclick="switchType('script')">馃幀 鍓ф湰</button>
            <button class="type-tab" data-type="poem" onclick="switchType('poem')">馃尭 璇楄瘝</button>
            <button class="type-tab" data-type="copy" onclick="switchType('copy')">馃摙 鏂囨</button>
            <button class="type-tab" data-type="continue" onclick="switchType('continue')">鉁?缁啓</button>
        </div>

        <!-- 馃啎 鍗曠瘒/鎵归噺妯″紡鍒囨崲 -->
        <div class="batch-toggle">
            <button class="batch-toggle-btn active" onclick="setBatchMode(false)" id="singleModeBtn">馃摑 鍗曠瘒妯″紡</button>
            <button class="batch-toggle-btn" onclick="setBatchMode(true)" id="batchModeBtn">馃摎 鎵归噺妯″紡 (8鏍?</button>
        </div>

        <!-- 鍗曠瘒妯″紡杈撳叆鍖?-->
        <div class="input-section" id="singleInputSection">
            <label class="input-label" id="inputLabel">鉁?杈撳叆鏁呬簨涓婚鎴栧ぇ绾?/label>
            <textarea class="input-box" id="contentInput" placeholder="渚嬪锛氫竴涓▼搴忓憳绌胯秺鍒板彜浠ｏ紝鐢ㄧ幇浠ｇ煡璇嗘敼鍙樺巻鍙?.."></textarea>
        </div>

        <!-- 馃啎 鎵归噺妯″紡杈撳叆鍖?(9瀹牸锛屾瘡涓彲鐙珛閰嶇疆) -->
        <div class="input-section" id="batchInputSection" style="display:none;">
            <label class="input-label">鉁?鎵归噺杈撳叆涓婚 (姣忎釜鍙崟鐙厤缃鏍?闀垮害)</label>
            <div class="batch-grid" id="batchGrid"></div>
        </div>

        <div class="settings-row">
            <div class="setting-item">
                <label>鍐欎綔椋庢牸</label>
                <select id="styleSelect">
                    <option value="normal">馃摑 姝ｅ父</option>
                    <option value="humorous">馃槀 骞介粯</option>
                    <option value="literary">馃摎 鏂囪壓</option>
                    <option value="professional">馃捈 涓撲笟</option>
                    <option value="simple">馃幆 绠€娲?/option>
                </select>
            </div>
            <div class="setting-item">
                <label>鍐呭闀垮害</label>
                <select id="lengthSelect">
                    <option value="short">鐭瘒 (~300瀛?</option>
                    <option value="medium" selected>涓瘒 (~800瀛?</option>
                    <option value="long">闀跨瘒 (~1500瀛?</option>
                </select>
            </div>
            <div class="setting-item">
                <label>鍐欎綔妯″瀷</label>
                <select id="writerModelSelect">
                    <option value="yunwu:grok-4-fast" selected>馃専 Grok-4 Fast锛堥閫夛級</option>
                    <option value="mimo">鈿?MIMO</option>
                    <option value="yunwu:qwen-plus">鈽侊笍 浜戦浘 qwen-plus</option>
                    <option value="roll">馃啌 榄斿 roll锛堥渶閰嶇疆锛?/option>
                </select>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn" onclick="handleGenerate()">
            鈿?寮€濮嬪垱浣?        </button>

        <div class="loading" id="loading" style="display:none;">
            <div class="spinner"></div>
            <div>AI姝ｅ湪鍒涗綔涓?..</div>
        </div>

        <!-- 鍗曠瘒缁撴灉鍖哄煙 -->
        <div class="result-section" id="resultSection" style="display:none;">
            <div class="result-title">
                <span>馃搫 鍒涗綔缁撴灉</span>
                <span id="wordCount" style="font-size:12px;"></span>
            </div>
            <div class="result-text" id="resultText"></div>
            <div class="result-actions">
                <button class="result-btn" onclick="copyResult()">馃搵 澶嶅埗</button>
                <button class="result-btn" onclick="shareResult()">馃摛 鍒嗕韩</button>
                <button class="result-btn primary" onclick="regenerate()">馃攧 閲嶆柊鐢熸垚</button>
            </div>
            <!-- 馃幀 杞棰?婕敾/鐢熷浘鎸夐挳 -->
            <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #333;">
                <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 8px;">馃摛 瀵煎嚭鍒?/div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <button class="result-btn" onclick="pushToImageGen()" style="flex:1; min-width: 100px; background: linear-gradient(135deg, rgba(34,197,94,0.3), rgba(34,197,94,0.1)); border-color: rgba(34,197,94,0.5);">
                        馃柤锔?鐢熸垚AI鍥剧墖
                    </button>
                    <button class="result-btn" onclick="showConvertModal('video')" style="flex:1; min-width: 100px; background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(139,92,246,0.1)); border-color: rgba(139,92,246,0.5);">
                        馃幀 鐢熸垚AI瑙嗛
                    </button>
                    <button class="result-btn" onclick="showConvertModal('comic')" style="flex:1; min-width: 100px; background: linear-gradient(135deg, rgba(236,72,153,0.3), rgba(236,72,153,0.1)); border-color: rgba(236,72,153,0.5);">
                        馃摎 鐢熸垚AI婕敾
                    </button>
                    <button class="result-btn" onclick="pushToVoice()" style="flex:1; min-width: 100px; background: linear-gradient(135deg, rgba(251,191,36,0.3), rgba(251,191,36,0.1)); border-color: rgba(251,191,36,0.5);">
                        馃帳 鍘荤敓鎴愰厤闊?                    </button>
                </div>
            </div>
        </div>

        <!-- 馃啎 鎵归噺缁撴灉鍖哄煙 -->
        <div class="batch-result-section" id="batchResultSection" style="display:none;">
            <div class="batch-result-header">
                <h3>馃摎 鎵归噺鍒涗綔缁撴灉</h3>
                <div class="batch-result-actions">
                    <button class="batch-action-btn" onclick="copyAllBatchResults()">馃搵 澶嶅埗</button>
                    <button class="batch-action-btn" onclick="selectAllBatch()">鉁?鍏ㄩ€?/button>
                </div>
            </div>
            <div class="batch-result-list" id="batchResultList"></div>
            <!-- 馃摛 鎵归噺鎺ㄩ€佹寜閽?-->
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #333;">
                <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 10px;">馃摛 鎵归噺鎺ㄩ€侀€変腑鍐呭鍒?/div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                    <button class="batch-action-btn" onclick="pushBatchToImageGen()" style="background: linear-gradient(135deg, rgba(34,197,94,0.3), rgba(34,197,94,0.1)); border-color: rgba(34,197,94,0.5); padding: 12px;">
                        馃柤锔?鎵归噺鐢熷浘
                    </button>
                    <button class="batch-action-btn" onclick="pushBatchToVideo()" style="background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(139,92,246,0.1)); border-color: rgba(139,92,246,0.5); padding: 12px;">
                        馃幀 鎵归噺瑙嗛
                    </button>
                    <button class="batch-action-btn" onclick="pushBatchToComic()" style="background: linear-gradient(135deg, rgba(236,72,153,0.3), rgba(236,72,153,0.1)); border-color: rgba(236,72,153,0.5); padding: 12px;">
                        馃摎 鎵归噺婕敾
                    </button>
                    <button class="batch-action-btn" onclick="pushBatchToVoice()" style="background: linear-gradient(135deg, rgba(251,191,36,0.3), rgba(251,191,36,0.1)); border-color: rgba(251,191,36,0.5); padding: 12px;">
                        馃帳 鎵归噺閰嶉煶
                    </button>
                </div>
            </div>
        </div>

        <div class="history-section" id="historySection">
            <div class="result-title">馃摎 鍘嗗彶璁板綍</div>
            <div id="historyList"></div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <!-- 馃幀 杞棰?婕敾寮圭獥 -->

        // 馃啎 鎵归噺鐢熸垚鍐呭

            for (let i = 0; i < 8; i++) {

                    const itemLength = document.getElementById(`batchLength${i}`)?.value || globalLength;

        // 棰勬墸璐瑰嚱鏁?        async function preDeduct(cost, description) {
            // 馃敡 淇锛氱‘淇漜ost鏄暣鏁帮紙鏁版嵁搴撴槸INTEGER绫诲瀷锛?            cost = Math.ceil(cost);
            
            // 绛夊緟璁よ瘉鍒濆鍖栧畬鎴?            if (!authInitialized) {
                const waitStart = Date.now();
                while (!authInitialized && (Date.now() - waitStart) < 3000) {
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            
            if (!currentUser) { showToast('璇峰厛鐧诲綍'); return false; }
            if (userQuota < cost) { showToast(`鑳剁墖涓嶈冻锛岄渶瑕?{cost}鑳剁墖`); return false; }
            try {
                const res = await fetch('/api/supabase-proxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consume', userId: currentUser.id, amount: cost, description })
                });
                const data = await res.json().catch(() => ({}));
                
                // 馃敡 淇锛氬厛妫€鏌?HTTP 鐘舵€佺爜
                if (!res.ok) {
                    if (res.status === 400 && data.error === 'INSUFFICIENT_BALANCE') {
                        throw new Error('浣欓涓嶈冻锛岃鍏堝厖鍊?);
                    }
                    throw new Error(data.message || data.error || `鏈嶅姟鍣ㄩ敊璇? ${res.status}`);
                }
                
                if (data.success || data.newBalance !== undefined) {
                    userQuota = data.newBalance ?? data.quotaBalance ?? userQuota - cost;
                    localStorage.setItem('film_balance', String(userQuota));
                    return true;
                }
                throw new Error(data.message || data.error || '鎵ｈ垂澶辫触');
            } catch (e) { showToast('鎵ｈ垂澶辫触: ' + e.message); return false; }
        }

        // 鉁?宸茬Щ闄ら€€娆惧嚱鏁?- 鍚庣鎴愬姛鎵ｈ垂鍚庝笉鍐嶉€€娆撅紝閬垮厤鎴愭湰鎹熻€?
        // 鍒濆鍖栵紙浣跨敤 NVAuth 妯″潡锛?        let authInitialized = false;
        
        async function initAuth() {
            console.log('[writing] 寮€濮嬪垵濮嬪寲璁よ瘉...');
            
            // 绛夊緟 NVAuth 妯″潡鍔犺浇
            const authTimeout = 5000;
            const startTime = Date.now();
            while (typeof NVAuth === 'undefined' && (Date.now() - startTime) < authTimeout) {
                await new Promise(r => setTimeout(r, 200));
            }
            
            if (typeof NVAuth === 'undefined') {
                console.error('[writing] NVAuth 妯″潡鍔犺浇瓒呮椂');
                return;
            }
            
            console.log('[writing] NVAuth 妯″潡宸插姞杞?);
            
            // 绛夊緟璁よ瘉鐘舵€佸氨缁?            try {
                await Promise.race([
                    typeof __nvAuthReadyPromise !== 'undefined' ? __nvAuthReadyPromise : Promise.resolve(),
                    new Promise(resolve => setTimeout(resolve, 3000))
                ]);
                console.log('[writing] 璁よ瘉鐘舵€佸凡灏辩华');
            } catch (e) { 
                console.warn('[writing] 绛夊緟璁よ瘉鐘舵€佽秴鏃?);
            }
            
            // 鑾峰彇褰撳墠鐢ㄦ埛
            try {
                currentUser = await NVAuth.getCurrentUser();
                if (currentUser) {
                    console.log('[writing] 鐢ㄦ埛宸茬櫥褰?', currentUser.email);
                    // 鑾峰彇鐢ㄦ埛閰嶇疆
                    const profile = await NVAuth.getUserProfile(currentUser.id);
                    userQuota = profile?.quota_balance || 0;
                    console.log('[writing] 鐢ㄦ埛鑳剁墖:', userQuota);
                } else {
                    console.log('[writing] 鐢ㄦ埛鏈櫥褰?);
                }
            } catch (e) {
                console.error('[writing] 鑾峰彇鐢ㄦ埛淇℃伅澶辫触:', e);
            }
            
            authInitialized = true;
            console.log('[writing] 璁よ瘉鍒濆鍖栧畬鎴? currentUser:', currentUser ? currentUser.email : 'null');
        }

        // 椤甸潰鍔犺浇瀹屾垚鍚庡垵濮嬪寲
        document.addEventListener('DOMContentLoaded', async () => {
            loadHistory();
            await initAuth();
        });
    </script>
