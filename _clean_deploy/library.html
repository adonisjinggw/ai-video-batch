<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 角色库 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            padding: 8px 12px;
            margin: -8px -12px;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
        }

        .back-btn:active {
            opacity: 0.6;
        }

        .tabs {
            display: flex;
            padding: 12px 20px;
            gap: 8px;
            border-bottom: 1px solid #222;
            overflow-x: auto;
        }

        .tab {
            padding: 10px 20px;
            background: var(--bg-card);
            border: none;
            border-radius: 20px;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            min-height: 44px;
        }

        .tab:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .tab.active {
            background: var(--accent);
            color: #000;
        }

        .main {
            padding: 20px;
            padding-bottom: 100px;
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .add-btn {
            padding: 12px 16px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            min-height: 44px;
        }

        .add-btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            background: var(--bg-input);
        }

        .card-info {
            padding: 12px;
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-desc {
            font-size: 12px;
            color: var(--text-dim);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            padding: 0 12px 12px;
        }

        .card-btn {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #333;
            background: var(--bg-input);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
            min-height: 36px;
        }

        .card-btn:active {
            transform: scale(0.96);
            opacity: 0.8;
        }

        .card-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: flex-end;
            z-index: 200;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            background: var(--bg-card);
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 18px;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-input);
            border: none;
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .upload-area {
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
        }

        .upload-area:active {
            border-color: var(--accent);
        }

        .upload-preview {
            width: 100%;
            max-height: 200px;
            object-fit: contain;
            border-radius: 8px;
            margin-top: 12px;
        }

        .form-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }

        .form-btn:disabled {
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>📚 角色库</h1>
        <div style="width: 50px;"></div>
    </header>

    <div class="tabs">
        <button class="tab active" data-tab="chars" onclick="switchTab('chars', this)">👤 角色</button>
        <button class="tab" data-tab="styles" onclick="switchTab('styles', this)">🎨 风格</button>
        <button class="tab" data-tab="scenes" onclick="switchTab('scenes', this)">🏞️ 场景</button>
        <button class="tab" data-tab="prompts" onclick="switchTab('prompts', this)">📝 提示词</button>
    </div>

    <main class="main">
        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="搜索..." oninput="filterItems()">
            <button class="add-btn" onclick="openAddModal()">+ 添加</button>
        </div>

        <div class="grid" id="itemGrid"></div>

        <div class="empty" id="emptyState">
            <div class="empty-icon">📭</div>
            <div>暂无内容</div>
            <div style="margin-top:8px;font-size:13px;">点击"添加"创建你的第一个角色</div>
        </div>
    </main>

    <!-- 添加/编辑弹窗 -->
    <div class="modal" id="addModal" onclick="if(event.target===this)closeAddModal()">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">添加角色</h3>
                <button class="modal-close" onclick="closeAddModal()">×</button>
            </div>
            <form id="itemForm" onsubmit="saveItem(event)">
                <input type="hidden" id="itemId">
                <div class="form-group">
                    <label class="form-label">名称</label>
                    <input type="text" class="form-input" id="itemName" required placeholder="例如：小明">
                </div>
                <div class="form-group">
                    <label class="form-label">描述/提示词</label>
                    <textarea class="form-input form-textarea" id="itemDesc" placeholder="详细描述角色特征..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">参考图片</label>
                    <input type="file" id="itemImage" accept="image/*" style="display:none"
                        onchange="previewImage(this)">
                    <div class="upload-area" onclick="document.getElementById('itemImage').click()">
                        <div>📷 点击上传图片</div>
                        <img class="upload-preview" id="imagePreview" style="display:none">
                    </div>
                </div>
                <button type="submit" class="form-btn" id="saveBtn">保存</button>
            </form>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // 返回函数 - 直接返回 mobile.html 工作区
        function goBack() {
            console.log('[library] 返回按钮被点击');
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';

            if (fromMobile) {
                location.href = 'mobile.html?skip_welcome=1';
            } else {
                location.href = 'index.html';
            }
        }

        var _sbClient = null;
        let currentTab = 'chars';
        let items = [];
        let editingId = null;
        let uploadedImageUrl = null;
        let uploadedVideoUrl = null;

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[library] 页面加载完成');

            if (typeof NVAuth !== 'undefined') {
                _sbClient = NVAuth.getSupabase();
            }

            // 读取URL中的tab参数，自动切换到对应标签
            const _urlTab = new URLSearchParams(window.location.search).get('tab');
            if (_urlTab && ['chars', 'styles', 'scenes', 'prompts'].includes(_urlTab)) {
                currentTab = _urlTab;
                const tabBtn = document.querySelector(`.tab[onclick*="'${_urlTab}'"]`);
                if (tabBtn) { document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); tabBtn.classList.add('active'); }
            }

            loadItems();

            console.log('[library] 初始化完成');
        });

        function switchTab(tab, btn) {
            console.log('[library] 切换到:', tab);
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            if (btn) {
                btn.classList.add('active');
            }
            // 更新空状态提示
            updateEmptyText();
            loadItems();
        }

        function updateEmptyText() {
            const names = { chars: '角色', styles: '风格', scenes: '场景', prompts: '提示词' };
            const name = names[currentTab] || '项目';
            document.querySelector('#emptyState div:last-child').textContent = `点击"添加"创建你的第一个${name}`;
        }

        function getTabEmoji(tab) {
            const emojis = { chars: '👤', styles: '🎨', scenes: '🏞️', prompts: '📝' };
            return emojis[tab] || '';
        }

        function getStorageKey() {
            return `library_${currentTab}`;
        }

        function loadItems() {
            try {
                items = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
            } catch (e) {
                items = [];
            }
            renderItems();
        }

        function saveItems() {
            localStorage.setItem(getStorageKey(), JSON.stringify(items));
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderItems(query);
        }

        function renderItems(filter = '') {
            const grid = document.getElementById('itemGrid');
            const empty = document.getElementById('emptyState');

            let filtered = items;
            if (filter) {
                filtered = items.filter(item =>
                    item.name.toLowerCase().includes(filter) ||
                    (item.desc || '').toLowerCase().includes(filter)
                );
            }

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            grid.innerHTML = filtered.map((item, i) => {
                const hasVideo = item.video && typeof item.video === 'string' && item.video.startsWith('http');
                const hasImage = item.image && typeof item.image === 'string' && item.image.length > 0;
                const fallbackSvg = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23222%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2255%22 text-anchor=%22middle%22 fill=%22%23666%22 font-size=%2240%22>👤</text></svg>';
                const mediaHtml = hasVideo
                    ? `<video class="card-img" src="${item.video}" poster="${item.image || ''}" controls preload="none" style="background:#111;"></video>`
                    : `<img class="card-img" src="${hasImage ? item.image : fallbackSvg}" alt="${item.name}">`;
                return `<div class="card">
                    ${mediaHtml}
                    <div class="card-info">
                        <div class="card-name">${item.name}</div>
                        <div class="card-desc">${item.desc || '暂无描述'}</div>
                    </div>
                    <div class="card-actions">
                        <button class="card-btn" onclick="editItem(${i})">✏️ 编辑</button>
                        <button class="card-btn primary" onclick="useItem(${i})">使用</button>
                    </div>
                </div>`;
            }).join('');
        }

        function openAddModal() {
            console.log('[library] 打开添加弹窗');
            editingId = null;
            uploadedImageUrl = null;
            uploadedVideoUrl = null;
            document.getElementById('modalTitle').textContent = '添加' + getTabName();
            document.getElementById('itemForm').reset();
            document.getElementById('imagePreview').style.display = 'none';
            document.getElementById('addModal').classList.add('show');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('show');
        }

        function editItem(index) {
            const item = items[index];
            editingId = index;
            uploadedImageUrl = item.image;
            document.getElementById('modalTitle').textContent = '编辑' + getTabName();
            document.getElementById('itemName').value = item.name;
            document.getElementById('itemDesc').value = item.desc || '';
            if (item.image) {
                document.getElementById('imagePreview').src = item.image;
                document.getElementById('imagePreview').style.display = 'block';
            }
            document.getElementById('addModal').classList.add('show');
        }

        function getTabName() {
            const names = { chars: '角色', styles: '风格', scenes: '场景', prompts: '提示词' };
            return names[currentTab] || '项目';
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreview').style.display = 'block';
                    uploadedImageUrl = e.target.result;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        async function saveItem(e) {
            e.preventDefault();
            const name = document.getElementById('itemName').value.trim();
            const desc = document.getElementById('itemDesc').value.trim();

            if (!name) {
                showToast('请输入名称');
                return;
            }

            const item = {
                name,
                desc,
                image: uploadedImageUrl,
                createdAt: Date.now()
            };

            if (editingId !== null) {
                items[editingId] = { ...items[editingId], ...item };
            } else {
                items.unshift(item);
            }

            saveItems();
            renderItems();
            closeAddModal();
            showToast(editingId !== null ? '已更新' : '已添加');
        }

        function useItem(index) {
            const item = items[index];
            // 保存到 sessionStorage 以便返回到 mobile.html 时使用
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';

            if (fromMobile) {
                try {
                    sessionStorage.setItem('library_selected_item', JSON.stringify({
                        tab: currentTab,
                        item: item,
                        timestamp: Date.now()
                    }));
                    console.log('[library] 已保存选中项到 sessionStorage，准备返回');
                    // 返回到 mobile.html
                    location.href = 'mobile.html?skip_welcome=1&from_library=1';
                    return;
                } catch (e) {
                    console.warn('[library] 保存到 sessionStorage 失败，回退到剪贴板方式:', e);
                }
            }

            // 复制提示词到剪贴板
            const text = item.desc || item.name;
            navigator.clipboard.writeText(text);
            showToast('已复制到剪贴板，可在创作时粘贴使用');
        }

        function deleteItem(index) {
            if (!confirm('确定删除？')) return;
            items.splice(index, 1);
            saveItems();
            renderItems();
            showToast('已删除');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ==================== 页面状态持久化 ====================
        function saveLibraryState() {
            try {
                const state = {
                    currentTab,
                    searchInput: document.getElementById('searchInput')?.value || '',
                    timestamp: Date.now()
                };
                sessionStorage.setItem('rollroll_library_state', JSON.stringify(state));
                console.log('[library] 状态已保存');
            } catch (e) { console.warn('[library] 保存状态失败:', e); }
        }

        function restoreLibraryState() {
            try {
                const saved = sessionStorage.getItem('rollroll_library_state');
                if (!saved) return;
                const state = JSON.parse(saved);
                if (state.timestamp && Date.now() - state.timestamp > 30 * 60 * 1000) {
                    sessionStorage.removeItem('rollroll_library_state');
                    return;
                }
                console.log('[library] 恢复状态...');

                if (state.currentTab) switchTab(state.currentTab);
                if (state.searchInput) {
                    document.getElementById('searchInput').value = state.searchInput;
                    filterItems();
                }

                console.log('[library] 状态恢复完成');
            } catch (e) { console.warn('[library] 恢复状态失败:', e); }
        }

        document.addEventListener('visibilitychange', () => { if (document.hidden) saveLibraryState(); });
        window.addEventListener('beforeunload', saveLibraryState);
        window.addEventListener('pagehide', saveLibraryState);
        window.addEventListener('load', () => setTimeout(restoreLibraryState, 200));
    </script>
</body>

</html>
