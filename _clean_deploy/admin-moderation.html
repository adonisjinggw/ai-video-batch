<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoVideo 内容审核管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #252525;
            --accent-gold: #d4af37;
            --accent-red: #ef4444;
            --accent-orange: #f59e0b;
            --accent-green: #10b981;
            --text-primary: #ffffff;
            --text-secondary: #888888;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            color: var(--accent-gold);
            margin: 0;
            font-size: 24px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(45deg, #d4af37, #f2d06b);
            color: #000;
        }

        .btn-danger {
            background: var(--accent-red);
            color: #fff;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: #fff;
            border: 1px solid #444;
        }

        .btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-card.extreme {
            border-color: var(--accent-red);
        }

        .stat-card.severe {
            border-color: var(--accent-orange);
        }

        .stat-card.warning {
            border-color: var(--accent-gold);
        }

        .stat-card.banned {
            border-color: #9333ea;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-card.extreme .stat-value {
            color: var(--accent-red);
        }

        .stat-card.severe .stat-value {
            color: var(--accent-orange);
        }

        .stat-card.warning .stat-value {
            color: var(--accent-gold);
        }

        .stat-card.banned .stat-value {
            color: #9333ea;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-group label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .filter-input {
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .table-container {
            background: var(--bg-secondary);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .level-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .level-3 {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
        }

        .level-2 {
            background: rgba(245, 158, 11, 0.2);
            color: var(--accent-orange);
        }

        .level-1 {
            background: rgba(212, 175, 55, 0.2);
            color: var(--accent-gold);
        }

        .content-preview {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .user-id {
            font-family: monospace;
            font-size: 12px;
            color: #60a5fa;
        }

        .action-btn {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            margin-right: 5px;
        }

        .action-btn.ban {
            background: var(--accent-red);
            color: #fff;
        }

        .action-btn.unban {
            background: var(--accent-green);
            color: #fff;
        }

        .action-btn.view {
            background: var(--bg-tertiary);
            color: #fff;
            border: 1px solid #444;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .page-btn {
            padding: 8px 15px;
            background: var(--bg-secondary);
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
        }

        .page-btn.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            color: var(--accent-gold);
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }

        .detail-row {
            margin-bottom: 15px;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 5px;
        }

        .detail-value {
            background: var(--bg-primary);
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            word-break: break-all;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .ban-form {
            margin-top: 20px;
        }

        .ban-form .form-group {
            margin-bottom: 15px;
        }

        .ban-form label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .ban-form input,
        .ban-form select,
        .ban-form textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-primary);
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .ban-form textarea {
            min-height: 80px;
            resize: vertical;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ 内容审核管理</h1>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="refreshData()">🔄 刷新</button>
                <button class="btn btn-primary" onclick="exportData()">📥 导出记录</button>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stat-card extreme">
                <div class="stat-value" id="statExtreme">0</div>
                <div class="stat-label">🔴 极端违规</div>
            </div>
            <div class="stat-card severe">
                <div class="stat-value" id="statSevere">0</div>
                <div class="stat-label">🟠 严重违规</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-value" id="statWarning">0</div>
                <div class="stat-label">🟡 警告</div>
            </div>
            <div class="stat-card banned">
                <div class="stat-value" id="statBanned">0</div>
                <div class="stat-label">🚫 已封禁用户</div>
            </div>
        </div>

        <!-- 筛选器 -->
        <div class="filters">
            <div class="filter-group">
                <label>违规等级:</label>
                <select class="filter-input" id="filterLevel" onchange="applyFilters()">
                    <option value="">全部</option>
                    <option value="3">极端违规</option>
                    <option value="2">严重违规</option>
                    <option value="1">警告</option>
                </select>
            </div>
            <div class="filter-group">
                <label>用户ID:</label>
                <input type="text" class="filter-input" id="filterUserId" placeholder="搜索用户ID..."
                    onkeyup="applyFilters()">
            </div>
            <div class="filter-group">
                <label>时间范围:</label>
                <select class="filter-input" id="filterTime" onchange="applyFilters()">
                    <option value="7">最近7天</option>
                    <option value="30" selected>最近30天</option>
                    <option value="90">最近90天</option>
                    <option value="all">全部</option>
                </select>
            </div>
        </div>

        <!-- 违规记录表格 -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>用户ID</th>
                        <th>违规等级</th>
                        <th>类别</th>
                        <th>内容预览</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="violationsTable">
                    <!-- 动态填充 -->
                </tbody>
            </table>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="icon">✅</div>
            <div>暂无违规记录</div>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination">
            <!-- 动态填充 -->
        </div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>违规详情</h2>
                <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
            </div>
            <div id="detailContent">
                <!-- 动态填充 -->
            </div>
        </div>
    </div>

    <!-- 封禁弹窗 -->
    <div class="modal" id="banModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🚫 封禁用户</h2>
                <button class="modal-close" onclick="closeModal('banModal')">&times;</button>
            </div>
            <div class="ban-form">
                <input type="hidden" id="banUserId">
                <div class="form-group">
                    <label>用户ID</label>
                    <input type="text" id="banUserIdDisplay" readonly>
                </div>
                <div class="form-group">
                    <label>封禁类型</label>
                    <select id="banType">
                        <option value="7">临时封禁 (7天)</option>
                        <option value="30">临时封禁 (30天)</option>
                        <option value="permanent">永久封禁</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>封禁原因</label>
                    <textarea id="banReason" placeholder="请输入封禁原因..."></textarea>
                </div>
                <button class="btn btn-danger" onclick="confirmBan()" style="width: 100%;">确认封禁</button>
            </div>
        </div>
    </div>

    <script>
        // 模拟数据（实际应从API获取）
        let violations = [];
        let currentPage = 1;
        const pageSize = 20;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadLocalViolations();
            renderStats();
            renderTable();
        });

        // 从本地存储加载违规记录
        function loadLocalViolations() {
            try {
                const data = localStorage.getItem('nv_user_violations');
                violations = data ? JSON.parse(data) : [];
                // 按时间倒序
                violations.sort((a, b) => b.timestamp - a.timestamp);
            } catch (e) {
                violations = [];
            }
        }

        // 渲染统计
        function renderStats() {
            const now = Date.now();
            const thirtyDaysAgo = now - 30 * 24 * 60 * 60 * 1000;
            const recent = violations.filter(v => v.timestamp > thirtyDaysAgo);

            document.getElementById('statExtreme').textContent = recent.filter(v => v.level >= 3).length;
            document.getElementById('statSevere').textContent = recent.filter(v => v.level === 2).length;
            document.getElementById('statWarning').textContent = recent.filter(v => v.level === 1).length;

            // 统计封禁用户
            const banData = localStorage.getItem('nv_user_ban_status');
            const banInfo = banData ? JSON.parse(banData) : {};
            document.getElementById('statBanned').textContent = banInfo.banned ? 1 : 0;
        }

        // 应用筛选
        function applyFilters() {
            currentPage = 1;
            renderTable();
        }

        // 获取筛选后的数据
        function getFilteredData() {
            let filtered = [...violations];

            // 等级筛选
            const level = document.getElementById('filterLevel').value;
            if (level) {
                filtered = filtered.filter(v => v.level === parseInt(level));
            }

            // 用户ID筛选
            const userId = document.getElementById('filterUserId').value.trim().toLowerCase();
            if (userId) {
                filtered = filtered.filter(v => v.userId && v.userId.toLowerCase().includes(userId));
            }

            // 时间筛选
            const timeRange = document.getElementById('filterTime').value;
            if (timeRange !== 'all') {
                const days = parseInt(timeRange);
                const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
                filtered = filtered.filter(v => v.timestamp > cutoff);
            }

            return filtered;
        }

        // 渲染表格
        function renderTable() {
            const filtered = getFilteredData();
            const tbody = document.getElementById('violationsTable');
            const emptyState = document.getElementById('emptyState');
            const tableContainer = document.querySelector('.table-container');

            if (filtered.length === 0) {
                tableContainer.style.display = 'none';
                emptyState.style.display = 'block';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            tableContainer.style.display = 'block';
            emptyState.style.display = 'none';

            // 分页
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filtered.slice(start, end);

            tbody.innerHTML = pageData.map((v, idx) => `
                <tr>
                    <td>${formatDate(v.timestamp)}</td>
                    <td><span class="user-id">${v.userId || '未知'}</span></td>
                    <td><span class="level-badge level-${v.level}">${getLevelText(v.level)}</span></td>
                    <td>${getCategoryText(v.category)}</td>
                    <td><div class="content-preview" title="${escapeHtml(v.content)}">${escapeHtml(v.content)}</div></td>
                    <td>
                        <button class="action-btn view" onclick="viewDetail(${start + idx})">查看</button>
                        <button class="action-btn ban" onclick="showBanModal('${v.userId}')">封禁</button>
                    </td>
                </tr>
            `).join('');

            // 渲染分页
            renderPagination(filtered.length);
        }

        // 渲染分页
        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize);
            const pagination = document.getElementById('pagination');

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>`;

            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    html += `<span style="color:#666">...</span>`;
                }
            }

            html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>下一页</button>`;

            pagination.innerHTML = html;
        }

        function goToPage(page) {
            const filtered = getFilteredData();
            const totalPages = Math.ceil(filtered.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
        }

        // 查看详情
        function viewDetail(index) {
            const filtered = getFilteredData();
            const v = filtered[index];
            if (!v) return;

            document.getElementById('detailContent').innerHTML = `
                <div class="detail-row">
                    <div class="detail-label">用户ID</div>
                    <div class="detail-value">${v.userId || '未知'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">违规时间</div>
                    <div class="detail-value">${v.date || formatDate(v.timestamp)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">违规等级</div>
                    <div class="detail-value"><span class="level-badge level-${v.level}">${getLevelText(v.level)}</span></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">违规类别</div>
                    <div class="detail-value">${getCategoryText(v.category)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">违规内容</div>
                    <div class="detail-value" style="white-space: pre-wrap;">${escapeHtml(v.content)}</div>
                </div>
            `;

            document.getElementById('detailModal').classList.add('active');
        }

        // 显示封禁弹窗
        function showBanModal(userId) {
            document.getElementById('banUserId').value = userId;
            document.getElementById('banUserIdDisplay').value = userId;
            document.getElementById('banReason').value = '';
            document.getElementById('banModal').classList.add('active');
        }

        // 确认封禁
        function confirmBan() {
            const userId = document.getElementById('banUserId').value;
            const banType = document.getElementById('banType').value;
            const reason = document.getElementById('banReason').value.trim() || '违规行为';

            const banInfo = {
                banned: true,
                reason: reason,
                permanent: banType === 'permanent',
                bannedAt: new Date().toISOString()
            };

            if (banType !== 'permanent') {
                const days = parseInt(banType);
                banInfo.expiresAt = new Date(Date.now() + days * 24 * 60 * 60 * 1000).toISOString();
            }

            // 保存到本地存储（实际应调用API）
            localStorage.setItem('nv_user_ban_status', JSON.stringify(banInfo));

            alert(`用户 ${userId} 已被${banType === 'permanent' ? '永久' : banType + '天'}封禁`);
            closeModal('banModal');
            renderStats();
        }

        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // 刷新数据
        function refreshData() {
            loadLocalViolations();
            renderStats();
            renderTable();
            alert('数据已刷新');
        }

        // 导出数据
        function exportData() {
            const filtered = getFilteredData();
            const csv = [
                ['时间', '用户ID', '违规等级', '类别', '内容'].join(','),
                ...filtered.map(v => [
                    v.date || formatDate(v.timestamp),
                    v.userId,
                    getLevelText(v.level),
                    getCategoryText(v.category),
                    `"${(v.content || '').replace(/"/g, '""')}"`
                ].join(','))
            ].join('\n');

            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `违规记录_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // 工具函数
        function formatDate(timestamp) {
            if (!timestamp) return '未知';
            const d = new Date(timestamp);
            return d.toLocaleString('zh-CN');
        }

        function getLevelText(level) {
            const texts = { 3: '🔴 极端违规', 2: '🟠 严重违规', 1: '🟡 警告' };
            return texts[level] || '未知';
        }

        function getCategoryText(category) {
            const texts = { extreme: '极端内容', severe: '严重违规', warning: '敏感内容' };
            return texts[category] || category || '未分类';
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 点击弹窗外部关闭
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                }
            });
        });
    </script>
</body>

</html>
