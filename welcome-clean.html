<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你就是导演 - AI短视频创作平台</title>
    <style>
        /* 现代CSS重置和设计令牌 */
        :root {
            /* OKLCH专业色彩系统 */
            --color-primary-50: oklch(0.98 0.02 250);
            --color-primary-100: oklch(0.95 0.05 250);
            --color-primary-500: oklch(0.65 0.15 250);
            --color-primary-600: oklch(0.55 0.18 250);
            --color-primary-900: oklch(0.25 0.15 250);
            
            --color-accent-400: oklch(0.75 0.12 45);
            --color-accent-500: oklch(0.68 0.15 45);
            --color-accent-600: oklch(0.62 0.18 45);
            
            --color-neutral-50: oklch(0.98 0 0);
            --color-neutral-100: oklch(0.96 0 0);
            --color-neutral-200: oklch(0.92 0 0);
            --color-neutral-800: oklch(0.27 0 0);
            --color-neutral-900: oklch(0.21 0 0);
            
            /* 设计令牌 */
            --spacing-xs: 0.5rem;
            --spacing-sm: 0.75rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            --spacing-3xl: 4rem;
            
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-2xl: 2rem;
            
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            --shadow-2xl: 0 25px 50px -12px rgb(0 0 0 / 0.25);
            
            --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-body: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            
            --ease-elastic: cubic-bezier(0.68, -0.6, 0.32, 1.6);
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --ease-emphasis: cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            overflow-x: hidden;
            height: 100%;
        }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, 
                oklch(0.15 0.05 250) 0%,
                oklch(0.20 0.08 260) 35%,
                oklch(0.25 0.12 270) 100%);
            height: 100vh;
            color: var(--color-neutral-50);
            line-height: 1.6;
            overflow: hidden;
        }

        /* 🔄 后端启动等待遮罩 */
        #backend-loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, 
                oklch(0.15 0.05 250) 0%,
                oklch(0.20 0.08 260) 35%,
                oklch(0.25 0.12 270) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.5s ease-out;
        }

        #backend-loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .loading-progress {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        /* 全屏Hero区域 */
        .hero-section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-background {
            position: absolute;
            inset: 0;
            background-image: url('images/welcome-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.7) blur(1px);
            transform: scale(1.1);
            transition: transform 20s var(--ease-smooth);
        }

        .hero-background::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                oklch(0.15 0.05 250 / 0.9) 0%,
                oklch(0.20 0.08 260 / 0.8) 50%,
                oklch(0.25 0.12 270 / 0.9) 100%
            );
        }

        .hero-content {
            position: relative;
            z-index: 100;
            text-align: center;
            max-width: 1200px;
            padding: var(--spacing-2xl);
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-xs);
            padding: var(--spacing-xs) var(--spacing-md);
            background: var(--color-primary-500);
            background-clip: padding-box;
            border: 1px solid transparent;
            border-radius: var(--radius-2xl);
            font-family: 'KaiTi', '楷体', 'Kalam', cursive;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            color: var(--color-neutral-50);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: var(--shadow-lg);
            margin-bottom: var(--spacing-lg);
            transition: all 0.3s var(--ease-smooth);
        }

        .hero-badge::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                var(--color-primary-400),
                var(--color-accent-500)
            );
            border-radius: inherit;
            z-index: -1;
            opacity: 0.2;
        }

        .hero-title {
            font-family: 'STXingkai', 'STKaiti', 'KaiTi', '行楷', '楷体', 'Brush Script MT', 'Dancing Script', cursive;
            font-size: clamp(3.2rem, 8.5vw, 6.5rem);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 2px;
            background: linear-gradient(135deg,
                var(--color-accent-400) 0%,
                var(--color-primary-500) 50%,
                var(--color-accent-600) 100%
            );
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            margin-bottom: var(--spacing-lg);
            animation: titleGlow 3s var(--ease-smooth) infinite alternate;
            transform: rotate(-0.3deg);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            position: relative;
            z-index: 20;
        }

        @keyframes titleGlow {
            0% {
                filter: drop-shadow(0 0 20px var(--color-accent-400));
            }
            100% {
                filter: drop-shadow(0 0 40px var(--color-primary-500));
            }
        }

        .hero-subtitle {
            font-family: 'STKaiti', 'KaiTi', '楷体', 'Brush Script MT', 'Kalam', cursive;
            font-size: clamp(1.3rem, 3.2vw, 1.9rem);
            font-weight: 500;
            color: var(--color-neutral-100);
            margin-bottom: var(--spacing-xl);
            opacity: 0.95;
            transform: rotate(0.2deg);
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 20;
        }

        .hero-description {
            font-family: 'KaiTi', '楷体', 'Kalam', 'Patrick Hand', cursive;
            font-size: clamp(1.05rem, 2.2vw, 1.3rem);
            color: var(--color-neutral-100);
            max-width: 600px;
            margin: 0 auto var(--spacing-xl);
            opacity: 0.9;
            line-height: 1.8;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transform: rotate(-0.1deg);
            position: relative;
            z-index: 20;
        }

        .hero-quote {
            font-family: 'Brush Script MT', 'Lucida Handwriting', 'Dancing Script', cursive;
            font-size: clamp(1.4rem, 3.5vw, 2rem);
            font-weight: bold;
            background: linear-gradient(135deg, 
                #FFD700 0%,    /* 亮金色 */
                #FFA500 25%,   /* 橙金色 */
                #FFD700 50%,   /* 亮金色 */
                #B8860B 75%,   /* 深金色 */
                #FFD700 100%   /* 亮金色 */
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: var(--spacing-xl) auto;
            opacity: 1;
            position: relative;
            max-width: 600px;
            z-index: 100;
            /* 修复：移除可能导致文字不可见的text-shadow，因为transparent填充不显示阴影 */
            filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.5));
            letter-spacing: 1px;
            transform: rotate(-1deg);
            line-height: 1.5;
            padding: 10px;
            filter: drop-shadow(2px 2px 4px rgba(184, 134, 11, 0.4));
        }

        /* 双引号样式已移除，保持简洁的手写体效果 */

        .quote-author {
            font-family: 'Brush Script MT', 'Lucida Handwriting', cursive;
            font-size: 1.1em;
            background: linear-gradient(135deg, 
                #DAA520 0%,    /* 金棒色 */
                #B8860B 50%,   /* 深金色 */
                #FFD700 100%   /* 亮金色 */
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            margin-top: var(--spacing-sm);
            font-style: normal;
            text-shadow: 1px 1px 2px rgba(218, 165, 32, 0.3);
            transform: rotate(0.5deg);
        }

        /* 设置按钮 */
        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm) var(--spacing-md);
            color: white;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .settings-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--color-neutral-900);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 500px;
            width: 90%;
            box-shadow: var(--shadow-2xl);
        }
        .modal-content h2 {
            color: var(--color-primary-500);
            margin-bottom: var(--spacing-md);
        }
        .modal-content label {
            display: block;
            color: var(--color-neutral-100);
            margin-bottom: var(--spacing-sm);
        }
        .modal-content input {
            width: 100%;
            padding: var(--spacing-sm);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-sm);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 1rem;
            margin-bottom: var(--spacing-md);
        }
        .modal-buttons {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }
        .modal-buttons button {
            padding: var(--spacing-sm) var(--spacing-md);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .modal-buttons .btn-primary {
            background: var(--color-primary-500);
            color: white;
        }
        .modal-buttons .btn-primary:hover {
            background: var(--color-primary-600);
        }
        .modal-buttons .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .modal-buttons .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 绝对视觉焦点 - 修复位置 */
        .attitude-statement {
            position: fixed;
            top: 45%;
            right: 15%;
            transform: rotate(-8deg);
            z-index: 10;
            opacity: 1;
            width: fit-content;
            pointer-events: none;
        }

        .attitude-statement img {
            max-width: 450px;
            height: auto;
            transform: rotate(3deg) scale(1.6);
            /* 清晰文字处理 */
            filter: 
                drop-shadow(8px 10px 20px rgba(0, 0, 0, 0.8))
                contrast(7.5)
                saturate(0)
                brightness(0.4)
                hue-rotate(-120deg)
                invert(0.4);
            opacity: 0.95;
            /* 更自然的混合模式 */
            mix-blend-mode: screen;
            /* 完全去掉边框和背景 */
            border: none;
            border-radius: 0;
            background: transparent;
            /* 用clip-path柔化边缘 */
            clip-path: ellipse(90% 85% at center);
        }

        .attitude-statement img:hover {
            transform: rotate(3deg) scale(1.7);
        }


        .hero-cta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-lg);
            margin-top: var(--spacing-2xl);
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-lg) var(--spacing-2xl);
            font-family: 'KaiTi', '楷体', 'Kalam', 'Caveat', cursive;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-decoration: none;
            color: var(--color-neutral-50);
            background: linear-gradient(135deg,
                var(--color-accent-500) 0%,
                var(--color-primary-600) 100%
            );
            border: 1px solid transparent;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            transition: all 0.3s var(--ease-elastic);
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                var(--color-accent-400) 0%,
                var(--color-primary-500) 100%
            );
            opacity: 0;
            transition: opacity 0.3s var(--ease-smooth);
        }

        .cta-button:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--shadow-2xl);
        }

        .cta-button:hover::before {
            opacity: 1;
        }

        .cta-button span {
            position: relative;
            z-index: 1;
        }

        /* 浮动装饰元素 */
        .floating-elements {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        .floating-icon {
            position: absolute;
            font-size: 2rem;
            opacity: 0.1;
            animation: float 8s var(--ease-smooth) infinite;
        }

        .floating-icon:nth-child(1) {
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-icon:nth-child(2) {
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .floating-icon:nth-child(3) {
            bottom: 30%;
            left: 20%;
            animation-delay: 4s;
        }

        .floating-icon:nth-child(4) {
            bottom: 70%;
            right: 10%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            25% {
                transform: translateY(-20px) rotate(5deg);
            }
            50% {
                transform: translateY(-10px) rotate(-5deg);
            }
            75% {
                transform: translateY(-30px) rotate(3deg);
            }
        }

        /* 响应式优化 */
        @media (max-width: 768px) {
            .hero-content {
                padding: var(--spacing-xl);
            }
            
            .hero-cta {
                flex-direction: column;
                gap: var(--spacing-md);
            }

            .hero-quote {
                font-size: 1rem;
                margin: var(--spacing-lg) auto;
            }
        }

        @media (max-width: 480px) {
            .hero-content {
                padding: var(--spacing-lg);
            }
            
            .cta-button {
                padding: var(--spacing-md) var(--spacing-xl);
                font-size: 1rem;
            }

            .hero-quote {
                font-size: 0.9rem;
            }
        }

        /* 加载动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-content > * {
            animation: fadeInUp 0.8s var(--ease-emphasis) forwards;
        }

        .hero-badge { animation-delay: 0.1s; }
        .hero-title { animation-delay: 0.2s; }
        .hero-subtitle { animation-delay: 0.3s; }
        .hero-description { animation-delay: 0.4s; }
        .hero-quote { animation-delay: 0.5s; }
        .hero-cta { animation-delay: 0.6s; }

        /* 视差效果 */
        .hero-background {
            animation: parallax 20s linear infinite;
        }

        @keyframes parallax {
            0% { transform: scale(1.1) translateY(0); }
            50% { transform: scale(1.12) translateY(-10px); }
            100% { transform: scale(1.1) translateY(0); }
        }


    </style>
</head>
<body>
    <!-- 🔄 后端启动等待遮罩 -->
    <div id="backend-loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">⚡ 正在启动后端服务...</div>
        <div class="loading-progress" id="loading-progress">检测中...</div>
    </div>

    <!-- 设置按钮（已隐藏） -->
    <button class="settings-btn" onclick="openSettings()" style="display: none;">⚙️ 后端设置</button>

    <!-- 设置模态框 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>⚙️ 后端服务设置</h2>
            <label>
                API基础地址 (留空为无端口模式)
                <input type="text" id="apiBaseInput" placeholder="http://127.0.0.1:48080" />
            </label>
            <p style="color: var(--color-neutral-200); font-size: 0.9rem; margin-bottom: var(--spacing-md);">
                💡 提示：启动后端服务后填写地址，例如 <code style="color: var(--color-accent-500);">http://127.0.0.1:48080</code><br>
                留空则使用无端口模式（直连外部API）
            </p>
            <div class="modal-buttons">
                <button class="btn-secondary" onclick="closeSettings()">取消</button>
                <button class="btn-secondary" onclick="clearApiBase()">清除</button>
                <button class="btn-primary" onclick="saveApiBase()">保存并重启</button>
            </div>
        </div>
    </div>

    <!-- 浮动装饰元素 -->
    <div class="floating-elements">
        <div class="floating-icon">🎬</div>
        <div class="floating-icon">🎥</div>
        <div class="floating-icon">🎞️</div>
        <div class="floating-icon">✨</div>
    </div>

    <!-- 主Hero区域 -->
    <section class="hero-section">
        <div class="hero-background"></div>
        <div class="hero-content">
            <div class="hero-badge">
                <span>🚀</span>
                AI驱动创作平台
            </div>
            
            <h1 class="hero-title">你就是导演</h1>
            
            <div class="attitude-statement">
                <img src="images/yanbudouyanle.png" alt="演都不演了" />
            </div>
            
            <p class="hero-subtitle">重新定义视频创作的无限可能</p>
            
            <p class="hero-description">
                从灵感闪现到成片出炉，让AI成为你的专业创作伙伴。<br>
                智能剧本生成、精美图片创作、专业视频制作——<br>
                每个人都能成为自己故事的导演。
            </p>

            <div class="hero-quote">
                梦想可以放下，但是不要放弃
                <div class="quote-author">—— 荆广伟</div>
            </div>
            
            <div class="hero-cta">
                <a href="#" onclick="handleStartClick(event)" class="cta-button" id="startButton">
                    <span>🎬</span>
                    <span>开始创作之旅</span>
                </a>
            </div>
        </div>
    </section>

<script>
// 隐藏加载遮罩
document.addEventListener('DOMContentLoaded', function() {
    const overlay = document.getElementById('backend-loading-overlay');
    if (overlay) {
        overlay.style.display = 'none';
    }
});

// 处理按钮点击
function handleStartClick(event) {
    event.preventDefault();
    if (window.parent && window.parent !== window) {
        window.parent.postMessage('closeWelcome', '*');
    }
}
</script>

</body>
</html>
