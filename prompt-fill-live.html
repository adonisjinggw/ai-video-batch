<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧩 提示词填空 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        select,
        input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
            margin-bottom: 12px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .var-row {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .var-label {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        /* 下划线填空输入框 */
        .blank-inputs {
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .blank-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .blank-input-row label {
            font-size: 12px;
            color: #888;
            min-width: 60px;
        }
        .blank-input-row input {
            flex: 1;
            margin-bottom: 0;
            padding: 10px 12px;
            font-size: 14px;
        }
        
        /* 自定义输入框样式 */
        .custom-input-wrapper {
            margin-top: 8px;
        }
        .custom-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
        }
        .custom-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
        }
        .custom-input::placeholder {
            color: #666;
        }

        .preview-box {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            font-size: 14px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
        }

        .generate-btn:disabled {
            opacity: 0.5;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .result-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-input);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .result-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        /* 🆕 批量模式样式 */
        .batch-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .batch-toggle-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-card);
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .batch-toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .batch-item {
            position: relative;
            background: var(--bg-card);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            min-height: 380px;
            display: flex;
            flex-direction: column;
        }
        .batch-item-index {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 12px;
            color: #fbbf24;
            font-weight: 600;
            background: rgba(251, 191, 36, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 1;
        }
        .batch-item textarea {
            width: 100%;
            flex: 1;
            min-height: 80px;
            background: transparent;
            border: none;
            padding: 30px 10px 8px 10px;
            color: var(--text);
            font-size: 13px;
            resize: none;
            line-height: 1.5;
        }
        .batch-item textarea:focus {
            outline: none;
            background: rgba(251, 191, 36, 0.05);
        }
        .batch-item textarea::placeholder {
            color: #555;
            font-size: 12px;
        }
        .batch-item-params {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid #222;
            max-height: 280px;
            overflow-y: auto;
        }
        .batch-item-params select {
            width: 100%;
            padding: 6px 4px;
            font-size: 11px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
        }
        .batch-item-params select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .batch-item-params-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }
        .batch-item-params-row select {
            flex: 1;
            min-width: 0;
        }
        .batch-item-params label {
            display: block;
            font-size: 10px;
            color: #888;
            margin-bottom: 2px;
        }
        .batch-param-group {
            margin-bottom: 4px;
        }
        .batch-template-select {
            background: #2a2a1e !important;
            border-color: #fbbf24 !important;
            color: #fbbf24 !important;
        }
        .batch-template-select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .batch-vars-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 4px;
        }
        .batch-item-status {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 14px;
        }
        .batch-item.generating {
            border-color: var(--accent);
            animation: pulse 1s infinite;
        }
        .batch-item.done {
            border-color: #22c55e;
        }
        .batch-item.error {
            border-color: #ef4444;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        /* 批量结果区域样式 */
        .batch-result-section {
            display: none;
            margin-top: 20px;
        }
        .batch-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .batch-result-header h3 {
            font-size: 15px;
            color: #fff;
            margin: 0;
        }
        .batch-result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .batch-action-btn {
            padding: 6px 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: var(--bg-card);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
        }
        .batch-action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .batch-result-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .batch-result-item {
            background: var(--bg-card);
            border: 2px solid #333;
            border-radius: 12px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 110px;
        }
        .batch-result-item.selected {
            border-color: var(--accent);
            background: rgba(251, 191, 36, 0.1);
        }
        .batch-result-item.error {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .batch-result-title {
            font-size: 13px;
            color: #fff;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .batch-result-text {
            font-size: 11px;
            color: #aaa;
            line-height: 1.5;
            max-height: 60px;
            overflow: hidden;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .main {
                padding: 16px;
            }
            
            select {
                font-size: 16px; /* 防止iOS缩放 */
                padding: 14px 12px;
            }
            
            .var-row {
                padding: 14px;
            }
            
            .var-row select {
                font-size: 16px;
            }
            
            .preview-box {
                font-size: 13px;
                max-height: 250px;
            }
            
            .generate-btn {
                padding: 18px;
                font-size: 17px;
            }
            
            .result-actions {
                flex-direction: column;
            }
            
            .result-btn {
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>🧩 提示词填空</h1>
        <div style="width: 50px;"></div>
    </header>

    <main class="main">
        <!-- 🆕 批量/单个模式切换 -->
        <div class="batch-toggle">
            <button class="batch-toggle-btn active" onclick="setBatchMode(false)" id="singleModeBtn">📝 单个模式</button>
            <button class="batch-toggle-btn" onclick="setBatchMode(true)" id="batchModeBtn">🖼️ 批量模式 (8格)</button>
        </div>

        <!-- 单个模式输入区 -->
        <div class="section" id="singleInputSection">
            <div class="section-title">🎯 输入你的主题/想法</div>
            <input type="text" id="themeInput" placeholder="例如：一只在月光下奔跑的白色狼、赛博朋克城市夜景..." oninput="updateThemePreview()">
            <div id="themeHint" style="font-size:12px; color:#666; margin-top:-8px; margin-bottom:12px;">💡 填写主题后，可以直接生成或选择下方模板细化</div>
        </div>

        <!-- 🆕 批量模式输入区 (8宫格，2列4行) -->
        <div class="section" id="batchInputSection" style="display:none;">
            <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
                <span>✨ 批量输入主题（<span id="batchFilledCount">0</span>/8）</span>
                <button onclick="clearBatchGrid()" style="padding:6px 12px; background:var(--bg-card); border:1px solid #444; border-radius:8px; color:#888; font-size:12px; cursor:pointer;">🗑️ 清空</button>
            </div>
            <div class="batch-grid" id="batchGrid">
                <!-- 8个宫格由JS动态生成 -->
            </div>
            <div style="font-size:12px; color:#fbbf24; margin-top:8px;">💡 每格输入主题并选择风格模板（可选），AI为每个主题生成专业提示词</div>
            <!-- 隐藏的textarea用于兼容原有逻辑 -->
            <textarea id="batchThemeInput" style="display:none;"></textarea>
        </div>

        <div class="section">
            <div class="section-title">📋 选择模板类型（可选）</div>
            <select id="templateSelect" onchange="loadTemplate()">
                <option value="">-- 不使用模板，直接用主题生成 --</option>
                <optgroup label="🎬 视频模板">
                    <option value="video_pro">🎬 专业视频</option>
                </optgroup>
                <optgroup label="🎄 节日主题">
                    <option value="christmas">🎄 圣诞节主题</option>
                    <option value="spring_festival">🧧 春节主题</option>
                    <option value="christmas_card">🎁 圣诞贺卡</option>
                    <option value="spring_card">🧧 春节贺卡</option>
                </optgroup>
                <optgroup label="🎨 图片模板">
                    <option value="portrait">👤 人物肖像</option>
                    <option value="product">📦 产品展示</option>
                    <option value="landscape">🏞️ 风景摄影</option>
                </optgroup>
                <optgroup label="📸 专业摄影">
                    <option value="photo_pro">📸 专业摄影师级</option>
                    <option value="art_masterpiece">🎨 艺术大师级</option>
                    <option value="brand_identity">🏢 品牌视觉设计</option>
                </optgroup>
                <optgroup label="🎉 更多节日">
                    <option value="valentines">💕 情人节</option>
                    <option value="mid_autumn">🥮 中秋节</option>
                    <option value="new_year">🎊 元旦新年</option>
                </optgroup>
                <optgroup label="✨ 创意风格">
                    <option value="ghibli">🏯 吉卜力风格</option>
                    <option value="cyberpunk">🌆 赛博朋克</option>
                    <option value="pixar_3d">🎪 Pixar 3D风格</option>
                    <option value="watercolor">🎨 水彩艺术</option>
                    <option value="oil_painting">🖼️ 油画风格</option>
                </optgroup>
            </select>
        </div>

        <div class="section" id="varsSection" style="display:none;">
            <div class="section-title">✏️ 填写变量</div>
            <div id="varsContainer"></div>
        </div>
        
        <!-- 🆕 添加到批量按钮 -->
        <button id="addToBatchBtn" onclick="addFilledTemplateToBatch()" 
            style="display:none; width:100%; margin:12px 0; padding:14px; background:linear-gradient(135deg, #22c55e, #16a34a); border:none; border-radius:8px; color:white; font-size:14px; font-weight:600; cursor:pointer;">
            ➕ 添加到批量输入框
        </button>

        <div class="section" id="previewSection" style="display:none;">
            <div class="section-title">👁️ 预览结果</div>
            <div class="preview-box" id="previewBox"></div>
            <div class="result-actions">
                <button class="result-btn" onclick="copyResult()">📋 复制</button>
                <button class="result-btn" onclick="goToVideoTools()">🎬 去生视频</button>
                <button class="result-btn" onclick="pushToSticker()">🌟 去生表情包</button>
                <button class="result-btn primary" onclick="useResult()">🎨 去生图</button>
            </div>
        </div>

        <!-- 🆕 批量模式结果区 -->
        <div class="batch-result-section" id="batchResultSection">
            <div class="batch-result-header">
                <h3>✨ 批量生成结果</h3>
                <div class="batch-result-actions">
                    <button class="batch-action-btn" onclick="selectAllBatchResults()">✅ 全选</button>
                    <button class="batch-action-btn" onclick="copySelectedPrompts()">📋 复制选中</button>
                </div>
            </div>
            <div class="batch-result-grid" id="batchResultGrid"></div>
            <!-- 📤 批量推送按钮 -->
            <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #333;">
                <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 10px;">📤 批量推送选中内容到</div>
                <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
                    <button class="batch-action-btn" onclick="useSelectedPrompts()" style="background: linear-gradient(135deg, rgba(34,197,94,0.3), rgba(34,197,94,0.1)); border-color: rgba(34,197,94,0.5); padding: 12px;">
                        🖼️ 批量生图
                    </button>
                    <button class="batch-action-btn" onclick="useSelectedPromptsForVideo()" style="background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(139,92,246,0.1)); border-color: rgba(139,92,246,0.5); padding: 12px;">
                        🎬 批量视频
                    </button>
                    <button class="batch-action-btn" onclick="useSelectedPromptsForSticker()" style="background: linear-gradient(135deg, rgba(236,72,153,0.3), rgba(236,72,153,0.1)); border-color: rgba(236,72,153,0.5); padding: 12px;">
                        🌟 批量表情包
                    </button>
                    <button class="batch-action-btn" onclick="copyAllPrompts()" style="padding: 12px;">
                        📋 复制全部
                    </button>
                </div>
            </div>
        </div>

        <button class="generate-btn" id="generateBtn" onclick="generateResult()" style="display:none;">
            ⚡ 生成提示词
        </button>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        // 使用 NVAuth 模块
        var _sbClient = null, currentUser = null, userQuota = 0;
        let authInitialized = false;
        const PROMPT_COST = 1; // 提示词生成费用（1胶片）

        // 返回函数 - 直接返回 mobile.html 工作区
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';
            
            if (fromMobile) {
                location.href = 'mobile.html?skip_welcome=1';
            } else {
                location.href = 'index.html';
            }
        }

        // 专业模板库（参考电脑端PT_PRESET_TEMPLATES）
        const TEMPLATES = {

                name: '🎬 专业视频',

                    {
                        key: 'timeline', label: '时间轴分镜', options: [

                            '[0-3s] 震撼开场 → [3-7s] 功能演示 → [7-12s] 用户好评 → [12-15s] 购买引导',
                            '[0-5s] 故事引入 → [5-10s] 产品植入 → [10-15s] 情感升华',
                            '[0-3s] 特写细节开场 → [3-8s] 缓慢拉开揭示全貌 → [8-12s] 情感升温 → [12-15s] 开放式结尾',
                            '[0-4s] POV第一人称视角 → [4-9s] 切换第三人称 → [9-15s] 回归POV收尾'
                        ]
                    },
                    {
                        key: 'visual_style', label: '视觉风格', options: [
                            '电影级真实感，胶片质感，颗粒感，色彩分级',
                            '日系动漫风，手绘质感，柔和线条，梦幻氛围',
                            '赛博朋克，霓虹灯光，雨夜反光，未来科技感',
                            '广告大片风格，高光泽，慢动作，产品特写',
                            '高端奢华，金色元素，精致细节，黑金配色',
                            '青春活力，明亮色彩，动感节奏，年轻化',

        // 🆕 ==================== 批量模式功能 ====================
        let isBatchMode = false;
        let batchResults = [];  // {index, theme, prompt, error, selected}
        let batchGenerating = false;
        const BATCH_GRID_SIZE = 8;  // 宫格数量（2列4行）
        
        // 🎵 初始化批量宫格（每个格子有独立模板选择和对应参数）
        function initBatchGrid() {

        // 🆕 更新单个格子的参数选择器（根据选择的模板）
        function updateBatchItemParams(index) {
            const templateKey = document.getElementById(`batchTemplate_${index}`).value;
            const varsContainer = document.getElementById(`batchVars_${index}`);
            
            if (!templateKey || !TEMPLATES[templateKey]) {
                varsContainer.innerHTML = '<div style="color:#666;font-size:11px;padding:4px;">选择模板后显示参数</div>';
                return;
            }
            
            const template = TEMPLATES[templateKey];
            const vars = template.vars || [];
            
            // 每2个参数一行（参考music.html的布局）
            let html = '';
            for (let v = 0; v < vars.length; v += 2) {
                html += '<div class="batch-item-params-row">';
                
                // 第一个参数
                const var1 = vars[v];
                html += buildBatchVarSelect(index, var1);
                
                // 第二个参数（如果存在）
                if (v + 1 < vars.length) {
                    const var2 = vars[v + 1];
                    html += buildBatchVarSelect(index, var2);
                }
                
                html += '</div>';
            }
            
            varsContainer.innerHTML = html;
        }
        
        // 🆕 构建单个参数的select HTML
        function buildBatchVarSelect(index, varDef) {
            const options = varDef.options || [];
            // 截取选项文本前10个字符作为显示（避免过长）
            const shortLabel = varDef.label.length > 4 ? varDef.label.substring(0, 4) : varDef.label;
            
            let html = `<select id="batchVar_${index}_${varDef.key}" title="${varDef.label}">`;
            html += `<option value="">--${shortLabel}--</option>`;
            
            for (const opt of options) {
                // 选项文本截取前15字符显示
                const shortOpt = opt.length > 15 ? opt.substring(0, 15) + '...' : opt;
                html += `<option value="${opt}">${shortOpt}</option>`;
            }
            
            html += '</select>';
            return html;
        }
        
        // 更新已填写数量
        function updateBatchCount() {
            let count = 0;
            for (let i = 0; i < BATCH_GRID_SIZE; i++) {
                const textarea = document.getElementById(`batchPrompt_${i}`);
                if (textarea && textarea.value.trim()) count++;
            }
            const countSpan = document.getElementById('batchFilledCount');
            if (countSpan) countSpan.textContent = count;
        }
        
        // 清空批量宫格（包括模板和参数）
        function clearBatchGrid() {
            for (let i = 0; i < BATCH_GRID_SIZE; i++) {
                const textarea = document.getElementById(`batchPrompt_${i}`);
                if (textarea) textarea.value = '';
                const item = document.getElementById(`batchItem_${i}`);
                if (item) item.classList.remove('generating', 'done', 'error');
                const status = document.getElementById(`batchStatus_${i}`);
                if (status) status.textContent = '';
                // 🆕 重置模板选择
                const templateSelect = document.getElementById(`batchTemplate_${i}`);
                if (templateSelect) templateSelect.value = '';
                // 🆕 清空参数区域
                const varsContainer = document.getElementById(`batchVars_${i}`);
                if (varsContainer) varsContainer.innerHTML = '<div style="color:#666;font-size:11px;padding:4px;">选择模板后显示参数</div>';
            }
            updateBatchCount();
            showToast('已清空所有宫格');
        }
        
        // 切换批量/单个模式
        function setBatchMode(batch) {
            isBatchMode = batch;
            document.getElementById('singleModeBtn').classList.toggle('active', !batch);
            document.getElementById('batchModeBtn').classList.toggle('active', batch);
            // 🆕 批量模式下隐藏单个输入区，显示宫格
            document.getElementById('singleInputSection').style.display = batch ? 'none' : 'block';
            document.getElementById('batchInputSection').style.display = batch ? 'block' : 'none';
            document.getElementById('previewSection').style.display = 'none';
            document.getElementById('batchResultSection').style.display = 'none';
            
            // 🆕 批量模式下隐藏全局模板选择区域（每个格子有独立设置）
            const templateSection = document.getElementById('templateSelect')?.closest('.section');
            if (templateSection) templateSection.style.display = batch ? 'none' : 'block';
            document.getElementById('varsSection').style.display = 'none';
            document.getElementById('addToBatchBtn').style.display = 'none';
            
            // 更新按钮文本
            const btn = document.getElementById('generateBtn');
            btn.textContent = batch ? '⚡ 批量生成提示词' : '⚡ 生成提示词';
            btn.style.display = 'block';
            
            // 🆕 批量模式时初始化宫格
            if (batch) {
                initBatchGrid();
            }
            
            // 🆕 更新"添加到批量"按钮状态
            if (!batch) updateAddToBatchBtn();
        }
        
        // 🆕 更新"添加到批量"按钮显示状态
        function updateAddToBatchBtn() {
            const btn = document.getElementById('addToBatchBtn');
            const templateKey = document.getElementById('templateSelect').value;
            // 只有在批量模式且有选择模板时显示
            if (isBatchMode && templateKey) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }
        
        // 🆕 将填写好的内容添加到批量宫格的第一个空格
        function addFilledTemplateToBatch() {
            if (!isBatchMode) {
                showToast('请先切换到批量模式');
                return;
            }
            
            // 获取主题
            const theme = document.getElementById('themeInput')?.value.trim();
            
            if (!theme) {
                showToast('请先输入主题');
                return;
            }
            
            // 找到第一个空格并填入
            for (let i = 0; i < BATCH_GRID_SIZE; i++) {
                const textarea = document.getElementById(`batchPrompt_${i}`);
                if (textarea && !textarea.value.trim()) {
                    textarea.value = theme;
                    updateBatchCount();
                    showToast(`✅ 已添加到第 ${i + 1} 格`);
                    document.getElementById('themeInput').value = '';
                    textarea.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    textarea.focus();
                    return;
                }
            }
            
            showToast('所有宫格已填满，请先清空');
        }
        
        // 重写 generateResult 支持批量模式
        const _originalGenerateResult = generateResult;
        generateResult = async function() {
            if (isBatchMode) {
                await generateBatchPrompts();
            } else {
                await _originalGenerateResult();
            }
        };
        
        // 批量生成：多个主题各生成一个提示词（每个格子独立模板+完整参数）
        async function generateBatchPrompts() {
            // 🆕 从8宫格收集主题、模板和所有参数
            const themes = [];
            for (let i = 0; i < BATCH_GRID_SIZE; i++) {
                const textarea = document.getElementById(`batchPrompt_${i}`);
                const templateSelect = document.getElementById(`batchTemplate_${i}`);
                const val = textarea?.value.trim();
                if (val) {
                    const templateKey = templateSelect?.value || '';
                    // 🆕 收集该格子的所有参数值
                    const varValues = collectBatchItemVars(i, templateKey);
                    themes.push({ 
                        index: i, 
                        theme: val,
                        templateKey: templateKey,
                        varValues: varValues
                    });
                }
            }
            
            if (themes.length === 0) {
                showToast('请至少在一个宫格中输入主题');
                return;
            }
            
            const totalCost = themes.length * PROMPT_COST;
            if (userQuota < totalCost) {
                showToast(`余额不足，需要${totalCost}胶片`);
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = `⛏️ 正在生成 0/${themes.length}...`;
            
            batchResults = [];
            batchGenerating = true;
            let completed = 0;
            
            // 🆕 重置所有宫格状态
            for (let i = 0; i < BATCH_GRID_SIZE; i++) {
                const item = document.getElementById(`batchItem_${i}`);
                if (item) item.classList.remove('generating', 'done', 'error');
                const status = document.getElementById(`batchStatus_${i}`);
                if (status) status.textContent = '';
            }
            
            // 🆕 标记正在生成的宫格
            themes.forEach(t => {
                const item = document.getElementById(`batchItem_${t.index}`);
                if (item) item.classList.add('generating');
                const status = document.getElementById(`batchStatus_${t.index}`);
                if (status) status.textContent = '✨';
            });
            
            // 并发生成所有主题
            const promises = themes.map(async (themeItem) => {
                const { index, theme, templateKey, varValues } = themeItem;
                const gridItem = document.getElementById(`batchItem_${index}`);
                const statusEl = document.getElementById(`batchStatus_${index}`);
                
                // 🆕 获取该格子独立的模板
                const template = templateKey ? TEMPLATES[templateKey] : null;
                
                try {
                    // 🆕 根据模板和参数构建完整的基础提示词
                    let basePrompt = '';
                    if (template) {
                        // 有模板：构建完整的模板提示词
                        basePrompt = buildBatchTemplatePrompt(theme, template, varValues);
                    } else {
                        // 无模板：直接使用主题
                        basePrompt = theme;
                    }
                    
                    const response = await fetch('/api/yunwu', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'text',
                            model: 'roll',
                            prompt: `你是一个专业的AI绘画/视频提示词专家。请将以下内容优化成一个专业的英文提示词。

${basePrompt}

要求：
1. 输出纯英文提示词
2. 保留原始内容的所有关键信息和参数设定
3. 添加专业的摄影/艺术术语
4. 包含主体描述、风格、光影、构图等元素
5. 使用逗号分隔各个描述词
6. 不要解释，直接输出提示词`,
                            userId: currentUser?.id
                        })
                    });
                    
                    const data = await response.json();
                    const prompt = data.content || data.response || data.text || '';
                    
                    // 🆕 更新宫格状态
                    if (gridItem) {
                        gridItem.classList.remove('generating');
                        gridItem.classList.add(prompt ? 'done' : 'error');
                    }
                    if (statusEl) statusEl.textContent = prompt ? '✅' : '❌';
                    
                    batchResults.push({
                        index: index,
                        theme: theme,
                        prompt: prompt,
                        error: prompt ? null : '生成失败',
                        selected: !!prompt
                    });
                } catch (error) {
                    // 🆕 更新宫格状态
                    if (gridItem) {
                        gridItem.classList.remove('generating');
                        gridItem.classList.add('error');
                    }
                    if (statusEl) statusEl.textContent = '❌';
                    
                    batchResults.push({
                        index: index,
                        theme: theme,
                        prompt: '',
                        error: error.message,
                        selected: false
                    });
                }
                
                completed++;
                btn.textContent = `⛏️ 生成中 ${completed}/${themes.length}...`;
            });
            
            await Promise.all(promises);
            
            batchResults.sort((a, b) => a.index - b.index);
            renderBatchResults();
            
            btn.disabled = false;
            btn.textContent = '⚡ 批量生成提示词';
            batchGenerating = false;
            
            const successCount = batchResults.filter(r => !r.error).length;
            showToast(`生成完成！成功 ${successCount}/${themes.length}`);
        }
        
        // 🆕 收集单个格子的所有参数值
        function collectBatchItemVars(index, templateKey) {
            const varValues = {};
            if (!templateKey || !TEMPLATES[templateKey]) return varValues;
            
            const template = TEMPLATES[templateKey];
            const vars = template.vars || [];
            
            for (const varDef of vars) {
                const selectEl = document.getElementById(`batchVar_${index}_${varDef.key}`);
                if (selectEl && selectEl.value) {
                    varValues[varDef.key] = selectEl.value;
                }
            }
            
            return varValues;
        }
        
        // 🆕 根据模板和参数构建完整提示词
        function buildBatchTemplatePrompt(theme, template, varValues) {
            let prompt = `【主题】${theme}\n【风格模板】${template.name}\n\n`;
            
            // 遍历模板的所有变量
            const vars = template.vars || [];
            for (const varDef of vars) {
                const value = varValues[varDef.key];
                if (value) {
                    prompt += `【${varDef.label}】${value}\n`;
                }
            }
            
            return prompt;
        }
        
        // 渲染批量结果（2列4行显示）
        function renderBatchResults() {
            const grid = document.getElementById('batchResultGrid');
            grid.innerHTML = '';
            
            batchResults.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'batch-result-item' + (item.error ? ' error' : '') + (item.selected ? ' selected' : '');
                div.innerHTML = `
                    <div class="batch-result-title">🎯 #${item.index + 1} ${item.theme.substring(0, 12)}${item.theme.length > 12 ? '...' : ''}</div>
                    <div class="batch-result-text">${item.error ? '❌ ' + item.error : item.prompt.substring(0, 80)}${item.prompt.length > 80 ? '...' : ''}</div>
                `;
                div.onclick = () => toggleBatchSelect(idx);
                grid.appendChild(div);
            });
            
            document.getElementById('batchResultSection').style.display = 'block';
        }
        
        // 全选批量结果
        function selectAllBatchResults() {
            const allSelected = batchResults.filter(r => !r.error).every(r => r.selected);
            batchResults.forEach(r => {
                if (!r.error) r.selected = !allSelected;
            });
            renderBatchResults();
        }
        
        // 切换选中状态
        function toggleBatchSelect(idx) {
            if (batchResults[idx].error) return;
            batchResults[idx].selected = !batchResults[idx].selected;
            renderBatchResults();
        }
        
        // 复制选中的提示词
        function copySelectedPrompts() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要复制的提示词');
                return;
            }
            const text = selected.map(r => `/* ${r.theme} */\n${r.prompt}`).join('\n\n---\n\n');
            navigator.clipboard.writeText(text);
            showToast(`已复制 ${selected.length} 个提示词`);
        }
        
        // 复制全部提示词
        function copyAllPrompts() {
            const valid = batchResults.filter(r => !r.error);
            if (valid.length === 0) {
                showToast('没有可复制的提示词');
                return;
            }
            const text = valid.map(r => `/* ${r.theme} */\n${r.prompt}`).join('\n\n---\n\n');
            navigator.clipboard.writeText(text);
            showToast(`已复制 ${valid.length} 个提示词`);
        }
        
        // 批量去生图
        function useSelectedPrompts() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要生图的提示词');
                return;
            }
            // 存储到 localStorage 供 banana.html 读取
            localStorage.setItem('knolling_batch_prompts', JSON.stringify(selected.map(r => r.prompt)));
            location.href = 'banana.html?batch=1';
        }
        
        // 🎬 批量去生视频
        function useSelectedPromptsForVideo() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要生视频的提示词');
                return;
            }
            // 存储到 localStorage 供 video-tools.html 读取
            localStorage.setItem('video_batch_prompts', JSON.stringify(selected.map(r => r.prompt)));
            // 跳转到视频工具页面的批量面板
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';
            const targetUrl = fromMobile ? 'video-tools.html?force=mobile&batch=1&from_promptfill=1' : 'video-tools.html?batch=1&from_promptfill=1';
            location.href = targetUrl;
        }
        
        // 🌟 批量去生表情包
        function useSelectedPromptsForSticker() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要生表情包的提示词');
                return;
            }
            // 存储到 localStorage 供 sticker.html 读取
            localStorage.setItem('sticker_batch_prompts', JSON.stringify(selected.map(r => r.prompt)));
            location.href = 'sticker.html?batch=1&from_promptfill=1';
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 🔧 修复：确保按钮事件正确绑定（支持移动端触摸）
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('[prompt-fill] 页面加载完成，开始初始化...');
            
            // 使用 NVAuth 模块初始化
            if (typeof NVAuth !== 'undefined') {
                await checkUser();
            }
            authInitialized = true;
            console.log('[prompt-fill] 认证初始化完成, currentUser:', currentUser ? currentUser.email : 'null');
            
            // 🎯 默认显示生成按钮（用户可以直接输入主题生成）
            const generateBtn = document.getElementById('generateBtn');
            generateBtn.style.display = 'block';
            
            if (generateBtn) {
                generateBtn.onclick = null;
                generateBtn.addEventListener('click', function(e) {
                    console.log('[prompt-fill] 生成按钮被点击 (click)');
                    generateResult();
                });
                generateBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('[prompt-fill] 生成按钮被点击 (touchend)');
                    generateResult();
                });
                console.log('[prompt-fill] 按钮事件已绑定');
            }
            
            // 🔧 修复：返回按钮支持触摸事件
            const backBtn = document.querySelector('.back-btn');
            if (backBtn) {
                backBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    goBack();
                });
            }
            
            // 🔧 修复：结果按钮支持触摸事件
            document.querySelectorAll('.result-btn').forEach(btn => {
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    const onclick = this.getAttribute('onclick');
                    if (onclick) eval(onclick);
                });
            });
            
            console.log('[prompt-fill] 初始化完成');
        });

        async function checkUser() {
            try {
                // 等待认证状态就绪
                await Promise.race([
                    typeof __nvAuthReadyPromise !== 'undefined' ? __nvAuthReadyPromise : Promise.resolve(),
                    new Promise(resolve => setTimeout(resolve, 3000))
                ]);
                
                currentUser = await NVAuth.getCurrentUser();
                if (currentUser) {
                    console.log('[prompt-fill] 用户已登录:', currentUser.email);
                    await loadUserQuota();
                } else {
                    console.log('[prompt-fill] 用户未登录');
                }
            } catch (e) { console.error('检查用户失败:', e); }
        }

        async function loadUserQuota() {
            try {
                const profile = await NVAuth.getUserProfile(currentUser.id);
                userQuota = profile?.quota_balance || 0;
                console.log('[prompt-fill] 用户胶片:', userQuota);
            } catch (e) { console.error('加载配额失败:', e); }
        }

        // 预扣费函数
        async function preDeduct(cost, description) {
            // 🔧 修复：确保cost是整数（数据库是INTEGER类型）
            cost = Math.ceil(cost);
            
            // 等待认证初始化完成
            if (!authInitialized) {
                const waitStart = Date.now();
                while (!authInitialized && (Date.now() - waitStart) < 3000) {
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            
            if (!currentUser) { showToast('请先登录'); return false; }
            if (userQuota < cost) { showToast(`胶片不足，需要${cost}胶片`); return false; }
            try {
                const res = await fetch('/api/supabase-proxy', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consume', userId: currentUser.id, amount: cost, description })
                });
                const data = await res.json().catch(() => ({}));
                
                // 🔧 修复：先检查 HTTP 状态码
                if (!res.ok) {
                    if (res.status === 400 && data.error === 'INSUFFICIENT_BALANCE') {
                        throw new Error('余额不足，请先充值');
                    }
                    throw new Error(data.message || data.error || `服务器错误: ${res.status}`);
                }
                
                if (data.success || data.newBalance !== undefined) {
                    userQuota = data.newBalance ?? data.quotaBalance ?? userQuota - cost;
                    localStorage.setItem('film_balance', String(userQuota));
                    console.log(`🎞️ 预扣费成功: -${cost}胶片, 余额=${userQuota}`);
                    return true;
                }
                throw new Error(data.message || data.error || '扣费失败');
            } catch (e) { showToast('扣费失败: ' + e.message); return false; }
        }

        // ✅ 已移除退款函数 - 后端成功扣费后不再退款，避免成本损耗

        // ==================== 页面状态持久化 ====================
        function savePromptFillState() {
            try {
                const state = {
                    templateSelect: document.getElementById('templateSelect')?.value || '',
                    themeInput: document.getElementById('themeInput')?.value || '',
                    currentValues: currentValues || {},
                    blankValues: blankValues || {},
                    customInputValues: customInputValues || {},
                    multiSelectValues: multiSelectValues || {},
                    userTheme: userTheme || '',
                    previewContent: document.getElementById('previewBox')?.textContent || '',
                    resultSectionVisible: document.getElementById('resultSection')?.style.display !== 'none',
                    timestamp: Date.now()
                };
                sessionStorage.setItem('rollroll_promptfill_state', JSON.stringify(state));
                console.log('[prompt-fill] 状态已保存');
            } catch (e) {
                console.warn('[prompt-fill] 保存状态失败:', e);
            }
        }

        function restorePromptFillState() {
            try {
                const saved = sessionStorage.getItem('rollroll_promptfill_state');
                if (!saved) return;
                const state = JSON.parse(saved);
                // 检查是否过期（30分钟）
                if (Date.now() - state.timestamp > 30 * 60 * 1000) {
                    sessionStorage.removeItem('rollroll_promptfill_state');
                    return;
                }
                console.log('[prompt-fill] 恢复状态...');

                // 恢复主题输入
                if (state.themeInput && document.getElementById('themeInput')) {
                    document.getElementById('themeInput').value = state.themeInput;
                    userTheme = state.themeInput;
                }

                // 恢复模板选择并重新加载
                if (state.templateSelect && document.getElementById('templateSelect')) {
                    document.getElementById('templateSelect').value = state.templateSelect;
                    loadTemplate();

                    // 恢复各项值
                    setTimeout(() => {
                        if (state.currentValues) {
                            currentValues = state.currentValues;
                            // 恢复 select 值
                            Object.keys(state.currentValues).forEach(key => {
                                const select = document.querySelector(`select[onchange*="'${key}'"]`);
                                if (select && state.currentValues[key]) {
                                    // 检查是否是自定义输入
                                    const isCustom = !Array.from(select.options).some(opt => opt.value === state.currentValues[key]);
                                    if (isCustom && state.customInputValues && state.customInputValues[key]) {
                                        select.value = '__custom__';
                                        handleVarChange(key, '__custom__', select);
                                        const customInput = document.querySelector(`#customInput_${key} input`);
                                        if (customInput) {
                                            customInput.value = state.customInputValues[key];
                                            updateCustomInput(key, state.customInputValues[key]);
                                        }
                                    } else {
                                        select.value = state.currentValues[key];
                                        handleVarChange(key, state.currentValues[key], select);
                                    }
                                }
                            });
                        }

                        // 恢复多选值
                        if (state.multiSelectValues) {
                            multiSelectValues = state.multiSelectValues;
                            Object.keys(state.multiSelectValues).forEach(key => {
                                const values = state.multiSelectValues[key] || [];
                                values.forEach(val => {
                                    const checkbox = document.querySelector(`input[type="checkbox"][value="${val.replace(/"/g, '&quot;')}"]`);
                                    if (checkbox) {
                                        checkbox.checked = true;
                                    }
                                });
                                currentValues[key] = values.join('\n');
                                const preview = document.getElementById(`multiSelectPreview_${key}`);
                                if (preview && values.length > 0) {
                                    preview.textContent = `✅ 已选择 ${values.length} 项`;
                                }
                            });
                        }

                        // 恢复填空值
                        if (state.blankValues) {
                            blankValues = state.blankValues;
                            Object.keys(state.blankValues).forEach(key => {
                                (state.blankValues[key] || []).forEach((val, idx) => {
                                    const input = document.getElementById(`blank_${key}_${idx}`);
                                    if (input && val) {
                                        input.value = val;
                                    }
                                });
                            });
                        }

                        // 恢复预览内容
                        if (state.previewContent) {
                            document.getElementById('previewBox').textContent = state.previewContent;
                            document.getElementById('previewSection').style.display = 'block';
                            if (state.resultSectionVisible) {
                                document.getElementById('resultSection').style.display = 'block';
                            }
                        }
                    }, 100);
                } else if (state.previewContent) {
                    // 没有模板但有预览内容（直接输入主题生成的）
                    document.getElementById('previewBox').textContent = state.previewContent;
                    document.getElementById('previewSection').style.display = 'block';
                    if (state.resultSectionVisible) {
                        document.getElementById('resultSection').style.display = 'block';
                    }
                }

                console.log('[prompt-fill] 状态恢复完成');
            } catch (e) {
                console.warn('[prompt-fill] 恢复状态失败:', e);
            }
        }

        // 绑定状态保存事件
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) savePromptFillState();
        });
        window.addEventListener('beforeunload', savePromptFillState);
        window.addEventListener('pagehide', savePromptFillState);
        window.addEventListener('load', () => setTimeout(restorePromptFillState, 300));
    </script>
</body>
