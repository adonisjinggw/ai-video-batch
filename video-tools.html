<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 视频工具 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .tabs {
            display: flex;
            padding: 12px 20px;
            gap: 8px;
            border-bottom: 1px solid #222;
        }

        .tab {
            flex: 1;
            padding: 10px;
            background: var(--bg-card);
            border: none;
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 13px;
            cursor: pointer;
        }

        .tab.active {
            background: var(--accent);
            color: #000;
        }

        .main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            color: var(--text);
            font-size: 16px;
            resize: none;
            min-height: 100px;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .settings-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .setting-item {
            flex: 1;
        }

        .setting-item label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .setting-item select,
        .setting-item input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .generate-btn:disabled {
            opacity: 0.5;
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed #333;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
        }

        .upload-area .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .upload-preview {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 12px;
            display: none;
        }

        .result-section {
            margin-top: 24px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            display: none;
        }

        .result-title {
            font-size: 16px;
            margin-bottom: 16px;
        }

        .result-video {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .result-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-input);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .result-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>🎬 视频工具</h1>
        <div style="width:50px;"></div>
    </header>
    <div class="tabs">
        <button class="tab active" onclick="switchPanel('t2v')">📝 文生</button>
        <button class="tab" onclick="switchPanel('i2v')">🖼️ 图生</button>
        <button class="tab" onclick="switchPanel('batch')">🎯 批量</button>
        <button class="tab" onclick="switchPanel('ref')">🔗 克隆</button>
        <button class="tab" onclick="switchPanel('gif')">🎞️ 转GIF</button>
    </div>
    <main class="main">
        <div class="panel active" id="panel-t2v">
            <div class="input-section">
                <label class="input-label">✨ 描述你想要的视频内容</label>
                <textarea class="input-box" id="t2vPrompt" placeholder="例如：一只可爱的猫咪在草地上奔跑..."></textarea>
            </div>
            <div class="settings-row">
                <div class="setting-item"><label>模型</label>
                    <select id="t2vModel">
                        <option value="sora-2-all">Sora-2 (15秒)</option>
                        <option value="sora-2-pro-all">Sora-2 Pro (15秒)</option>
                        <optgroup label="🌟 Veo 3.1 系列 (4K+音频)">
                            <option value="veo3.1-components-4k">Veo 3.1 4K (推荐)</option>
                            <option value="veo_3_1-fast-4K">Veo 3.1 Fast 4K (快速)</option>
                            <option value="veo_3_1-fast-components-4K">Veo 3.1 Fast Components</option>
                            <option value="veo_3_1-components-4K">Veo 3.1 Components 4K</option>
                        </optgroup>
                        <optgroup label="🎬 Vidu 系列 - 5秒">
                            <option value="vidu-q2-5s-720p">Vidu q2 5秒 720P (25胶片)</option>
                            <option value="vidu-q2-5s-1080p">Vidu q2 5秒 1080P (36胶片)</option>
                            <option value="vidu-q2-pro-5s-720p">Vidu q2-pro 5秒 720P (27胶片)</option>
                            <option value="vidu-q2-pro-5s-1080p">Vidu q2-pro 5秒 1080P (54胶片)</option>
                            <option value="vidu-q2-turbo-5s-720p">Vidu q2-turbo 5秒 720P (19胶片/最快)</option>
                            <option value="vidu-q2-turbo-5s-1080p">Vidu q2-turbo 5秒 1080P (36胶片)</option>
                        </optgroup>
                        <optgroup label="🎬 Vidu 系列 - 10秒">
                            <option value="vidu-q2-10s-720p">Vidu q2 10秒 720P (50胶片)</option>
                            <option value="vidu-q2-10s-1080p">Vidu q2 10秒 1080P (72胶片)</option>
                            <option value="vidu-q2-pro-10s-720p">Vidu q2-pro 10秒 720P (54胶片)</option>
                            <option value="vidu-q2-pro-10s-1080p">Vidu q2-pro 10秒 1080P (108胶片)</option>
                            <option value="vidu-q2-turbo-10s-720p">Vidu q2-turbo 10秒 720P (38胶片)</option>
                            <option value="vidu-q2-turbo-10s-1080p">Vidu q2-turbo 10秒 1080P (72胶片)</option>
                        </optgroup>
                        <option value="grok-video-3">Grok Video (6秒)</option>
                    </select>
                </div>
                <div class="setting-item"><label>比例</label>
                    <select id="t2vRatio">
                        <option value="16:9">16:9 横屏</option>
                        <option value="9:16">9:16 竖屏</option>
                        <option value="1:1">1:1 方形</option>
                    </select>
                </div>
            </div>
            <button class="generate-btn" onclick="generateT2V()">⚡ 生成视频</button>
            <div class="loading" id="t2vLoading">
                <div class="spinner"></div>
                <div>视频生成中，大约需要1-3分钟...</div>
            </div>
            <div class="result-section" id="t2vResult">
                <div class="result-title">🎬 生成结果</div><video class="result-video" id="t2vVideo" controls
                    playsinline></video>
                <div class="result-actions"><button class="result-btn" onclick="downloadVideo('t2v')">⬇️
                        下载</button><button class="result-btn primary" onclick="generateT2V()">🔄 重新生成</button></div>
            </div>
        </div>
        <div class="panel" id="panel-i2v">
            <div class="input-section">
                <label class="input-label">🖼️ 上传参考图片</label>
                <input type="file" id="i2vImageInput" accept="image/*" style="display:none"
                    onchange="previewI2VImage(this)">
                <div class="upload-area" onclick="document.getElementById('i2vImageInput').click()">
                    <div class="icon">📷</div>
                    <div>点击上传图片</div><img class="upload-preview" id="i2vPreview">
                </div>
            </div>
            <div class="input-section"><label class="input-label">✨ 动作描述（可选）</label><textarea class="input-box"
                    id="i2vPrompt" placeholder="例如：图片中的人物转头微笑..." style="min-height:60px;"></textarea></div>
            <div class="settings-row">
                <div class="setting-item"><label>模型</label><select id="i2vModel">
                        <option value="sora-2-all">Sora-2 (15秒)</option>
                        <option value="sora-2-pro-all">Sora-2 Pro (15秒)</option>
                        <optgroup label="🌟 Veo 3.1 系列 (4K+音频)">
                            <option value="veo3.1-components-4k">Veo 3.1 4K (推荐)</option>
                            <option value="veo_3_1-fast-4K">Veo 3.1 Fast 4K (快速)</option>
                            <option value="veo_3_1-fast-components-4K">Veo 3.1 Fast Components</option>
                            <option value="veo_3_1-components-4K">Veo 3.1 Components 4K</option>
                        </optgroup>
                        <option value="grok-video-3">Grok Video (6秒)</option>
                    </select></div>
                <div class="setting-item"><label>比例</label><select id="i2vRatio">
                        <option value="16:9">16:9 横屏</option>
                        <option value="9:16">9:16 竖屏</option>
                        <option value="1:1">1:1 方形</option>
                    </select></div>
            </div>
            <button class="generate-btn" onclick="generateI2V()">⚡ 生成视频</button>
            <div class="loading" id="i2vLoading">
                <div class="spinner"></div>
                <div>视频生成中...</div>
            </div>
            <div class="result-section" id="i2vResult">
                <div class="result-title">🎬 生成结果</div><video class="result-video" id="i2vVideo" controls
                    playsinline></video>
                <div class="result-actions"><button class="result-btn" onclick="downloadVideo('i2v')">⬇️
                        下载</button><button class="result-btn primary" onclick="generateI2V()">🔄 重新生成</button></div>
            </div>
        </div>
        <!-- 🎯 批量视频生成面板 -->
        <div class="panel" id="panel-batch">
            <div class="input-section">
                <label class="input-label">🎯 批量生成模式</label>
                <select id="batchMode" onchange="onBatchModeChange()" style="width:100%;padding:12px;background:var(--bg-input);border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;margin-bottom:12px;">
                    <option value="t2v">📝 文生视频 - 多个提示词并发生成</option>
                    <option value="i2v">🖼️ 图生视频 - 多张图片并发生成</option>
                </select>
            </div>
            
            <!-- 文生视频批量输入 -->
            <div id="batchT2vSection">
                <div class="input-section">
                    <label class="input-label">✨ 输入多个提示词（每行一个）</label>
                    <textarea class="input-box" id="batchPrompts" placeholder="例如：
一只可爱的猫咪在草地上奔跑
日落时分的海边，海浪轻轻拍打沙滩
城市夜景，霉虹灯闪烁，车流不息" style="min-height:150px;"></textarea>
                    <div style="font-size:11px;color:#888;margin-top:4px;">💡 每行一个提示词，最多支持 6 个并发</div>
                </div>
            </div>
            
            <!-- 图生视频批量输入 - 九宫格布局 -->
            <div id="batchI2vSection" style="display:none;">
                <div class="input-section">
                    <label class="input-label">🖼️ 上传多张图片（无限制）</label>
                    <input type="file" id="batchImageInput" accept="image/*" multiple style="display:none" onchange="handleBatchImageUpload(this)">
                    <div class="upload-area" onclick="document.getElementById('batchImageInput').click()" style="min-height:80px;padding:16px;">
                        <div class="icon">📷</div>
                        <div>点击上传多张图片</div>
                    </div>
                </div>
                <!-- 九宫格图片预览，每张图片有独立提示词输入 -->
                <div id="batchImagePreview" style="display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                        <label class="input-label" style="margin:0;">🎯 为每张图片设置提示词（留空则智能生成）</label>
                        <button onclick="clearBatchImages()" style="padding:6px 12px;background:#ef4444;border:none;border-radius:6px;color:#fff;font-size:11px;cursor:pointer;">❌ 清空</button>
                    </div>
                    <div id="batchImageGrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"></div>
                </div>
            </div>
            
            <div class="settings-row">
                <div class="setting-item"><label>模型</label>
                    <select id="batchModel">
                        <option value="sora-2-all">Sora-2 (15秒)</option>
                        <option value="sora-2-pro-all">Sora-2 Pro (15秒)</option>
                        <optgroup label="🌟 Veo 3.1 系列 (4K+音频)">
                            <option value="veo3.1-components-4k">Veo 3.1 4K (推荐)</option>
                            <option value="veo_3_1-fast-4K">Veo 3.1 Fast 4K (快速)</option>
                            <option value="veo_3_1-fast-components-4K">Veo 3.1 Fast Components</option>
                            <option value="veo_3_1-components-4K">Veo 3.1 Components 4K</option>
                        </optgroup>
                        <optgroup label="🎬 Vidu 系列 - 5秒">
                            <option value="vidu-q2-5s-720p">Vidu q2 5秒 720P (25胶片)</option>
                            <option value="vidu-q2-5s-1080p">Vidu q2 5秒 1080P (36胶片)</option>
                            <option value="vidu-q2-pro-5s-720p">Vidu q2-pro 5秒 720P (27胶片)</option>
                            <option value="vidu-q2-pro-5s-1080p">Vidu q2-pro 5秒 1080P (54胶片)</option>
                            <option value="vidu-q2-turbo-5s-720p">Vidu q2-turbo 5秒 720P (19胶片/最快)</option>
                            <option value="vidu-q2-turbo-5s-1080p">Vidu q2-turbo 5秒 1080P (36胶片)</option>
                        </optgroup>
                        <optgroup label="🎬 Vidu 系列 - 10秒">
                            <option value="vidu-q2-10s-720p">Vidu q2 10秒 720P (50胶片)</option>
                            <option value="vidu-q2-10s-1080p">Vidu q2 10秒 1080P (72胶片)</option>
                            <option value="vidu-q2-pro-10s-720p">Vidu q2-pro 10秒 720P (54胶片)</option>
                            <option value="vidu-q2-pro-10s-1080p">Vidu q2-pro 10秒 1080P (108胶片)</option>
                            <option value="vidu-q2-turbo-10s-720p">Vidu q2-turbo 10秒 720P (38胶片)</option>
                            <option value="vidu-q2-turbo-10s-1080p">Vidu q2-turbo 10秒 1080P (72胶片)</option>
                        </optgroup>
                        <option value="grok-video-3">Grok Video (6秒)</option>
                    </select>
                </div>
                <div class="setting-item"><label>比例</label>
                    <select id="batchRatio">
                        <option value="16:9">16:9 横屏</option>
                        <option value="9:16">9:16 竖屏</option>
                        <option value="1:1">1:1 方形</option>
                    </select>
                </div>
            </div>
            
            <button class="generate-btn" onclick="generateBatch()">🚀 并发生成视频</button>
            
            <!-- 批量生成进度 -->
            <div id="batchProgress" style="display:none;margin-top:20px;padding:16px;background:var(--bg-card);border-radius:12px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                    <span id="batchProgressText">🚀 批量生成中...</span>
                    <span id="batchProgressCount">0/0</span>
                </div>
                <div style="height:6px;background:#333;border-radius:3px;overflow:hidden;">
                    <div id="batchProgressBar" style="height:100%;background:var(--accent);width:0%;transition:width 0.3s;"></div>
                </div>
            </div>
            
            <!-- 批量生成结果 -->
            <div id="batchResult" style="display:none;margin-top:20px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                    <div class="result-title" style="margin:0;">🎬 批量生成结果</div>
                    <button onclick="downloadAllBatchVideos()" style="padding:8px 16px;background:var(--accent);border:none;border-radius:6px;color:#000;font-size:12px;cursor:pointer;">📦 下载全部</button>
                </div>
                <div id="batchVideoGrid" style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px;"></div>
            </div>
        </div>
        
        <div class="panel" id="panel-ref">
            <div class="input-section">
                <label class="input-label">📁 上传参考视频或输入URL</label>
                <input type="file" id="refVideoInput" accept="video/*" onchange="previewRefVideo(this)"
                    style="width:100%;background:var(--bg-input);border:1px solid #333;border-radius:8px;padding:12px;color:var(--text);margin-bottom:12px;">
                <input type="text" id="refUrl" placeholder="或输入视频URL..."
                    style="width:100%;background:var(--bg-input);border:1px solid #333;border-radius:8px;padding:12px;color:var(--text);margin-bottom:12px;">
                <video id="refPreviewVideo" controls style="width:100%;display:none;border-radius:8px;"></video>
            </div>
            <div class="input-section"><label class="input-label">✨ 克隆提示词</label><textarea class="input-box"
                    id="refPrompt" placeholder="例如：保持视频风格，但把主角换成一只熊猫..." style="min-height:80px;"></textarea></div>
            <div class="settings-row">
                <div class="setting-item"><label>模型</label><select id="refModel">
                        <option value="sora-2-all">Sora-2 (15秒)</option>
                        <option value="sora-2-pro-all">Sora-2 Pro (15秒)</option>
                        <option value="veo3.1">Veo 3.1 4K (8秒)</option>
                        <option value="grok-video-3">Grok Video (6秒)</option>
                    </select></div>
                <div class="setting-item"><label>比例</label><select id="refRatio">
                        <option value="16:9">16:9</option>
                        <option value="9:16">9:16</option>
                        <option value="1:1">1:1</option>
                    </select></div>
            </div>
            <button class="generate-btn" onclick="generateRef()">⚡ 克隆视频</button>
            <div class="loading" id="refLoading">
                <div class="spinner"></div>
                <div>视频克隆中...</div>
            </div>
            <div class="result-section" id="refResult">
                <div class="result-title">🎬 克隆结果</div><video class="result-video" id="refVideo" controls
                    playsinline></video>
                <div class="result-actions"><button class="result-btn" onclick="downloadVideo('ref')">⬇️
                        下载</button><button class="result-btn primary" onclick="generateRef()">🔄 重新克隆</button></div>
            </div>
        </div>
        
        <!-- 🎞️ 视频转 GIF 面板 -->
        <div class="panel" id="panel-gif">
            <div class="input-section">
                <label class="input-label">🎬 上传视频（支持 MP4/WebM/MOV）</label>
                <input type="file" id="gifVideoInput" accept="video/*" style="display:none" onchange="previewGifVideo(this)">
                <div class="upload-area" onclick="document.getElementById('gifVideoInput').click()">
                    <div class="icon">🎬</div>
                    <div>点击上传视频</div>
                </div>
                <video id="gifVideoPreview" controls playsinline style="width:100%;display:none;border-radius:8px;margin-top:12px;max-height:300px;"></video>
            </div>
            
            <!-- 视频片段选择 -->
            <div id="gifTimeRange" style="display:none;">
                <div class="input-section">
                    <label class="input-label">✂️ 选择转换片段（建议不超过10秒）</label>
                    <div class="settings-row">
                        <div class="setting-item">
                            <label>开始时间 (秒)</label>
                            <input type="number" id="gifStartTime" value="0" min="0" step="0.1" oninput="updateGifPreviewTime()">
                        </div>
                        <div class="setting-item">
                            <label>结束时间 (秒)</label>

        function compressImage(dataUrl, maxWidth = 1200, quality = 0.8) {
            return new Promise((resolve) => {

                img.onload = () => {
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
                    const canvas = document.createElement('canvas');
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        // 预扣费函数
        async function preDeduct(cost, description) {
            // 🔧 修复：确保cost是整数（数据库是INTEGER类型）
            cost = Math.ceil(cost);
            
            // 等待认证初始化完成

                }
            }
            
            if (!currentUser) { showToast('请先登录'); return false; }
            if (userQuota < cost) { showToast(`胶片不足，需要${cost}胶片`); return false; }
            try {
                const res = await fetch('/api/supabase-proxy', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consume', userId: currentUser.id, amount: cost, description })
                });
                const data = await res.json().catch(() => ({}));
                
                // 🔧 修复：先检查 HTTP 状态码
                if (!res.ok) {
                    if (res.status === 400 && data.error === 'INSUFFICIENT_BALANCE') {
                        throw new Error('余额不足，请先充值');
                    }
                    throw new Error(data.message || data.error || `服务器错误: ${res.status}`);
                }
                
                if (data.success || data.newBalance !== undefined) {
                    userQuota = data.newBalance ?? data.quotaBalance ?? userQuota - cost;
                    localStorage.setItem('film_balance', String(userQuota));
                    console.log(`🎞️ 预扣费成功: -${cost}胶片, 余额=${userQuota}`);
                    return true;

                showToast('正在上传视频...');

                const binary = atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                const blob = new Blob([bytes], { type: 'video/mp4' });
                
                const formData = new FormData();
                formData.append('reqtype', 'fileupload');
                formData.append('fileToUpload', blob, 'video.mp4');
                
                const res = await fetch('https://catbox.moe/user/api.php', {

                    body: formData

        function getFixedDuration(model) { 
            if (model.includes('grok')) return 6; 
            if (model.includes('veo')) return 8; 
            // Vidu模型：从模型名提取时长 (vidu-q2-5s-720p -> 5, vidu-q2-10s-1080p -> 10)
            if (model.includes('vidu')) {
                const durationMatch = model.match(/-(\d+)s-/i);
                return durationMatch ? parseInt(durationMatch[1]) : 5;  // 默认5秒
            }
            return 15; 
        }
        // 🎬 判断是否是Veo模型（需要特殊API处理）
        function isVeoModel(model) { return model && (model.includes('veo') || model.startsWith('veo')); }
        // 🎬 判断是否是Vidu模型
        function isViduModel(model) { return model && model.startsWith('vidu-'); }
        // 🎬 解析Vidu模型参数 (vidu-q2-5s-720p -> { version: 'q2', duration: 5, resolution: '720P' })
        function parseViduModel(model) {
            // 新格式: vidu-{version}-{duration}s-{resolution}
            const newMatch = model.match(/vidu-(q2-pro|q2-turbo|q2)-(\d+)s-(720p|1080p)/i);
            if (newMatch) {
                return {
                    version: newMatch[1],                    // q2, q2-pro, q2-turbo
                    duration: parseInt(newMatch[2]),         // 5, 10
                    resolution: newMatch[3].toUpperCase()    // 720P, 1080P
                };
            }
            // 兼容旧格式: vidu-{version}-{resolution}
            const oldMatch = model.match(/vidu-(q2-pro|q2-turbo|q2)-(720p|1080p)/i);
            if (oldMatch) {
                return {
                    version: oldMatch[1],
                    duration: 5,  // 旧格式默认5秒
                    resolution: oldMatch[2].toUpperCase()
                };
            }
            return { version: 'q2', duration: 5, resolution: '720P' };
        }

★ REMOVE: All colors, textures, skin details, realistic features

The result should look like a simple black-and-white pencil sketch or blueprint.`;

                const data = await res.json().catch(() => ({}));
                if (res.ok && data.success) {

                    if (sketchUrl) {

                console.warn('[video-tools] 线稿转换失败:', data.message || data.error || '未知错误');

        // 🎯 处理提示词：添加中文语音指令 + 强制语音在视频结束前1秒结束
        function ensureChineseAudio(prompt, duration = 15) {
            // 🔧 计算语音必须结束的时间点（视频时长-1秒）
            const audioEndTime = Math.max(duration - 1, 3);
            const audioDurationHint = `【重要】所有语音/旁白/对话必须在第${audioEndTime}秒前结束，最后1秒保持静音画面`;
            
            if (!prompt) return `让图片动起来，平滑过渡，使用中文配音。${audioDurationHint}`;
            const lower = prompt.toLowerCase();
            // 检测用户是否明确要求英文
            const wantsEnglish = lower.includes('english') || lower.includes('in english') || lower.includes('英文配音') || lower.includes('英语旁白');
            // 检测是否已包含中文语音指令
            const hasChineseAudio = prompt.includes('中文配音') || prompt.includes('中文旁白') || prompt.includes('普通话');
            // 检测是否已包含时长控制指令
            const hasTimeControl = prompt.includes('秒前结束') || prompt.includes('静音画面') || prompt.includes('结束语音');
            
            let result = prompt;
            // 添加中文语音指令（如果用户没要求英文且未包含）
            if (!wantsEnglish && !hasChineseAudio) {
                result += '，使用中文配音';
            }
            // 添加时长控制指令（如果未包含）
            if (!hasTimeControl) {
                result += `。${audioDurationHint}`;
            }
            return result;
        }

        // 轮询视频生成结果
        async function pollVideoResult(taskId, source, endpoint, isVeo = false) {
            const maxAttempts = 60;
            // 🎬 Veo使用yunwu API轮询，其他使用sora2
            const pollEndpoint = isVeo ? '/api/yunwu' : '/api/sora2';
            for (let i = 0; i < maxAttempts; i++) {
                await new Promise(r => setTimeout(r, 5000));
                try {
                    // 🔧 修复：轮询请求必须包含 userId，否则后端返回 401
                    // 🔧 2026-01-23：Veo 和 Sora2 都使用统一的 action: 'poll'
                    const pollBody = isVeo 
                        ? { action: 'poll', task_id: taskId, userId: currentUser?.id }
                        : { action: 'poll', task_id: taskId, _source: source, _endpoint: endpoint, userId: currentUser?.id };
                    const res = await fetch(pollEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(pollBody)
                    });
                    if (!res.ok) {
                        console.warn(`[轮询] 第${i+1}次失败: ${res.status}`);
                        continue;
                    }
                    const data = await res.json();
                    const status = (data.status || data.state || '').toUpperCase();
                    if (status === 'COMPLETED' || status === 'SUCCEEDED' || status === 'SUCCESS' || status === 'DONE') {
                        return data.output_url || data.video_url || data.url || data.data?.output_url || data.data?.video_url;
                    }
                    if (status === 'FAILED' || status === 'ERROR') {
                        throw new Error(data.error || data.message || '视频生成失败');
                    }
                    console.log(`[轮询] 第${i+1}次, 状态: ${status || 'PENDING'}`);
                } catch (e) { if (e.message.includes('失败')) throw e; }
            }
            throw new Error('视频生成超时');
        }

            batchImagePrompts = [];
            document.getElementById('batchImageGrid').innerHTML = '';
            document.getElementById('batchImagePreview').style.display = 'none';
            document.getElementById('batchImageInput').value = '';
        }
        
        // 批量生成主函数
        async function generateBatch() {
            const mode = document.getElementById('batchMode').value;
            let model = document.getElementById('batchModel').value;
            const ratio = document.getElementById('batchRatio').value;
            
            // 🔧 修复：规范化 Veo 模型名称（下划线转点号），在获取duration之前处理
            if (model && model.includes('veo_')) {
                const oldModel = model;
                model = model.replace(/_/g, '.');
                console.log('[batch] 规范化Veo模型名:', oldModel, '->', model);
            }
            
            const duration = getFixedDuration(model);
            const cost = VIDEO_COST[model] || VIDEO_COST['veo3.1'] || 30;
            const isVeo = isVeoModel(model);
            const isVidu = model && model.toLowerCase().includes('vidu');
            
            let tasks = [];
            
            if (mode === 't2v') {
                // 文生视频模式：解析多行提示词
                const prompts = document.getElementById('batchPrompts').value
                    .split('\n')
                    .map(p => p.trim())
                    .filter(p => p.length > 0);  // 无限制
                
                if (prompts.length === 0) {
                    showToast('请输入至少一个提示词');
                    return;
                }
                tasks = prompts.map(prompt => ({ type: 't2v', prompt }));
            } else {
                // 图生视频模式 - 每张图片使用独立提示词
                if (batchImages.length === 0) {
                    showToast('请先上传图片');
                    return;
                }
                // 每张图片使用独立提示词，留空则智能生成
                tasks = batchImages.map((img, i) => ({ 
                    type: 'i2v', 
                    image: img, 
                    prompt: batchImagePrompts[i]?.trim() || ''  // 留空表示智能生成
                }));
            }
            
            const totalCost = tasks.length * cost;
            
            // 🔧 修复：等待认证初始化完成后再检查登录状态
            if (!authInitialized) {
                showToast('正在初始化，请稍候...');
                const waitStart = Date.now();
                while (!authInitialized && (Date.now() - waitStart) < 5000) {
                    await new Promise(r => setTimeout(r, 200));
                }
                // 重新检查用户状态
                if (!currentUser) {
                    await checkUser();
                }
            }
            
            // 检查登录和余额
            if (!currentUser) {
                showToast('请先登录');
                return;
            }
            if (userQuota < totalCost) {
                showToast(`胶片不足，需要 ${totalCost} 胶片`);
                return;
            }
            
            // 确认
            const modelName = isVidu ? 'Vidu' : model.includes('veo') ? 'Veo 3.1 4K' : model.includes('grok') ? 'Grok Video' : 'Sora-2';
            if (!confirm(`将使用 ${modelName} 并发生成 ${tasks.length} 个视频\n共需 ${totalCost} 胶片，确认继续？`)) {
                return;
            }
            
            // 预扣费
            if (!await preDeduct(totalCost, `批量${mode === 't2v' ? '文' : '图'}生视频x${tasks.length}`)) {
                return;
            }
            
            // 显示进度
            batchGenerating = true;
            document.getElementById('batchProgress').style.display = 'block';
            document.getElementById('batchResult').style.display = 'none';
            document.getElementById('batchVideoGrid').innerHTML = '';
            batchVideoResults = [];
            saveBatchState();
            
            let completed = 0;
            const total = tasks.length;
            
            function updateProgress(text, subText = '') {
                document.getElementById('batchProgressText').textContent = text || `🚀 批量生成中...`;
                document.getElementById('batchProgressCount').textContent = `${completed}/${total}`;
                document.getElementById('batchProgressBar').style.width = `${(completed/total)*100}%`;
            }
            updateProgress(`🚀 已提交 ${total} 个任务，等待生成中...`);
            
            // 🎨 2026-01-23：非Vidu模型的图生视频先并发转线稿（规避 Veo/Sora2 内容审核）
            // Vidu 模型不需要转换，直接使用原图
            if (mode === 'i2v' && !isVidu) {
                updateProgress(`🎨 正在并发转换${total}张图片为线稿风格...`);
                const sketchPromises = tasks.map(async (task) => {
                    if (task.image) {
                        task.image = await convertToSketch(task.image);
                    }
                });
                await Promise.all(sketchPromises);
                console.log(`[video-tools] ✅ ${total}张图片线稿转换完成`);
                updateProgress(`🚀 线稿转换完成，开始生成视频...`);
            }
            
            // 🚀 并发执行所有任务
            // Vidu 和 Veo 都走 yunwu API，其他走 sora2 API
            const apiEndpoint = (isVeo || isVidu) ? '/api/yunwu' : '/api/sora2';
            
            // 🎯 处理提示词：添加中文语音指令 + 强制语音在视频结束前1秒结束
            const audioEndTime = Math.max(duration - 1, 3);
            const audioDurationHint = `【重要】所有语音/旁白/对话必须在第${audioEndTime}秒前结束，最后1秒保持静音画面`;
            
            const processPrompt = (prompt, isI2v = false) => {
                // 如果是图生视频且提示词为空，让AI智能生成
                if (isI2v && !prompt) {
                    return `根据图片内容智能生成动画，使用中文配音。${audioDurationHint}`;
                }
                if (!prompt) return `使用中文配音。${audioDurationHint}`;
                const lower = prompt.toLowerCase();
                // 检测用户是否明确要求英文
                const wantsEnglish = lower.includes('english') || lower.includes('in english') || lower.includes('英文配音') || lower.includes('英语旁白');
                // 检测是否已包含中文语音指令
                const hasChineseAudio = prompt.includes('中文配音') || prompt.includes('中文旁白') || prompt.includes('普通话');
                // 检测是否已包含时长控制指令
                const hasTimeControl = prompt.includes('秒前结束') || prompt.includes('静音画面') || prompt.includes('结束语音');
                
                let result = prompt;
                // 添加中文语音指令
                if (!wantsEnglish && !hasChineseAudio) {
                    result += '，使用中文配音';
                }
                // 添加时长控制指令
                if (!hasTimeControl) {
                    result += `。${audioDurationHint}`;
                }
                return result;
            };
            
            // 🎬 Vidu模型需要解析参数
            const viduParams = isVidu ? parseViduModel(model) : null;
            
            const promises = tasks.map(async (task, index) => {
                try {
                    let requestBody;
                    const finalPrompt = processPrompt(task.prompt, task.type === 'i2v');
                    
                    if (task.type === 't2v') {
                        // 文生视频
                        if (isVidu) {
                            requestBody = { 
                                action: 'vidu', 
                                prompt: finalPrompt, 
                                model_version: viduParams.version,
                                aspect_ratio: ratio, 
                                duration: duration,
                                resolution: viduParams.resolution,
                                userId: currentUser?.id 
                            };
                        } else if (isVeo) {
                            requestBody = { action: 'veo3', prompt: finalPrompt, model, aspect_ratio: ratio, duration, with_audio: true, userId: currentUser?.id };
                        } else {
                            requestBody = { action: 'text-to-video', prompt: finalPrompt, model, aspect_ratio: ratio, duration, userId: currentUser?.id };
                        }
                    } else {
                        // 图生视频
                        if (isVidu) {
                            requestBody = { 
                                action: 'vidu', 
                                prompt: finalPrompt || '让图片动起来，平滑过渡', 
                                image_url: task.image,
                                model_version: viduParams.version,
                                aspect_ratio: ratio, 
                                duration: duration,
                                resolution: viduParams.resolution,
                                userId: currentUser?.id 
                            };
                        } else if (isVeo) {
                            requestBody = { action: 'veo3', prompt: finalPrompt, model, image_url: task.image, aspect_ratio: ratio, duration, with_audio: true, image_weight: 0.9, userId: currentUser?.id };
                        } else {
                            requestBody = { action: 'image-to-video', prompt: finalPrompt, image_url: task.image, model, aspect_ratio: ratio, duration, userId: currentUser?.id };
                        }
                    }
                    
                    const response = await fetch(apiEndpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(requestBody)
                    });
                    
                    const data = await response.json();
                    if (!response.ok || data.error) {
                        throw new Error(data.message || data.error || 'API错误');
                    }
                    
                    // 获取视频URL
                    let videoUrl = data.video_url || data.url;
                    if (!videoUrl && (data.task_id || data.id)) {
                        // 需要轮询（Vidu和Veo都需要）
                        videoUrl = await pollVideoResult(data.task_id || data.id, data._source, data._endpoint, isVeo || isVidu);
                    }
                    
                    if (videoUrl) {
                        return { index, success: true, videoUrl, prompt: task.prompt };
                    }
                    throw new Error('未获取到视频');
                } catch (err) {
                    console.error(`[批量] 第${index + 1}个失败:`, err);
                    return { index, success: false, error: err.message, prompt: task.prompt };
                }
            });
            
            // 等待所有任务完成，实时更新进度
            const results = await Promise.all(promises.map(async (p) => {
                const result = await p;
                completed++;
                if (result.success) {
                    batchVideoResults.push(result);
                    addBatchVideoToGrid(result);
                } else {
                    addBatchVideoToGrid(result);
                }
                updateProgress(`已完成 ${completed}/${total}`);
                saveBatchState();  // 每完成一个任务保存状态
                return result;
            }));
            
            // 完成
            batchGenerating = false;
            document.getElementById('batchProgress').style.display = 'none';
            document.getElementById('batchResult').style.display = 'block';
            saveBatchState();
            
            const successCount = results.filter(r => r.success).length;
            if (successCount > 0) {
                showToast(`✅ 成功生成 ${successCount}/${total} 个视频！`);
            } else {
                showToast('✖ 所有视频生成失败');
            }
        }
        
        // 添加批量视频到网格
        function addBatchVideoToGrid(result) {
            const grid = document.getElementById('batchVideoGrid');
            const item = document.createElement('div');
            item.style.cssText = 'background:var(--bg-card);border-radius:12px;overflow:hidden;';
            
            if (result.success) {
                item.innerHTML = `
                    <video src="${result.videoUrl}" style="width:100%;aspect-ratio:16/9;object-fit:cover;" controls playsinline></video>
                    <div style="padding:8px;">
                        <div style="font-size:11px;color:#888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px;">${result.prompt ? result.prompt.substring(0, 30) + '...' : '🤖 智能生成'}</div>
                        <button onclick="downloadBatchVideo('${result.videoUrl}', ${result.index})" style="width:100%;padding:8px;background:var(--accent);border:none;border-radius:6px;color:#000;font-size:12px;cursor:pointer;">⬇️ 下载</button>
                    </div>

                        #${result.index + 1} 失败<br>${result.error || ''}
                    </div>
                `;

            grid.appendChild(item);
        }

            a.download = `batch_video_${index + 1}_${Date.now()}.mp4`;

        // 下载所有批量视频
        function downloadAllBatchVideos() {
            if (batchVideoResults.length === 0) {
                showToast('没有可下载的视频');
                return;
            }
            batchVideoResults.forEach((item, i) => {
                setTimeout(() => {

                    a.target = '_blank';
                    a.click();
                }, i * 500);

            showToast(`开始下载 ${batchVideoResults.length} 个视频...`);
        }
        
        // ========== 🎞️ 视频转 GIF 功能 ==========
        let gifVideoFile = null;
        let gifBlobUrl = null;
        
        // 预览上传的视频
        function previewGifVideo(input) {
            if (!input.files || !input.files[0]) return;
            gifVideoFile = input.files[0];
            
            const video = document.getElementById('gifVideoPreview');
            const url = URL.createObjectURL(gifVideoFile);
            video.src = url;
            video.style.display = 'block';
            
            video.onloadedmetadata = () => {
                const duration = video.duration;
                document.getElementById('gifDuration').textContent = duration.toFixed(1);
                document.getElementById('gifEndTime').value = Math.min(5, duration).toFixed(1);
                document.getElementById('gifEndTime').max = duration;
                document.getElementById('gifStartTime').max = duration - 0.5;
                document.getElementById('gifTimeRange').style.display = 'block';
                updateGifPreviewTime();
            };
            
            // 隐藏上传区域
            input.parentElement.querySelector('.upload-area').style.display = 'none';
            showToast('视频已加载，请设置转换参数');
        }
        
        // 更新预览时间
        function updateGifPreviewTime() {
            const start = parseFloat(document.getElementById('gifStartTime').value) || 0;
            let end = parseFloat(document.getElementById('gifEndTime').value) || 5;
            const duration = parseFloat(document.getElementById('gifDuration').textContent) || 0;
            
            // 确保结束时间不超过视频时长
            if (end > duration) {
                end = duration;
                document.getElementById('gifEndTime').value = end.toFixed(1);
            }
            // 确保开始时间小于结束时间
            if (start >= end) {
                document.getElementById('gifStartTime').value = Math.max(0, end - 0.5).toFixed(1);
            }
            
            const clipDuration = Math.max(0.5, end - start);
            document.getElementById('gifClipDuration').textContent = clipDuration.toFixed(1);
            
            // 跳转到开始时间预览
            const video = document.getElementById('gifVideoPreview');
            if (video.readyState >= 1) {
                video.currentTime = start;
            }
        }
        
        // 主转换函数
        async function convertToGif() {
            if (!gifVideoFile) {
                showToast('请先上传视频');
                return;
            }
            
            const video = document.getElementById('gifVideoPreview');  // 直接使用预览视频
            const startTime = parseFloat(document.getElementById('gifStartTime').value) || 0;
            const endTime = parseFloat(document.getElementById('gifEndTime').value) || 5;
            const width = parseInt(document.getElementById('gifWidth').value);
            const fps = parseInt(document.getElementById('gifFps').value);
            const quality = document.getElementById('gifQuality').value;
            const loop = parseInt(document.getElementById('gifLoop').value);
            
            if (endTime - startTime > 15) {
                showToast('片段过长，建议不超过10秒');
            }
            
            // 显示加载状态
            document.getElementById('gifLoading').style.display = 'block';
            document.getElementById('gifResult').style.display = 'none';
            document.getElementById('gifProgress').textContent = '准备中...';
            
            try {
                // 等待视频加载完成
                if (video.readyState < 2) {
                    document.getElementById('gifProgress').textContent = '等待视频加载...';
                    await new Promise((resolve, reject) => {
                        const check = () => {
                            if (video.readyState >= 2) resolve();
                            else setTimeout(check, 100);
                        };
                        check();
                        setTimeout(() => resolve(), 5000); // 5秒超时强制继续
                    });
                }
                
                // 创建离屏canvas - 确保所有尺寸是整数
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 360;
                if (!vw || !vh) {
                    throw new Error('无法获取视频尺寸');
                }
                const w = Math.floor(width);
                const h = Math.floor(w * vh / vw);
                if (h <= 0) {
                    throw new Error('视频尺寸异常');
                }
                
                const canvas = document.createElement('canvas');
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                
                // 提取帧
                const frames = [];
                const frameDuration = 1000 / fps;
                const totalFrames = Math.ceil((endTime - startTime) * fps);
                
                document.getElementById('gifLoadingText').textContent = '正在提取帧...';
                
                // 封装seek函数 - 等待帧渲染完成
                const seekAndCapture = (time) => {
                    return new Promise((resolve) => {
                        video.currentTime = time;
                        
                        // 使用 requestVideoFrameCallback 确保帧已渲染（如果支持）
                        if ('requestVideoFrameCallback' in video) {
                            video.requestVideoFrameCallback(() => {
                                ctx.drawImage(video, 0, 0, w, h);
                                resolve();
                            });
                            // 超时保护
                            setTimeout(() => {
                                ctx.drawImage(video, 0, 0, w, h);
                                resolve();
                            }, 300);
                        } else {
                            // 回退方案：等待seeked事件 + 额外延迟
                            const onSeeked = () => {
                                video.removeEventListener('seeked', onSeeked);
                                // 额外等待100ms让帧渲染
                                setTimeout(() => {
                                    ctx.drawImage(video, 0, 0, w, h);
                                    resolve();
                                }, 100);
                            };
                            video.addEventListener('seeked', onSeeked);
                            setTimeout(onSeeked, 400);
                        }
                    });
                };
                
                for (let i = 0; i < totalFrames; i++) {
                    const time = startTime + i / fps;
                    await seekAndCapture(time);
                    
                    // 获取像素数据
                    try {
                        const imageData = ctx.getImageData(0, 0, w, h);
                        frames.push(imageData);
                    } catch (e) {
                        console.warn('帧提取失败，跳过:', e.message);
                    }
                    
                    document.getElementById('gifProgress').textContent = `提取帧: ${i + 1}/${totalFrames}`;
                    
                    // 让UI更新
                    await new Promise(r => setTimeout(r, 0));
                }
                
                if (frames.length === 0) {
                    throw new Error('未能提取任何帧，请尝试其他视频');
                }
                
                // 生成GIF
                document.getElementById('gifLoadingText').textContent = '正在生成GIF...';
                document.getElementById('gifProgress').textContent = '编码中...';
                
                const gifBlob = await createGifFromFrames(frames, w, h, frameDuration, quality, loop, (progress) => {
                    document.getElementById('gifProgress').textContent = `编码: ${Math.round(progress * 100)}%`;
                });
                
                // 显示结果
                if (gifBlobUrl) URL.revokeObjectURL(gifBlobUrl);
                gifBlobUrl = URL.createObjectURL(gifBlob);
                
                document.getElementById('gifOutput').src = gifBlobUrl;
                document.getElementById('gifInfo').textContent = `尺寸: ${w}×${h} | 帧数: ${frames.length} | 大小: ${(gifBlob.size / 1024 / 1024).toFixed(2)} MB`;
                document.getElementById('gifLoading').style.display = 'none';
                document.getElementById('gifResult').style.display = 'block';
                
                showToast('🎉 GIF生成成功！');
                
            } catch (err) {
                console.error('GIF转换失败:', err);
                document.getElementById('gifLoading').style.display = 'none';
                showToast('转换失败: ' + err.message);
            }
        }
        
        // 使用纯JS生成GIF（简化版GIF编码器）
        async function createGifFromFrames(frames, width, height, delay, quality, loop, onProgress) {
            // 质量映射到颜色数量
            const colorBits = { low: 4, medium: 6, high: 8 }[quality] || 6;
            const colorCount = 1 << colorBits;
            
            const encoder = new GifEncoder(width, height, loop);
            
            for (let i = 0; i < frames.length; i++) {
                encoder.addFrame(frames[i].data, delay, colorBits);
                if (onProgress) onProgress((i + 1) / frames.length);
                // 让UI更新
                await new Promise(r => setTimeout(r, 0));
            }
            
            return encoder.finish();
        }
        
        // 简化版GIF编码器
        class GifEncoder {
            constructor(width, height, loop) {
                this.width = width;
                this.height = height;
                this.loop = loop;
                this.frames = [];
                this.data = [];
            }
            
            addFrame(pixels, delay, colorBits) {
                // 量化颜色
                const colorCount = 1 << colorBits;
                const { palette, indexed } = this.quantize(pixels, colorCount);
                this.frames.push({ palette, indexed, delay: Math.round(delay / 10), colorBits });
            }
            
            // 简单的中位切分颜色量化
            quantize(pixels, colorCount) {
                // 收集所有颜色
                const colors = [];
                for (let i = 0; i < pixels.length; i += 4) {
                    colors.push([pixels[i], pixels[i + 1], pixels[i + 2]]);
                }
                
                // 使用简单的均匀采样生成调色板
                const palette = this.buildPalette(colors, colorCount);
                
                // 将像素映射到调色板索引
                const indexed = new Uint8Array(this.width * this.height);
                for (let i = 0; i < colors.length; i++) {
                    indexed[i] = this.findClosestColor(colors[i], palette);
                }
                
                return { palette, indexed };
            }
            
            buildPalette(colors, count) {
                // 简单采样生成调色板
                const step = Math.max(1, Math.floor(colors.length / count));
                const palette = [];
                const seen = new Set();
                
                for (let i = 0; i < colors.length && palette.length < count; i += step) {
                    const key = colors[i].join(',');
                    if (!seen.has(key)) {
                        seen.add(key);
                        palette.push(colors[i]);
                    }
                }
                
                // 填充剩余
                while (palette.length < count) {
                    palette.push([0, 0, 0]);
                }
                
                return palette.slice(0, count);
            }
            
            findClosestColor(color, palette) {
                let minDist = Infinity, minIdx = 0;
                for (let i = 0; i < palette.length; i++) {
                    const d = Math.pow(color[0] - palette[i][0], 2) + 
                              Math.pow(color[1] - palette[i][1], 2) + 
                              Math.pow(color[2] - palette[i][2], 2);
                    if (d < minDist) { minDist = d; minIdx = i; }
                }
                return minIdx;
            }
            
            finish() {
                const stream = [];
                
                // GIF Header
                this.writeString(stream, 'GIF89a');
                
                // Logical Screen Descriptor
                this.writeShort(stream, this.width);
                this.writeShort(stream, this.height);
                stream.push(0x70); // No global color table
                stream.push(0);    // Background color
                stream.push(0);    // Pixel aspect ratio
                
                // Netscape Extension for looping
                if (this.loop !== 1) {
                    stream.push(0x21, 0xFF, 0x0B);
                    this.writeString(stream, 'NETSCAPE2.0');
                    stream.push(0x03, 0x01);
                    this.writeShort(stream, this.loop === 0 ? 0 : this.loop);
                    stream.push(0x00);
                }
                
                // Write frames
                for (const frame of this.frames) {
                    this.writeFrame(stream, frame);
                }
                
                // Trailer
                stream.push(0x3B);
                
                return new Blob([new Uint8Array(stream)], { type: 'image/gif' });
            }
            
            writeFrame(stream, frame) {
                // Graphic Control Extension
                stream.push(0x21, 0xF9, 0x04);
                stream.push(0x04); // Disposal: restore to background
                this.writeShort(stream, frame.delay);
                stream.push(0x00); // No transparent color
                stream.push(0x00);
                
                // Image Descriptor
                stream.push(0x2C);
                this.writeShort(stream, 0); // Left
                this.writeShort(stream, 0); // Top
                this.writeShort(stream, this.width);
                this.writeShort(stream, this.height);
                stream.push(0x80 | (frame.colorBits - 1)); // Local color table
                
                // Local Color Table
                for (const color of frame.palette) {
                    stream.push(color[0], color[1], color[2]);
                }
                
                // LZW Minimum Code Size
                stream.push(frame.colorBits);
                
                // LZW Compressed Data
                const lzw = this.lzwEncode(frame.indexed, frame.colorBits);
                
                // Write in sub-blocks
                for (let i = 0; i < lzw.length; i += 255) {
                    const chunk = lzw.slice(i, i + 255);
                    stream.push(chunk.length);
                    for (const b of chunk) stream.push(b);
                }
                stream.push(0x00); // Block terminator
            }
            
            // LZW编码
            lzwEncode(data, minCodeSize) {
                const clearCode = 1 << minCodeSize;
                const eoiCode = clearCode + 1;
                let codeSize = minCodeSize + 1;
                let nextCode = eoiCode + 1;
                const maxCode = 4096;
                
                const output = [];
                let bits = 0, bitCount = 0;
                
                const writeBits = (code, size) => {
                    bits |= code << bitCount;
                    bitCount += size;
                    while (bitCount >= 8) {
                        output.push(bits & 0xFF);
                        bits >>= 8;
                        bitCount -= 8;
                    }
                };
                
                // Initialize dictionary
                let dict = new Map();
                const resetDict = () => {
                    dict = new Map();
                    for (let i = 0; i < clearCode; i++) {
                        dict.set(String(i), i);
                    }
                    codeSize = minCodeSize + 1;
                    nextCode = eoiCode + 1;
                };
                
                resetDict();
                writeBits(clearCode, codeSize);
                
                let current = String(data[0]);
                for (let i = 1; i < data.length; i++) {
                    const next = String(data[i]);
                    const combined = current + ',' + next;
                    
                    if (dict.has(combined)) {
                        current = combined;
                    } else {
                        writeBits(dict.get(current), codeSize);
                        
                        if (nextCode < maxCode) {
                            dict.set(combined, nextCode++);
                            if (nextCode > (1 << codeSize) && codeSize < 12) {
                                codeSize++;
                            }
                        } else {
                            writeBits(clearCode, codeSize);
                            resetDict();
                        }
                        
                        current = next;
                    }
                }
                
                writeBits(dict.get(current), codeSize);
                writeBits(eoiCode, codeSize);
                
                if (bitCount > 0) {
                    output.push(bits & 0xFF);
                }
                
                return output;
            }
            
            writeString(stream, str) {
                for (let i = 0; i < str.length; i++) {
                    stream.push(str.charCodeAt(i));
                }
            }
            
            writeShort(stream, val) {
                stream.push(val & 0xFF);
                stream.push((val >> 8) & 0xFF);
            }
        }
        
        // 下载GIF
        function downloadGif() {
            if (!gifBlobUrl) {
                showToast('没有可下载的GIF');
                return;
            }
            const a = document.createElement('a');
            a.href = gifBlobUrl;
            a.download = `video_to_gif_${Date.now()}.gif`;
            a.click();
            showToast('GIF下载中...');
        }
    </script>
