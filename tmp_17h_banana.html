            }
            document.getElementById('resultSection').style.display = 'none';
            document.getElementById('batchResultSection').style.display = 'none';
        }

        // 生成图片入口（根据模式分发）
        async function generateImage() {
            console.log('[banana] generateImage 被调用, batchMode=', batchMode);
            if (batchMode) {
                await generateBatchImages();
            } else {
                await generateSingleImage();
            }
        }

        // 🆕 批量生成图片
        async function generateBatchImages() {
            // 🔐 使用 NVAuth.checkAuthStatus 进行可靠的登录状态检查（带自动刷新胶片余额）
            let authResult = { valid: false, user: null, quota: 0 };
            try {
                if (typeof NVAuth !== 'undefined' && typeof NVAuth.checkAuthStatus === 'function') {
                    authResult = await NVAuth.checkAuthStatus(true);  // true = 刷新胶片余额
                } else if (currentUser) {
                    authResult = { valid: true, user: currentUser, quota: userQuota };
                }
            } catch (e) {
                console.error('[banana] 批量模式认证检查异常:', e);
            }

            // 🔄 同步更新登录状态和胶片余额
            if (authResult.valid && authResult.user) {
                currentUser = authResult.user;
                if (authResult.quota !== undefined) {
                    userQuota = authResult.quota;
                    document.getElementById('quotaBadge').textContent = `🎞️ ${userQuota}`;
                }
            }

            // 必须登录
            if (!authResult.valid || !currentUser) {
                showToast('请先登录后使用');
                setTimeout(() => { window.location.href = 'auth.html'; }, 1000);
                return;
            }

            // 🆕 收集非空输入，并读取每个格子的独立配置
            const inputs = [];
            let totalCost = 0;
            // 📷 获取全局摄影角度
            const globalCameraAngle = document.getElementById('cameraAngleSelect')?.value || '';
            for (let i = 0; i < 9; i++) {
                let val = document.getElementById(`batchInput${i}`)?.value.trim();
                if (val) {
                    // 📷 添加摄影角度到 prompt
                    if (globalCameraAngle) {
                        val = `${val}, ${globalCameraAngle}`;
                    }
                    const cellModel = batchCellConfigs[i].model || 'nano-banana-2';
                    const cellRatio = batchCellConfigs[i].ratio || '1:1';
                    const cellRef = batchCellConfigs[i].refImage || null;
                    const cellCost = FILM_COST[cellModel] || 0;
                    inputs.push({
                        index: i,
                        prompt: val,
                        model: cellModel,
                        ratio: cellRatio,
                        refImage: cellRef
                    });
                    totalCost += cellCost;
                }
            }

            if (inputs.length === 0) {
                showToast('请至少输入一个描述');
                return;
            }

            // 配额检查
            if (totalCost > 0 && userQuota < totalCost) {
                showToast(`胶片不足，需要${totalCost}胶片`);
                return;
            }

            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const loadingText = document.getElementById('loadingText');

            btn.disabled = true;
            batchGenerating = true;
            loading.style.display = 'block';
            loadingText.textContent = `正在批量生成 0/${inputs.length}...`;

            // 隐藏单图结果，显示批量结果区域
            document.getElementById('resultSection').style.display = 'none';

            batchResults = [];
            let completed = 0;

            // 并发生成（每个格子使用独立配置）
            try {
                const promises = inputs.map(async (item) => {
                    const gridItem = document.querySelector(`#batchGrid .batch-item:nth-child(${item.index + 1})`);
                    if (gridItem) gridItem.classList.add('generating');

                    // 🆕 使用每个格子的独立配置
                    const cellModel = item.model;
                    const cellRatio = item.ratio;
                    const cellRef = item.refImage;  // 格子独立参考图

                    // 全局参考图作为备用
                    const globalMultiRef = window.multiRefImages && window.multiRefImages.length > 0 ? window.multiRefImages : null;
                    const globalSingleRef = window.referenceImageUrl || null;

                    // 优先使用格子独立参考图，否则使用全局参考图
                    const finalRef = cellRef || globalSingleRef;

                    try {
                        const result = await generateSingleImageAPI(item.prompt, cellModel, cellRatio, globalMultiRef, finalRef);
                        if (gridItem) {
                            gridItem.classList.remove('generating');
                            gridItem.classList.add('has-result');

                            // 🎨 直接在宫格内显示结果图片
                            const textarea = gridItem.querySelector('textarea');
                            if (textarea) textarea.style.display = 'none';

                            // 删除旧的结果图片（如果有）
                            const oldImg = gridItem.querySelector('.batch-result-img');
                            if (oldImg) oldImg.remove();
                            const oldEditBtn = gridItem.querySelector('.batch-item-edit-btn');
                            if (oldEditBtn) oldEditBtn.remove();

                            // 创建结果图片
                            const imgUrl = (result && typeof result === 'object' && result.urls) ? result.urls[0] : result;
                            if (imgUrl) {
                                const img = document.createElement('img');
                                img.className = 'batch-result-img';
                                img.src = imgUrl;
                                img.style.cssText = 'width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:1;cursor:pointer;';
                                img.onclick = () => {
                                    // 点击图片预览
                                    window.open(imgUrl, '_blank');
                                };
                                gridItem.style.position = 'relative';
                                gridItem.insertBefore(img, gridItem.firstChild);

                                // 添加重新编辑按钮
                                const editBtn = document.createElement('button');
                                editBtn.className = 'batch-item-edit-btn';
                                editBtn.textContent = '✏️ 重新编辑';
                                editBtn.onclick = (e) => {
                                    e.stopPropagation();
                                    // 移除结果图片和按钮，显示编辑区域
                                    img.remove();
                                    editBtn.remove();
                                    if (textarea) textarea.style.display = 'block';
                                    gridItem.classList.remove('has-result');
                                    gridItem.classList.remove('error');
                                };
                                gridItem.appendChild(editBtn);

                                // 调整配置区域的 z-index，确保在图片之上
                                const configDiv = gridItem.querySelector('.batch-item-config');
                                if (configDiv) configDiv.style.zIndex = '2';
                                const refDiv = gridItem.querySelector('.batch-item-ref');
                                if (refDiv) refDiv.style.zIndex = '3';
                            }
                        }

                        // 🎨 处理 MJ 网格图切图结果（返回多张图）
                        if (result && typeof result === 'object' && result.isMjGrid && result.urls) {
                            // MJ 返回 4 张切图，每张独立显示，用户可按需选择
                            result.urls.forEach((url, subIdx) => {
                                batchResults.push({
                                    index: item.index,
                                    subIndex: subIdx,
                                    prompt: item.prompt,
                                    imageUrl: url,
                                    taskId: result.taskId,  // 保存 taskId 供 upscale 用
                                    error: null,
                                    selected: subIdx === 0,  // 默认只选中第一张
                                    isMjSplit: true
                                });
                            });
                        } else {
                            // 普通单图结果
                            batchResults.push({
                                index: item.index,
                                prompt: item.prompt,
                                imageUrl: result,
                                error: null,
                                selected: true
                            });
                        }
                    } catch (error) {
                        console.error(`❌ 格子 ${item.index + 1} 生成失败:`, error);
                        if (gridItem) {
                            gridItem.classList.remove('generating');
                            gridItem.classList.add('error');

                            // 添加重新编辑按钮（错误情况）
                            const oldEditBtn = gridItem.querySelector('.batch-item-edit-btn');
                            if (oldEditBtn) oldEditBtn.remove();

                            const editBtn = document.createElement('button');
                            editBtn.className = 'batch-item-edit-btn';
                            editBtn.textContent = '✏️ 重试';
                            editBtn.style.bottom = '50px'; // 调整位置避开错误提示
                            editBtn.onclick = (e) => {
                                e.stopPropagation();
                                // 清除错误状态，显示编辑区域
                                gridItem.classList.remove('error');
                                editBtn.remove();
                                const textarea = gridItem.querySelector('textarea');
                                if (textarea) {
                                    textarea.style.display = 'block';
                                    textarea.focus();
                                }
                            };
                            gridItem.appendChild(editBtn);
                        }
                        batchResults.push({
                            index: item.index,
                            prompt: item.prompt,
                            imageUrl: '',
                            error: error.message,
                            selected: false
                        });
                    }

                    completed++;
                    loadingText.textContent = `正在批量生成 ${completed}/${inputs.length}...`;
                });

                await Promise.all(promises);

                // 按格子索引排序，MJ的多张切图按 subIndex 排序
                batchResults.sort((a, b) => {
                    if (a.index !== b.index) return a.index - b.index;
                    return (a.subIndex || 0) - (b.subIndex || 0);
                });

                // 显示结果
                renderBatchResults();

                const successCount = batchResults.filter(r => !r.error).length;
                showToast(`批量生成完成！成功 ${successCount} 张`);

                // 更新余额显示
                await loadUserQuota();
            } finally {
                // 🔧 确保无论成功失败都重置状态
                btn.disabled = false;
                batchGenerating = false;
                loading.style.display = 'none';
            }
        }

        // 🔧 带超时的 fetch 函数
        async function fetchWithTimeout(url, options = {}, timeoutMs = 60000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') {
                    throw new Error(`请求超时（${Math.round(timeoutMs / 1000)}秒）`);
                }
                throw err;
            }
        }

        // 单图生成 API 调用（供批量模式复用）
        // 🎨 新增参考图参数支持
        // 返回: string (url) 或 object { urls: string[], isMjGrid: true }
        async function generateSingleImageAPI(prompt, model, ratio, multiRefImages = null, singleRefImage = null) {
            let response;
            const isMidjourney = model && model.startsWith('midjourney-');
            const isSeedream = model && (model.includes('seedream') || model.includes('doubao-seedream'));
            const isQwenImage = model && (model.includes('Qwen-Image') || model.includes('Qwen/Qwen-Image'));
            const isBanana = model && model.startsWith('nano-banana-');

            // 🔧 根据模型类型设置不同的超时时间
            // 万象Max 需要较长时间（异步任务轮询）
            const timeoutMs = isQwenImage ? 180000 : (isMidjourney ? 180000 : (isSeedream ? 120000 : 90000));

            if (isQwenImage) {
                // 通义万象Max - 🔧 使用180秒超时
                response = await fetchWithTimeout('/api/banana2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        aspect_ratio: ratio,
                        model: 'qwen-image-max',
                        userId: currentUser.id
                    })
                }, timeoutMs);
            } else if (model === 'modelscope') {
                response = await fetch('/api/modelscope', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'image', prompt, aspect_ratio: ratio, userId: currentUser.id })
                });
            } else {
                const apiEndpoint = isMidjourney ? '/api/yunwu' : (isSeedream ? '/api/yunwu' : '/api/banana2');
                const requestBody = { prompt, model, aspect_ratio: ratio, userId: currentUser.id };

                // 🎨 星梦画师参考图处理
                if (isSeedream) {
                    requestBody.action = 'seedream';
                    // 多图参考模式
                    if (multiRefImages && multiRefImages.length >= 2) {
                        requestBody.image_urls = multiRefImages;
                        requestBody.mode = 'multi-image';
                        console.log(`🎨 [批量-星梦画师] 多图模式: ${multiRefImages.length}张参考图`);
                    }
                    // 单图参考模式
                    else if (singleRefImage) {
                        requestBody.image_url = singleRefImage;
                        requestBody.mode = 'image2image';
                        console.log('🎨 [批量-星梦画师] 单图模式');
                    }
                }
                // 🍌 Banana模型参考图处理
                else if (isBanana) {
                    if (multiRefImages && multiRefImages.length >= 2) {
                        requestBody.image_urls = multiRefImages;
                        console.log(`🍌 [批量-Banana] 多图融合模式: ${multiRefImages.length}张参考图`);
                    } else if (singleRefImage) {
                        requestBody.image_url = singleRefImage;
                        console.log('🍌 [批量-Banana] 单图参考模式');
                    }
                }
                // 其他模型单图参考
                else if (singleRefImage && !isMidjourney) {
                    requestBody.image_url = singleRefImage;
                    console.log('🖼️ [批量] 单图参考模式');
                }

                if (isMidjourney) {
                    requestBody.action = 'midjourney';
                    const mjVersionSelect = document.getElementById('mjVersion');
                    requestBody.version = mjVersionSelect ? mjVersionSelect.value : '6.1';
                    // 🎨 MJ 参考图支持（图生图）
                    if (singleRefImage) {
                        requestBody.image_url = singleRefImage;
                        console.log('🎨 [批量-MJ] 图生图模式');
                    }
                }

                // 🔧 使用带超时的 fetch
                response = await fetchWithTimeout(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                }, timeoutMs);
            }

            if (!response.ok) {
                let errMsg = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    errMsg = errData.message || errData.error || errMsg;
                } catch (e) { }
                throw new Error(errMsg);
            }

            const data = await response.json();
            if (data.error) throw new Error(data.message || data.error);

            // 提取图片URL
            let imageUrl = data.url || data.image_url || '';
            if (!imageUrl && data.urls && data.urls.length > 0) {
                imageUrl = data.urls[0];
            }
            if (!imageUrl) {
                imageUrl = data.data?.url || data.data?.image_url || '';
            }
            // 🎨 MJ 网格图情况：批量模式下切图返回4张单独的图片
            if (data.gridBase64 && data.taskId) {
                // 切图并返回特殊对象
                try {
                    const splitImages = await splitMjGridImage(data.gridBase64);
                    console.log(`🔪 [MJ批量] 切图完成，得到 ${splitImages.length} 张图片`);
                    return { urls: splitImages, isMjGrid: true, taskId: data.taskId };
                } catch (splitErr) {
                    console.warn('[MJ批量] 切图失败，使用网格图:', splitErr);
                    imageUrl = data.gridBase64;
                }
            }
            // MJ 返回 imageUrl 字段
            if (!imageUrl && data.imageUrl) {
                imageUrl = data.imageUrl;
            }
            if (!imageUrl && data.gridBase64) {
                imageUrl = data.gridBase64;
            }
            if (!imageUrl && data.images && data.images.length > 0) {
                imageUrl = data.images[0].url || data.images[0];
            }

            if (!imageUrl) throw new Error('未获取到图片地址');

            return imageUrl;
        }

        // 渲染批量结果
        function renderBatchResults() {
            const grid = document.getElementById('batchResultGrid');
            grid.innerHTML = '';

            batchResults.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'batch-result-item' + (item.error ? ' error' : '') + (item.selected ? ' selected' : '');

                if (item.error) {
                    div.innerHTML = `<div class="batch-result-error">❌ ${item.error}</div>`;
                } else {
                    // 🎨 MJ 切图显示序号标记
                    let html = `<img src="${item.imageUrl}" alt="生成结果 ${idx + 1}">`;
                    if (item.isMjSplit && item.subIndex !== undefined) {
                        html += `<div class="mj-multi-badge">格${item.index + 1}-图${item.subIndex + 1}</div>`;
                    }
                    div.innerHTML = html;
                }

                div.onclick = () => toggleBatchImageSelect(idx);
                grid.appendChild(div);
            });

            document.getElementById('batchResultSection').style.display = 'block';
        }

        // 切换选中状态
        function toggleBatchImageSelect(idx) {
            // 🔧 防御性检查：确保数组和索引有效
            if (!batchResults || !batchResults[idx]) return;
            if (batchResults[idx].error) return;
            batchResults[idx].selected = !batchResults[idx].selected;
            renderBatchResults();
        }

        // 全选图片
        function selectAllBatchImages() {
            batchResults.forEach(r => {
                if (!r.error) r.selected = true;
            });
            renderBatchResults();
            showToast('已全选');
        }

        // 下载选中图片
        async function downloadSelectedImages() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要下载的图片');
                return;
            }

            showToast(`开始下载 ${selected.length} 张图片...`);

            for (let i = 0; i < selected.length; i++) {
                const item = selected[i];
                const a = document.createElement('a');
                a.href = item.imageUrl;
                a.download = `rollroll_batch_${Date.now()}_${i + 1}.png`;
                a.click();
                await new Promise(r => setTimeout(r, 300));  // 间隔下载
            }
        }

        // 批量去生视频
        function useSelectedImages() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要生视频的图片');
                return;
            }
            // 存储到 localStorage 供 video-tools.html 读取
            localStorage.setItem('banana_batch_images', JSON.stringify(selected.map(r => r.imageUrl)));
            location.href = 'video-tools.html?batch=1';
        }

        // ==================== 批量格子二级选择器（MJ 4图选择） ====================
        let __batchCellPickerIdx = -1;  // 当前打开的格子索引
        let __batchCellPickerSelected = -1;  // 当前选中的图片索引

        // 打开二级选择器
        function openBatchCellPicker(batchIdx) {
            const item = batchResults[batchIdx];
            if (!item || !item.isMjMulti || !item.allImages) {
                showToast('此项不支持多图选择');
                return;
            }

            __batchCellPickerIdx = batchIdx;
            __batchCellPickerSelected = item.selectedImageIndex || 0;

            const grid = document.getElementById('batchCellPickerGrid');
            grid.innerHTML = item.allImages.map((url, i) => `
                <div class="batch-cell-picker-item ${i === __batchCellPickerSelected ? 'selected' : ''}" onclick="selectBatchCellImage(${i})">
                    <div class="batch-cell-picker-item-idx">${i + 1}</div>
                    <img src="${url}" alt="图片 ${i + 1}">
                </div>
            `).join('');

            // 更新副标题
            document.getElementById('batchCellPickerSubtitle').textContent = `第 ${item.index + 1} 格 - 点击选择您喜欢的一张`;

            // 更新确认按钮状态
            updateBatchCellPickerConfirmBtn();

            document.getElementById('batchCellPicker').classList.add('show');
        }

        // 选择图片
        function selectBatchCellImage(imgIdx) {
            __batchCellPickerSelected = imgIdx;

            // 更新选中状态
            const items = document.querySelectorAll('.batch-cell-picker-item');
            items.forEach((el, i) => {
                el.classList.toggle('selected', i === imgIdx);
            });

            updateBatchCellPickerConfirmBtn();
        }

        // 更新确认按钮
        function updateBatchCellPickerConfirmBtn() {
            const btn = document.getElementById('batchCellPickerConfirm');
            if (__batchCellPickerSelected >= 0) {
                btn.disabled = false;
                btn.textContent = `✅ 使用第 ${__batchCellPickerSelected + 1} 张`;
            } else {
                btn.disabled = true;
                btn.textContent = '请先选择一张图片';
            }
        }

        // 确认选择
        function confirmBatchCellSelection() {
            if (__batchCellPickerIdx < 0 || __batchCellPickerSelected < 0) return;

            const item = batchResults[__batchCellPickerIdx];
            if (!item || !item.allImages) return;

            // 更新该格子的选中图片
            item.selectedImageIndex = __batchCellPickerSelected;
            item.imageUrl = item.allImages[__batchCellPickerSelected];

            closeBatchCellPicker();
            renderBatchResults();
            showToast(`已选择第 ${__batchCellPickerSelected + 1} 张图片`);
        }

        // 关闭选择器
        function closeBatchCellPicker() {
            document.getElementById('batchCellPicker').classList.remove('show');
            __batchCellPickerIdx = -1;
            __batchCellPickerSelected = -1;
        }
    </script>
</body>
