<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检查localStorage节点数据</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 5px; overflow-x: auto; }
        .item { margin: 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .key { font-weight: bold; color: #333; }
        .value { margin-top: 5px; }
        .backup { background-color: #e8f4f8; }
        .empty { color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <h1>检查localStorage节点数据</h1>
        <div id="results"></div>
    </div>
    <script>
        const keys = ['flow_nodes', 'node_connections', 'flow_nodes_backup', 'node_connections_backup', 'ideas_history'];
        const results = document.getElementById('results');
        
        keys.forEach(key => {
            const value = localStorage.getItem(key);
            const item = document.createElement('div');
            item.className = `item ${key.includes('backup') ? 'backup' : ''}`;
            
            item.innerHTML = `
                <div class="key">${key}</div>
                <div class="value">
                    ${value ? `<pre>${value}</pre>` : '<span class="empty">空</span>'}
                    ${value && value !== '[]' ? `（包含 ${JSON.parse(value).length} 个项目）` : ''}
                </div>
            `;
            
            results.appendChild(item);
        });
    </script>
</body>
</html>
