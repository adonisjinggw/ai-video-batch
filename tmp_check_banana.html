<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>馃帹 AI鐢诲浘 - RollRoll</title>
    <!-- Supabase SDK 鍏堝姞杞?-->
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .quota-badge {
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--accent);
        }

        .main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-label {
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
            display: block;
        }

        .input-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
            color: var(--text);
            font-size: 15px;
            resize: none;
            min-height: 100px;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .settings-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .setting-item {
            flex: 1;
        }

        .setting-item select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
        }

        .model-info {
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .generate-btn:disabled {
            opacity: 0.5;
        }

        .result-section {
            margin-top: 24px;
            display: none;
        }

        .result-image {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
        }

        .result-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-input);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .result-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .history-section {
            margin-top: 30px;
        }

        .history-title {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--text-dim);
        }

        .history-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .history-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }

        .history-item img {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }

        .login-tip {
            background: #2d1f1f;
            border: 1px solid #f87171;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
        }

        .login-tip a {
            color: var(--accent);
            text-decoration: none;
            font-weight: bold;
        }

        /* 馃啎 鎵归噺妯″紡鏍峰紡 */
        .batch-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .batch-toggle-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-card);
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .batch-toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .batch-item {
            position: relative;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            min-height: 140px;
        }
        .batch-item {
            display: flex;
            flex-direction: column;
        }
        .batch-item textarea {
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 11px;
            padding: 8px;
            resize: none;
        }
        .batch-item textarea:focus {
            outline: none;
        }
        .batch-item-config {
            display: flex;
            gap: 2px;
            padding: 4px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid #333;
        }
        .batch-item-config select {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--text);
            font-size: 9px;
            padding: 3px 2px;
            min-width: 0;
        }
        .batch-item-ref {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #444;
            cursor: pointer;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .batch-item-ref img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .batch-item-ref:hover {
            border-color: var(--accent);
        }
        .batch-item.generating {
            border-color: var(--accent);
        }
        .batch-item.generating::after {
            content: '鈿欙笍';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            animation: spin 1s linear infinite;
        }
        .batch-item.has-result {
            border-color: #22c55e;
        }
        .batch-item.error {
            border-color: #ef4444;
        }
        .batch-item.error::after {
            content: '鉂?鐢熸垚澶辫触';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            color: #ef4444;
            background: rgba(0,0,0,0.8);
            padding: 8px 12px;
            border-radius: 6px;
            z-index: 5;
        }
        .batch-item-edit-btn {
            position: absolute;
            bottom: 30px;
            right: 4px;
            padding: 4px 8px;
            background: rgba(0,0,0,0.7);
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            z-index: 4;
            transition: all 0.2s;
        }
        .batch-item-edit-btn:hover {
            background: var(--accent);
            color: #000;
        }
        .batch-result-section {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid #333;
        }
        .batch-result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .batch-result-header h3 {
            margin: 0;
            font-size: 16px;
            color: var(--accent);
        }
        .batch-result-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .batch-action-btn {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: var(--bg-input);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .batch-action-btn:hover {
            border-color: var(--accent);
        }
        .batch-action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .batch-result-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .batch-result-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid transparent;
            cursor: pointer;
            background: var(--bg-card);
            min-height: 80px;
        }
        .batch-result-item img {
            width: 100%;
            height: auto;
            display: block;
        }
        .batch-result-item.selected {
            border-color: #22c55e;
        }
        .batch-result-item.error {
            background: rgba(239, 68, 68, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            font-size: 12px;
            text-align: center;
            padding: 8px;
        }
        .batch-result-item .batch-item-index {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .batch-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        .batch-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* 鍙傝€冨浘鍖哄煙 */
        .ref-section {
            margin-bottom: 20px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px dashed #444;
        }

        .ref-preview {
            margin: 8px 0;
            text-align: center;
        }

        .ref-preview img {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .ref-clear-btn {
            background: transparent;
            border: 1px solid #666;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
        }

        .ref-clear-btn:hover {
            border-color: #f87171;
            color: #f87171;
        }

        /* 涓婁紶鎸夐挳 */
        .upload-section {
            margin-bottom: 16px;
        }

        .upload-btn {
            width: 100%;
            background: var(--bg-card);
            border: 1px dashed #444;
            border-radius: 12px;
            padding: 14px;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 澶氬浘鍙傝€冨尯鍩?*/
        .multi-ref-section {
            margin-bottom: 16px;
            display: none;
        }
        .multi-ref-section.show {
            display: block;
        }
        .multi-ref-btn {
            width: 100%;
            background: var(--bg-card);
            border: 1px dashed #7c3aed;
            border-radius: 12px;
            padding: 14px;
            color: #a78bfa;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .multi-ref-btn:hover {
            border-color: #a78bfa;
            color: #c4b5fd;
        }
        .multi-ref-preview {
            margin-top: 12px;
            padding: 12px;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid #333;
            display: none;
        }
        .multi-ref-preview.show {
            display: block;
        }
        .multi-ref-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 8px;
        }
        .multi-ref-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #333;
        }
        .multi-ref-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .multi-ref-item-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 20px;
            height: 20px;
            background: rgba(239, 68, 68, 0.9);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .multi-ref-info {
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .multi-ref-clear {
            background: transparent;
            border: 1px solid #666;
            color: var(--text-dim);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        .multi-ref-clear:hover {
            border-color: #ef4444;
            color: #ef4444;
        }

        /* 馃帹 Midjourney 鍥剧墖閫夋嫨鍣?- 绮捐嚧鍙埍椋庢牸 */
        .mj-image-picker {
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(45, 35, 55, 0.98) 0%, rgba(25, 20, 35, 0.99) 100%);
            z-index: 1100;
            display: none;
            flex-direction: column;
            padding: 16px;
            padding-top: env(safe-area-inset-top, 16px);
            padding-bottom: env(safe-area-inset-bottom, 16px);
            backdrop-filter: blur(10px);
        }
        .mj-image-picker.show {
            display: flex;
        }
        .mj-picker-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 16px;
            background: linear-gradient(135deg, rgba(255,182,193,0.15) 0%, rgba(255,218,233,0.1) 100%);
            border-radius: 16px;
            margin-bottom: 12px;
        }
        .mj-picker-title {
            font-size: 16px;
            font-weight: 600;
            color: #ffb6c1;
            text-shadow: 0 0 20px rgba(255,182,193,0.5);
        }
        .mj-picker-subtitle {
            font-size: 11px;
            color: rgba(255,182,193,0.6);
            margin-top: 4px;
        }
        .mj-picker-close {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #ffb6c1;
            font-size: 20px;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .mj-picker-close:hover {
            background: rgba(255,182,193,0.3);
            transform: rotate(90deg);
        }
        .mj-picker-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
        }
        .mj-picker-item {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 3px solid rgba(255,255,255,0.1);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            aspect-ratio: 1;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .mj-picker-item:hover {
            border-color: rgba(255,182,193,0.6);
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(255,182,193,0.25);
        }
        .mj-picker-item.selected {
            border-color: #ff69b4;
            box-shadow: 0 0 0 3px rgba(255,105,180,0.3), 0 8px 30px rgba(255,105,180,0.4);
            transform: scale(1.02);
        }
        .mj-picker-item.selected::after {
            content: '鉁?;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 30px rgba(255,105,180,0.8);
            animation: checkPop 0.3s ease-out;
            z-index: 2;
        }
        @keyframes checkPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .mj-picker-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s;
        }
        .mj-picker-item.selected img {
            filter: brightness(0.7);
        }
        .mj-picker-item-index {
            position: absolute;
            top: 8px;
            left: 8px;
            background: linear-gradient(135deg, rgba(255,182,193,0.9) 0%, rgba(255,105,180,0.9) 100%);
            color: #fff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(255,105,180,0.5);
            z-index: 1;
        }
        .mj-picker-item.selected .mj-picker-item-index {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            box-shadow: 0 0 15px rgba(255,105,180,0.8);
        }
        /* 馃啎 涓嬭浇鎸夐挳 */
        .mj-picker-item-download {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255,182,193,0.8);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
            opacity: 0.8;
            transition: all 0.2s;
            z-index: 1;
        }
        .mj-picker-item-download:hover {
            opacity: 1;
            background: #ff69b4;
            transform: scale(1.1);
        }
        .mj-picker-actions {
            display: flex;
            gap: 10px;
            padding: 16px 8px 8px;
        }
        .mj-picker-confirm {
            flex: 2;
            padding: 14px 16px;
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,105,180,0.4);
            transition: all 0.2s;
        }
        .mj-picker-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255,105,180,0.5);
        }
        .mj-picker-download-all {
            flex: 1;
            padding: 14px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,182,193,0.3);
            border-radius: 14px;
            color: #ffb6c1;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mj-picker-download-all:hover {
            background: rgba(255,182,193,0.15);
            border-color: rgba(255,182,193,0.5);
        }
        .mj-picker-confirm:disabled {
            opacity: 0.5;
            background: rgba(255,255,255,0.1);
            color: rgba(255,182,193,0.5);
            box-shadow: none;
        }
        /* 馃帹 鍙傝€冨浘缂栬緫鍣ㄦ牱寮?*/
        .ref-editor-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 2000;
            display: none;
            flex-direction: column;
        }
        .ref-editor-overlay.show {
            display: flex;
        }
        .ref-editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .ref-editor-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }
        .ref-editor-close {
            background: none;
            border: none;
            color: #888;
            font-size: 28px;
            cursor: pointer;
            padding: 0 8px;
        }
        .ref-editor-canvas-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px;
            touch-action: none;
        }
        .ref-editor-canvas {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            background: #222;
            touch-action: none;
        }

        <div class="ref-editor-header">
            <span class="ref-editor-title">鉁忥笍 缂栬緫鍙傝€冨浘</span>
            <button class="ref-editor-close" onclick="closeRefEditor()">脳</button>
        </div>
        <div class="ref-editor-canvas-wrap">
            <canvas class="ref-editor-canvas" id="refEditorCanvas"></canvas>
        </div>
        <div class="ref-editor-toolbar">
            <button class="ref-editor-tool active" data-tool="brush" onclick="setEditorTool('brush')" title="鐢荤瑪">馃枌锔?/button>
            <button class="ref-editor-tool" data-tool="text" onclick="setEditorTool('text')" title="鏂囧瓧">馃摑</button>
            <button class="ref-editor-tool" data-tool="eraser" onclick="setEditorTool('eraser')" title="姗＄毊鎿?>馃Ы</button>
            <button class="ref-editor-tool" data-tool="undo" onclick="editorUndo()" title="鎾ら攢">鈫╋笍</button>
            <input type="color" class="ref-editor-color active" id="editorColor" value="#ff0000" title="棰滆壊">
            <select class="ref-editor-size" id="editorSize" title="绮楃粏">
                <option value="2">缁?2px</option>
                <option value="5" selected>涓?5px</option>
                <option value="10">绮?10px</option>
                <option value="20">鐗圭矖 20px</option>
            </select>
        </div>
        <div class="ref-editor-actions">
            <button class="ref-editor-btn cancel" onclick="closeRefEditor()">鍙栨秷</button>
            <button class="ref-editor-btn confirm" onclick="confirmRefEditor()">鉁?纭浣跨敤</button>
        </div>
    </div>

    <script>
        // 馃帹 鍙傝€冨浘缂栬緫鍣ㄧ姸鎬?        let __editorCanvas = null;
        let __editorCtx = null;
        let __editorTool = 'brush';  // brush, text, eraser
        let __editorDrawing = false;
        let __editorHistory = [];    // 鎾ら攢鍘嗗彶
        let __editorOriginalImage = null;  // 鍘熷鍥剧墖
        let __editorCallback = null;  // 缂栬緫瀹屾垚鍥炶皟
        let __editorMultiIndex = -1;  // 澶氬浘缂栬緫绱㈠紩锛?1琛ㄧず鍗曞浘

        // 馃帹 鎵撳紑缂栬緫鍣?        function openRefEditor(imageBase64, callback, multiIndex = -1) {
            __editorCallback = callback;
            __editorMultiIndex = multiIndex;
            __editorHistory = [];
            __editorTool = 'brush';
            
            const overlay = document.getElementById('refEditorOverlay');
            const canvas = document.getElementById('refEditorCanvas');
            __editorCanvas = canvas;
            __editorCtx = canvas.getContext('2d');
            
            // 鍔犺浇鍥剧墖鍒癈anvas
            const img = new Image();
            img.onload = () => {
                // 闄愬埗鏈€澶у昂瀵镐互閫傚簲灞忓箷
                const maxW = window.innerWidth - 40;
                const maxH = window.innerHeight - 280;
                let w = img.width, h = img.height;
                if (w > maxW) { h = h * maxW / w; w = maxW; }
                if (h > maxH) { w = w * maxH / h; h = maxH; }
                
                canvas.width = w;
                canvas.height = h;
                __editorCtx.drawImage(img, 0, 0, w, h);
                __editorOriginalImage = img;
                
                // 淇濆瓨鍒濆鐘舵€佸埌鍘嗗彶
                saveEditorState();
                
                overlay.classList.add('show');
            };
            img.src = imageBase64;
            
            // 缁戝畾浜嬩欢
            canvas.onmousedown = startEditorDraw;
            canvas.onmousemove = doEditorDraw;
            canvas.onmouseup = endEditorDraw;
            canvas.onmouseleave = endEditorDraw;
            canvas.ontouchstart = startEditorDraw;
            canvas.ontouchmove = doEditorDraw;
            canvas.ontouchend = endEditorDraw;
            
            // 閲嶇疆宸ュ叿鎸夐挳鐘舵€?            document.querySelectorAll('.ref-editor-tool').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === 'brush');
            });
        }
        
        // 鍒囨崲宸ュ叿
        function setEditorTool(tool) {
            __editorTool = tool;
            document.querySelectorAll('.ref-editor-tool').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tool === tool);
            });
            
            // 鏂囧瓧宸ュ叿鎻愮ず
            if (tool === 'text') {
                showToast('鐐瑰嚮鐢诲竷娣诲姞鏂囧瓧');
            }
        }
        
        // 淇濆瓨鐘舵€佸埌鍘嗗彶
        function saveEditorState() {
            if (!__editorCanvas) return;
            __editorHistory.push(__editorCanvas.toDataURL());
            // 鏈€澶氫繚瀛?0姝?            if (__editorHistory.length > 20) __editorHistory.shift();
        }
        
        // 鎾ら攢
        function editorUndo() {
            if (__editorHistory.length <= 1) {
                showToast('鏃犳硶鎾ら攢');
                return;
            }
            __editorHistory.pop();  // 绉婚櫎褰撳墠鐘舵€?            const prevState = __editorHistory[__editorHistory.length - 1];
            const img = new Image();
            img.onload = () => {
                __editorCtx.clearRect(0, 0, __editorCanvas.width, __editorCanvas.height);
                __editorCtx.drawImage(img, 0, 0);
            };
            img.src = prevState;
        }
        
        // 鑾峰彇瑙︽懜/榧犳爣鍧愭爣
        function getEditorPos(e) {
            const rect = __editorCanvas.getBoundingClientRect();
            if (e.touches && e.touches.length > 0) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            }
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }
        
        // 寮€濮嬬粯鍒?        function startEditorDraw(e) {
            e.preventDefault();
            const pos = getEditorPos(e);
            
            if (__editorTool === 'text') {
                // 鏂囧瓧宸ュ叿锛氬脊鍑鸿緭鍏ユ
                const text = prompt('杈撳叆瑕佹坊鍔犵殑鏂囧瓧:');
                if (text) {
                    const color = document.getElementById('editorColor').value;
                    const size = parseInt(document.getElementById('editorSize').value) * 3;
                    __editorCtx.font = `bold ${size}px sans-serif`;
                    __editorCtx.fillStyle = color;
                    __editorCtx.fillText(text, pos.x, pos.y);
                    saveEditorState();
                }
                return;
            }
            
            __editorDrawing = true;
            __editorCtx.beginPath();
            __editorCtx.moveTo(pos.x, pos.y);
            
            const color = document.getElementById('editorColor').value;
            const size = parseInt(document.getElementById('editorSize').value);
            
            if (__editorTool === 'eraser') {
                __editorCtx.globalCompositeOperation = 'destination-out';
                __editorCtx.lineWidth = size * 3;
            } else {
                __editorCtx.globalCompositeOperation = 'source-over';
                __editorCtx.strokeStyle = color;
                __editorCtx.lineWidth = size;
            }
            __editorCtx.lineCap = 'round';
            __editorCtx.lineJoin = 'round';
        }
        
        // 缁樺埗涓?        function doEditorDraw(e) {
            if (!__editorDrawing) return;
            e.preventDefault();
            const pos = getEditorPos(e);
            __editorCtx.lineTo(pos.x, pos.y);
            __editorCtx.stroke();
        }
        
        // 缁撴潫缁樺埗
        function endEditorDraw(e) {
            if (!__editorDrawing) return;
            __editorDrawing = false;
            __editorCtx.globalCompositeOperation = 'source-over';
            saveEditorState();
        }
        
        // 鍏抽棴缂栬緫鍣?        function closeRefEditor() {
            document.getElementById('refEditorOverlay').classList.remove('show');
            __editorCallback = null;
        }
        
        // 纭缂栬緫骞朵繚瀛?        function confirmRefEditor() {
            if (!__editorCanvas) return;
            const editedBase64 = __editorCanvas.toDataURL('image/jpeg', 0.9);
            
            if (__editorMultiIndex >= 0) {
                // 澶氬浘缂栬緫妯″紡
                window.multiRefImages[__editorMultiIndex] = editedBase64;
                renderMultiRefGrid();
                showToast('鍙傝€冨浘宸叉洿鏂?);
            } else if (__editorCallback) {
                // 鍗曞浘缂栬緫妯″紡
                __editorCallback(editedBase64);
            }
            
            closeRefEditor();
        }

        // 馃帹 MJ 鍥剧墖閫夋嫨鍣ㄥ叏灞€鐘舵€?        let __mjPickerImages = [];
        let __mjPickerSelectedIndex = -1;
        let __mjPickerCallback = null;
        let __mjTaskId = null;  // 馃啎 淇濆瓨 taskId 鐢ㄤ簬 upscale

        // 馃帹 澶氬浘鍙傝€冨叏灞€鐘舵€?        window.multiRefImages = [];

        // 馃啎 鎵归噺妯″紡鐘舵€?        let batchMode = false;
        let batchGenerating = false;
        let batchResults = [];  // { index, prompt, imageUrl, error, selected }

        // 馃敧 鍓嶇鍒囧浘锛氬皢 MJ 2x2 缃戞牸鍥惧垏鎴?寮犵嫭绔嬪浘鐗?        async function splitMjGridImage(gridBase64) {
            console.log('馃敧 [MJ] 寮€濮嬪墠绔垏鍥?..');
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const w = img.width / 2;
                    const h = img.height / 2;
                    const results = [];
                    const positions = [[0, 0], [w, 0], [0, h], [w, h]];  // 宸︿笂銆佸彸涓娿€佸乏涓嬨€佸彸涓?                    for (const [x, y] of positions) {
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, x, y, w, h, 0, 0, w, h);
                        results.push(canvas.toDataURL('image/jpeg', 0.9));
                    }
                    console.log(`馃敧 [MJ] 鍒囧浘瀹屾垚: ${w}x${h} 脳 4`);
                    resolve(results);
                };
                img.onerror = (err) => {
                    console.error('鉂?[MJ] 鍒囧浘鍔犺浇澶辫触:', err);
                    reject(new Error('缃戞牸鍥惧姞杞藉け璐?));
                };
                img.src = gridBase64;
            });
        }

        // 鏄剧ず MJ 鍥剧墖閫夋嫨鍣?        function showMjImagePicker(images, callback, taskId = null) {
            if (!images || images.length === 0) {
                if (callback) callback(null);
                return;
            }
            __mjPickerImages = images;
            __mjPickerSelectedIndex = -1;
            __mjPickerCallback = callback;
            __mjTaskId = taskId;  // 馃啎 淇濆瓨 taskId

            const grid = document.getElementById('mjPickerGrid');
            grid.innerHTML = '';
            images.forEach((imgUrl, index) => {
                const item = document.createElement('div');
                item.className = 'mj-picker-item';
                item.onclick = (e) => {
                    // 闃绘涓嬭浇鎸夐挳鐨勭偣鍑讳簨浠跺啋娉?                    if (e.target.classList.contains('mj-picker-item-download')) return;
                    selectMjImage(index);
                };
                item.innerHTML = `
                    <img src="${imgUrl}" alt="鍥剧墖 ${index + 1}" loading="lazy">
                    <div class="mj-picker-item-index">${index + 1}</div>
                    <button class="mj-picker-item-download" onclick="downloadMjSingleImage(${index}, event)" title="涓嬭浇杩欏紶">猬囷笍</button>
                `;
                grid.appendChild(item);
            });

            const confirmBtn = document.getElementById('mjPickerConfirm');
            confirmBtn.disabled = true;
            confirmBtn.textContent = '璇峰厛閫夋嫨涓€寮犲浘鐗?;

            document.getElementById('mjImagePicker').classList.add('show');
        }
        
        // 馃啎 涓嬭浇鍗曞紶 MJ 鍥剧墖锛堟敮鎸?base64 鍜屾櫘閫?URL锛?        function downloadMjSingleImage(index, event) {
            if (event) {
                event.stopPropagation();
                event.preventDefault();
            }
            if (!__mjPickerImages || !__mjPickerImages[index]) return;
            
            const imgUrl = __mjPickerImages[index];
            const filename = `mj_image_${index + 1}_${Date.now()}.png`;
            
            // 馃敡 淇锛歜ase64 鍥剧墖闇€瑕佽浆鎹负 Blob 鎵嶈兘姝ｇ‘涓嬭浇
            if (imgUrl.startsWith('data:')) {
                try {
                    // 瑙ｆ瀽 base64
                    const parts = imgUrl.split(',');
                    const mime = parts[0].match(/:(.*?);/)?.[1] || 'image/png';
                    const bstr = atob(parts[1]);
                    const n = bstr.length;
                    const u8arr = new Uint8Array(n);
                    for (let i = 0; i < n; i++) u8arr[i] = bstr.charCodeAt(i);
                    const blob = new Blob([u8arr], { type: mime });
                    const blobUrl = URL.createObjectURL(blob);
                    
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(blobUrl);  // 閲婃斁鍐呭瓨
                } catch (e) {
                    console.error('涓嬭浇澶辫触:', e);
                    showToast('涓嬭浇澶辫触锛岃閲嶈瘯');
                    return;
                }
            } else {
                // 鏅€?URL 鐩存帴涓嬭浇
                const a = document.createElement('a');
                a.href = imgUrl;
                a.download = filename;
                a.target = '_blank';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
            showToast(`宸蹭笅杞界 ${index + 1} 寮犲浘鐗嘸);
        }
        
        // 馃啎 涓嬭浇鍏ㄩ儴 MJ 鍥剧墖锛堟敮鎸?base64锛?        async function downloadAllMjImages() {
            if (!__mjPickerImages || __mjPickerImages.length === 0) {
                showToast('娌℃湁鍙笅杞界殑鍥剧墖');
                return;
            }
            
            const count = __mjPickerImages.length;
            showToast(`姝ｅ湪涓嬭浇 ${count} 寮犲浘鐗?..`);
            
            const timestamp = Date.now();
            let successCount = 0;
            
            for (let i = 0; i < count; i++) {
                const imgUrl = __mjPickerImages[i];
                const filename = `mj_image_${i + 1}_${timestamp}.png`;
                
                try {
                    // 馃敡 淇锛歜ase64 鍥剧墖闇€瑕佽浆鎹负 Blob 鎵嶈兘姝ｇ‘涓嬭浇
                    if (imgUrl.startsWith('data:')) {
                        const parts = imgUrl.split(',');
                        const mime = parts[0].match(/:(.*?);/)?.[1] || 'image/png';
                        const bstr = atob(parts[1]);
                        const n = bstr.length;
                        const u8arr = new Uint8Array(n);
                        for (let j = 0; j < n; j++) u8arr[j] = bstr.charCodeAt(j);
                        const blob = new Blob([u8arr], { type: mime });
                        const blobUrl = URL.createObjectURL(blob);
                        
                        const a = document.createElement('a');
                        a.href = blobUrl;
                        a.download = filename;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(blobUrl);
                    } else {
                        const a = document.createElement('a');
                        a.href = imgUrl;
                        a.download = filename;
                        a.target = '_blank';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }
                    successCount++;
                } catch (e) {
                    console.error(`涓嬭浇绗?${i + 1} 寮犲け璐?`, e);
                }
                
                // 寤惰繜涓€涓嬮伩鍏嶆祻瑙堝櫒鎷︽埅
                await new Promise(r => setTimeout(r, 500));
            }
            
            if (successCount === count) {
                showToast(`鉁?鍏ㄩ儴 ${count} 寮犲浘鐗囧凡涓嬭浇锛乣);
            } else {
                showToast(`涓嬭浇瀹屾垚锛?{successCount}/${count} 寮犳垚鍔焋);
            }
        }

        // 閫夋嫨鍥剧墖
        function selectMjImage(index) {
            __mjPickerSelectedIndex = index;
            const items = document.querySelectorAll('.mj-picker-item');
            items.forEach((item, i) => {
                item.classList.toggle('selected', i === index);
            });
            const confirmBtn = document.getElementById('mjPickerConfirm');
            confirmBtn.disabled = false;
            confirmBtn.textContent = `鉁?浣跨敤绗?${index + 1} 寮燻;
        }

        // 纭閫夋嫨
        async function confirmMjSelection() {
            if (__mjPickerSelectedIndex < 0) return;
            
            const selectedIndex = __mjPickerSelectedIndex + 1;  // 1-4
            const previewImage = __mjPickerImages[__mjPickerSelectedIndex];
            // 馃敡 淇锛氬湪鍏抽棴閫夋嫨鍣ㄥ墠淇濆瓨callback寮曠敤锛岄槻姝㈣娓呯┖
            const callback = __mjPickerCallback;
            const taskId = __mjTaskId;
            
            // 馃幆 浼樺寲锛氬厛鑾峰彇 userId锛屽鏋滄病鏈夊垯鐩存帴鐢ㄩ瑙堝浘锛堥伩鍏?401 鎶ラ敊锛?            let userId = currentUser?.id;
            if (!userId && typeof NVAuth !== 'undefined') {
                try {
                    const user = await NVAuth.getCurrentUser();
                    userId = user?.id;
                } catch (e) { console.warn('[MJ] 鑾峰彇鐢ㄦ埛澶辫触'); }
            }
            
            // 馃幆 浼樺寲锛氭病鏈?userId 鎴栨病鏈?taskId锛岀洿鎺ョ敤棰勮鍥撅紙宸茬粡鏄珮娓呭垏鍥撅紝澶熺敤浜嗭級
            if (!taskId || !userId) {
                console.log(`馃帹 [MJ] 鐩存帴浣跨敤棰勮鍥?(taskId=${!!taskId}, userId=${!!userId})`);
                closeMjPicker();
                if (callback) {
                    callback(previewImage);
                }
                return;
            }
            
            console.log(`馃攳 [MJ] 寮€濮?upscale 绗?${selectedIndex} 寮犲浘鐗? taskId=${taskId}`);
            
            // 鍏堝叧闂€夋嫨鍣紝鏄剧ず loading
            closeMjPicker();
            showToast('姝ｅ湪鏀惧ぇ閫変腑鐨勫浘鐗?..');
            
            try {
                const upscaleRes = await fetch('/api/yunwu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'mj-upscale',
                        taskId: taskId,
                        index: selectedIndex,
                        userId: userId
                    })
                });
                
                const upscaleData = await upscaleRes.json();
                
                if (upscaleData.success && upscaleData.imageUrl) {
                    console.log('鉁?[MJ] Upscale 鎴愬姛:', upscaleData.imageUrl);
                    if (callback) {
                        callback(upscaleData.imageUrl);
                    }
                } else {
                    console.warn('鈿狅笍 [MJ] Upscale 澶辫触锛屼娇鐢ㄥ垏鍥?', upscaleData.message);
                    // 馃幆 淇锛歶pscale 澶辫触鏃朵娇鐢ㄥ凡鍒囧ソ鐨勯瑙堝浘锛岀‘淇濆浘鐗囦笉涓㈠け
                    if (callback) {
                        callback(previewImage);
                    }
                }
            } catch (err) {
                console.error('鉂?[MJ] Upscale 璇锋眰澶辫触:', err);
                // 馃幆 淇锛氱綉缁滃紓甯告椂浣跨敤宸插垏濂界殑棰勮鍥撅紝纭繚鍥剧墖涓嶄涪澶?                if (callback) {
                    callback(previewImage);
                }
            }
        }

        // 鍏抽棴閫夋嫨鍣?        function closeMjPicker() {
            document.getElementById('mjImagePicker').classList.remove('show');
            __mjPickerImages = [];
            __mjPickerSelectedIndex = -1;
            __mjPickerCallback = null;
        }

        // 杩斿洖鍑芥暟 - 浼樺厛浣跨敤鍘嗗彶璁板綍锛屽惁鍒欒烦杞埌涓婚〉
        function goBack() {
            console.log('[banana] goBack 琚皟鐢?);
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';
            
            if (fromMobile) {
                location.href = 'mobile.html?skip_welcome=1';
            } else {
                location.href = 'index.html';
            }
        }

        // SUPABASE_URL 鍜?SUPABASE_ANON_KEY 宸插湪 supabase-config.js 涓畾涔?        var _sbClient = null, currentUser = null, userQuota = 0, currentImageUrl = '', imageHistory = [];
        let authInitialized = false;

        // 鎵ｈ垂鏍囧噯锛堟垚鏈?纭繚50%鍒╂鼎锛?鑳剁墖=楼0.1锛?        const FILM_COST = { 
            'modelscope': 0,
            'nano-banana-2': 6,
            'nano-banana-2-2k': 6,
            'nano-banana-2-4k': 10,
            'Qwen/Qwen-Image-2512': 8,
            'doubao-seedream-4-5-251128': 7,
            'jimeng-4.5': 7,
            'midjourney-fast': 2,
            'midjourney-turbo': 2,
            'midjourney-relax': 2
        };

        // 馃敡 IndexedDB 瀛樺偍宸ュ叿锛堣В鍐?localStorage 5MB 闄愬埗闂锛?        const imageTransferDB = {
            dbName: 'RollRollImageTransfer',
            storeName: 'images',
            db: null,
            
            async init() {
                if (this.db) return this.db;
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, 1);
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve(this.db);
                    };
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName, { keyPath: 'key' });
                        }
                    };
                });
            },
            
            async set(key, data) {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, 'readwrite');
                    const store = tx.objectStore(this.storeName);
                    const request = store.put({ key, data, timestamp: Date.now() });
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            },
            
            async get(key) {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, 'readonly');
                    const store = tx.objectStore(this.storeName);
                    const request = store.get(key);
                    request.onsuccess = () => resolve(request.result?.data || null);
                    request.onerror = () => reject(request.error);
                });
            },
            
            async remove(key) {
                const db = await this.init();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(this.storeName, 'readwrite');
                    const store = tx.objectStore(this.storeName);
                    const request = store.delete(key);
                    request.onsuccess = () => resolve();
                    request.onerror = () => reject(request.error);
                });
            }
        };

        // 馃敡 寮傛鍘嬬缉鍥剧墖鐢ㄤ簬鍘嗗彶璁板綍锛堥珮璐ㄩ噺缂╃暐鍥撅級
        async function compressImageForHistory(base64Url, maxWidth = 150, quality = 0.7) {
            return new Promise((resolve) => {
                try {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        // 绛夋瘮渚嬬缉鏀?                        if (width > height && width > maxWidth) {
                            height = Math.round(height * maxWidth / width);
                            width = maxWidth;
                        } else if (height > maxWidth) {
                            width = Math.round(width * maxWidth / height);
                            height = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 馃敡 閫掕繘鍘嬬缉锛氬鏋滆繕鏄お澶э紝闄嶄綆璐ㄩ噺鍐嶈瘯
                        let compressed = canvas.toDataURL('image/jpeg', quality);
                        if (compressed.length > 80000 && quality > 0.3) {
                            compressed = canvas.toDataURL('image/jpeg', 0.5);
                        }
                        if (compressed.length > 80000 && width > 100) {
                            // 杩涗竴姝ョ缉灏忓昂瀵?                            const smallCanvas = document.createElement('canvas');
                            smallCanvas.width = Math.round(width * 0.7);
                            smallCanvas.height = Math.round(height * 0.7);
                            smallCanvas.getContext('2d').drawImage(canvas, 0, 0, smallCanvas.width, smallCanvas.height);
                            compressed = smallCanvas.toDataURL('image/jpeg', 0.5);
                        }
                        
                        console.log(`馃柤锔?鍘嗗彶缂╃暐鍥? ${Math.round(base64Url.length/1024)}KB -> ${Math.round(compressed.length/1024)}KB`);
                        resolve(compressed);
                    };
                    img.onerror = () => {
                        console.warn('[banana] 鍘嬬缉澶辫触锛岃烦杩?);
                        resolve(null);
                    };
                    img.src = base64Url;
                } catch (e) {
                    console.warn('[banana] 鍘嬬缉寮傚父:', e);
                    resolve(null);
                }
            });
        }

        // 馃帹 澶氬浘鍙傝€冧笂浼犲鐞嗭紙甯﹀帇缂╋級
        async function handleMultiRefUpload(event) {
            const files = Array.from(event.target.files);
            if (!files.length) return;
            
            const currentCount = window.multiRefImages.length;
            const maxImages = 10;
            const remainingSlots = maxImages - currentCount;
            
            if (remainingSlots <= 0) {
                showToast('鏈€澶氬彧鑳戒笂浼?0寮犲弬鑰冨浘');
                event.target.value = '';
                return;
            }
            
            const filesToProcess = files.slice(0, remainingSlots);
            showToast(`姝ｅ湪鍘嬬缉 ${filesToProcess.length} 寮犲浘鐗?..`);
            
            for (const file of filesToProcess) {
                if (!file.type.startsWith('image/')) continue;
                if (file.size > 10 * 1024 * 1024) {
                    showToast('鍥剧墖瓒呰繃10MB锛屽凡璺宠繃');
                    continue;
                }
                
                try {
                    // 鍘嬬缉鍥剧墖鍒扮害300KB
                    const compressed = await compressImage(file, 800, 0.7);
                    window.multiRefImages.push(compressed);
                } catch (err) {
                    console.error('鍥剧墖鍘嬬缉澶辫触:', err);
                }
            }
            
            renderMultiRefGrid();
            showToast(`宸叉坊鍔?${window.multiRefImages.length} 寮犲弬鑰冨浘`);
            event.target.value = '';
        }
        
        // 馃柤锔?鍥剧墖鍘嬬缉鍑芥暟锛堥伩鍏嶈姹備綋瓒呰繃Vercel 4.5MB闄愬埗锛?        function compressImage(file, maxSize = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        // 璁＄畻缂╂斁姣斾緥
                        let width = img.width;
                        let height = img.height;
                        
                        if (width > height && width > maxSize) {
                            height = Math.round(height * maxSize / width);
                            width = maxSize;
                        } else if (height > maxSize) {
                            width = Math.round(width * maxSize / height);
                            height = maxSize;
                        }
                        
                        // 鍒涘缓canvas鍘嬬缉
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 杈撳嚭鍘嬬缉鍚庣殑base64
                        const compressed = canvas.toDataURL('image/jpeg', quality);
                        console.log(`馃柤锔?鍘嬬缉: ${Math.round(e.target.result.length/1024)}KB -> ${Math.round(compressed.length/1024)}KB`);
                        resolve(compressed);
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // 馃啎 鎵归噺鐢熸垚鍥剧墖
        async function generateBatchImages() {

            let authResult = { valid: false, user: null, quota: 0 };

                    authResult = await NVAuth.checkAuthStatus(true);  // true = 鍒锋柊鑳剁墖浣欓

            // 馃攧 鍚屾鏇存柊鐧诲綍鐘舵€佸拰鑳剁墖浣欓
            if (authResult.valid && authResult.user) {

                setTimeout(() => { window.location.href = 'auth.html'; }, 1000);

            }
            
            // 馃啎 鏀堕泦闈炵┖杈撳叆锛屽苟璇诲彇姣忎釜鏍煎瓙鐨勭嫭绔嬮厤缃?            const inputs = [];

            if (inputs.length === 0) {

            }
            
            // 閰嶉妫€鏌?            if (totalCost > 0 && userQuota < totalCost) {
                showToast(`鑳剁墖涓嶈冻锛岄渶瑕?{totalCost}鑳剁墖`);

            // 闅愯棌鍗曞浘缁撴灉锛屾樉绀烘壒閲忕粨鏋滃尯鍩?            document.getElementById('resultSection').style.display = 'none';

            // 骞跺彂鐢熸垚锛堟瘡涓牸瀛愪娇鐢ㄧ嫭绔嬮厤缃級
            try {

                    if (gridItem) gridItem.classList.add('generating');
                    
                    // 馃啎 浣跨敤姣忎釜鏍煎瓙鐨勭嫭绔嬮厤缃?                    const cellModel = item.model;

                    // 鍏ㄥ眬鍙傝€冨浘浣滀负澶囩敤
                    const globalMultiRef = window.multiRefImages && window.multiRefImages.length > 0 ? window.multiRefImages : null;
                    const globalSingleRef = window.referenceImageUrl || null;
                    
                    // 浼樺厛浣跨敤鏍煎瓙鐙珛鍙傝€冨浘锛屽惁鍒欎娇鐢ㄥ叏灞€鍙傝€冨浘
                    const finalRef = cellRef || globalSingleRef;
                    
                    try {
                        const result = await generateSingleImageAPI(item.prompt, cellModel, cellRatio, globalMultiRef, finalRef);
                        if (gridItem) {
                            gridItem.classList.remove('generating');
                            gridItem.classList.add('has-result');
                            
                            // 馃帹 鐩存帴鍦ㄥ鏍煎唴鏄剧ず缁撴灉鍥剧墖
                            const textarea = gridItem.querySelector('textarea');

                            // 鍒犻櫎鏃х殑缁撴灉鍥剧墖锛堝鏋滄湁锛?                            const oldImg = gridItem.querySelector('.batch-result-img');
                            if (oldImg) oldImg.remove();

                            if (oldEditBtn) oldEditBtn.remove();
                            
                            // 鍒涘缓缁撴灉鍥剧墖
                            const imgUrl = (result && typeof result === 'object' && result.urls) ? result.urls[0] : result;
                            if (imgUrl) {

                                editBtn.onclick = (e) => {
                                    e.stopPropagation();
                                    // 绉婚櫎缁撴灉鍥剧墖鍜屾寜閽紝鏄剧ず缂栬緫鍖哄煙
                                    img.remove();
                                    editBtn.remove();

                                // 璋冩暣閰嶇疆鍖哄煙鐨?z-index锛岀‘淇濆湪鍥剧墖涔嬩笂
                                const configDiv = gridItem.querySelector('.batch-item-config');

                                const refDiv = gridItem.querySelector('.batch-item-ref');
                                if (refDiv) refDiv.style.zIndex = '3';
                            }
                        }
                        
                        // 馃帹 澶勭悊 MJ 缃戞牸鍥惧垏鍥剧粨鏋滐紙杩斿洖澶氬紶鍥撅級
                        if (result && typeof result === 'object' && result.isMjGrid && result.urls) {
                            // MJ 杩斿洖 4 寮犲垏鍥撅紝姣忓紶鐙珛鏄剧ず锛岀敤鎴峰彲鎸夐渶閫夋嫨
                            result.urls.forEach((url, subIdx) => {
                                batchResults.push({
                                    index: item.index,
                                    subIndex: subIdx,
                                    prompt: item.prompt,
                                    imageUrl: url,
                                    taskId: result.taskId,  // 淇濆瓨 taskId 渚?upscale 鐢?                                    error: null,
                                    selected: subIdx === 0,  // 榛樿鍙€変腑绗竴寮?                                    isMjSplit: true
                                });
                            });
                        } else {
                            // 鏅€氬崟鍥剧粨鏋?                            batchResults.push({
                                index: item.index,
                                prompt: item.prompt,
                                imageUrl: result,
                                error: null,
                                selected: true
                            });
                        }
                    } catch (error) {
                        console.error(`鉂?鏍煎瓙 ${item.index + 1} 鐢熸垚澶辫触:`, error);
                        if (gridItem) {
                            gridItem.classList.remove('generating');

                            // 娣诲姞閲嶆柊缂栬緫鎸夐挳锛堥敊璇儏鍐碉級

                            editBtn.onclick = (e) => {
                                e.stopPropagation();

                    completed++;

                await Promise.all(promises);
                
                // 鎸夋牸瀛愮储寮曟帓搴忥紝MJ鐨勫寮犲垏鍥炬寜 subIndex 鎺掑簭
                batchResults.sort((a, b) => {
                    if (a.index !== b.index) return a.index - b.index;

                // 鏇存柊浣欓鏄剧ず
                await loadUserQuota();
            } finally {
                // 馃敡 纭繚鏃犺鎴愬姛澶辫触閮介噸缃姸鎬?                btn.disabled = false;
                batchGenerating = false;
                loading.style.display = 'none';

        }
        
        // 馃敡 甯﹁秴鏃剁殑 fetch 鍑芥暟
        async function fetchWithTimeout(url, options = {}, timeoutMs = 60000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (err) {
                clearTimeout(timeoutId);
                if (err.name === 'AbortError') {
                    throw new Error(`璇锋眰瓒呮椂锛?{Math.round(timeoutMs/1000)}绉掞級`);
                }
                throw err;
            }
        }
        
        // 鍗曞浘鐢熸垚 API 璋冪敤锛堜緵鎵归噺妯″紡澶嶇敤锛?        // 馃帹 鏂板鍙傝€冨浘鍙傛暟鏀寔
        // 杩斿洖: string (url) 鎴?object { urls: string[], isMjGrid: true }
        async function generateSingleImageAPI(prompt, model, ratio, multiRefImages = null, singleRefImage = null) {
            let response;
            const isMidjourney = model && model.startsWith('midjourney-');
            const isSeedream = model && (model.includes('seedream') || model.includes('doubao-seedream'));
            const isQwenImage = model && (model.includes('Qwen-Image') || model.includes('Qwen/Qwen-Image'));
            const isBanana = model && model.startsWith('nano-banana-');
            
            // 馃敡 鏍规嵁妯″瀷绫诲瀷璁剧疆涓嶅悓鐨勮秴鏃舵椂闂?            // 涓囪薄Max 闇€瑕佽緝闀挎椂闂达紙寮傛浠诲姟杞锛?            const timeoutMs = isQwenImage ? 180000 : (isMidjourney ? 180000 : (isSeedream ? 120000 : 90000));
            
            if (isQwenImage) {
                // 閫氫箟涓囪薄Max - 馃敡 浣跨敤180绉掕秴鏃?                response = await fetchWithTimeout('/api/banana2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt,
                        aspect_ratio: ratio,
                        model: 'qwen-image-max',
                        userId: currentUser.id
                    })
                }, timeoutMs);
            } else if (model === 'modelscope') {
                response = await fetch('/api/modelscope', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'image', prompt, aspect_ratio: ratio, userId: currentUser.id })
                });
            } else {
                const apiEndpoint = isMidjourney ? '/api/yunwu' : (isSeedream ? '/api/yunwu' : '/api/banana2');
                const requestBody = { prompt, model, aspect_ratio: ratio, userId: currentUser.id };
                
                // 馃帹 鏄熸ⅵ鐢诲笀鍙傝€冨浘澶勭悊
                if (isSeedream) {
                    requestBody.action = 'seedream';
                    // 澶氬浘鍙傝€冩ā寮?                    if (multiRefImages && multiRefImages.length >= 2) {
                        requestBody.image_urls = multiRefImages;
                        requestBody.mode = 'multi-image';
                        console.log(`馃帹 [鎵归噺-鏄熸ⅵ鐢诲笀] 澶氬浘妯″紡: ${multiRefImages.length}寮犲弬鑰冨浘`);
                    }
                    // 鍗曞浘鍙傝€冩ā寮?                    else if (singleRefImage) {
                        requestBody.image_url = singleRefImage;
                        requestBody.mode = 'image2image';
                        console.log('馃帹 [鎵归噺-鏄熸ⅵ鐢诲笀] 鍗曞浘妯″紡');
                    }
                }
                // 馃崒 Banana妯″瀷鍙傝€冨浘澶勭悊
                else if (isBanana) {
                    if (multiRefImages && multiRefImages.length >= 2) {
                        requestBody.image_urls = multiRefImages;
                        console.log(`馃崒 [鎵归噺-Banana] 澶氬浘铻嶅悎妯″紡: ${multiRefImages.length}寮犲弬鑰冨浘`);
                    } else if (singleRefImage) {
                        requestBody.image_url = singleRefImage;
                        console.log('馃崒 [鎵归噺-Banana] 鍗曞浘鍙傝€冩ā寮?);
                    }
                }
                // 鍏朵粬妯″瀷鍗曞浘鍙傝€?                else if (singleRefImage && !isMidjourney) {
                    requestBody.image_url = singleRefImage;
                    console.log('馃柤锔?[鎵归噺] 鍗曞浘鍙傝€冩ā寮?);
                }
                
                if (isMidjourney) {
                    requestBody.action = 'midjourney';
                    const mjVersionSelect = document.getElementById('mjVersion');
                    requestBody.version = mjVersionSelect ? mjVersionSelect.value : '6.1';
                    // 馃帹 MJ 鍙傝€冨浘鏀寔锛堝浘鐢熷浘锛?                    if (singleRefImage) {
                        requestBody.image_url = singleRefImage;
                        console.log('馃帹 [鎵归噺-MJ] 鍥剧敓鍥炬ā寮?);
                    }
                }
                
                // 馃敡 浣跨敤甯﹁秴鏃剁殑 fetch
                response = await fetchWithTimeout(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                }, timeoutMs);
            }
            
            if (!response.ok) {
                let errMsg = `HTTP ${response.status}`;
                try {
                    const errData = await response.json();
                    errMsg = errData.message || errData.error || errMsg;
                } catch (e) {}
                throw new Error(errMsg);
            }
            
            const data = await response.json();
            if (data.error) throw new Error(data.message || data.error);
            
            // 鎻愬彇鍥剧墖URL
            let imageUrl = data.url || data.image_url || '';
            if (!imageUrl && data.urls && data.urls.length > 0) {
                imageUrl = data.urls[0];
            }
            if (!imageUrl) {
                imageUrl = data.data?.url || data.data?.image_url || '';
            }
            // 馃帹 MJ 缃戞牸鍥炬儏鍐碉細鎵归噺妯″紡涓嬪垏鍥捐繑鍥?寮犲崟鐙殑鍥剧墖
            if (data.gridBase64 && data.taskId) {
                // 鍒囧浘骞惰繑鍥炵壒娈婂璞?                try {
                    const splitImages = await splitMjGridImage(data.gridBase64);
                    console.log(`馃敧 [MJ鎵归噺] 鍒囧浘瀹屾垚锛屽緱鍒?${splitImages.length} 寮犲浘鐗嘸);
                    return { urls: splitImages, isMjGrid: true, taskId: data.taskId };
                } catch (splitErr) {
                    console.warn('[MJ鎵归噺] 鍒囧浘澶辫触锛屼娇鐢ㄧ綉鏍煎浘:', splitErr);
                    imageUrl = data.gridBase64;
                }
            }
            // MJ 杩斿洖 imageUrl 瀛楁
            if (!imageUrl && data.imageUrl) {
                imageUrl = data.imageUrl;
            }
            if (!imageUrl && data.gridBase64) {
                imageUrl = data.gridBase64;
            }
            if (!imageUrl && data.images && data.images.length > 0) {
                imageUrl = data.images[0].url || data.images[0];
            }
            
            if (!imageUrl) throw new Error('鏈幏鍙栧埌鍥剧墖鍦板潃');
            
            return imageUrl;
        }
        
        // 娓叉煋鎵归噺缁撴灉
        function renderBatchResults() {
            const grid = document.getElementById('batchResultGrid');
            grid.innerHTML = '';
            
            batchResults.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'batch-result-item' + (item.error ? ' error' : '') + (item.selected ? ' selected' : '');
                
                if (item.error) {
                    div.innerHTML = `<div class="batch-result-error">鉂?${item.error}</div>`;
                } else {
                    // 馃帹 MJ 鍒囧浘鏄剧ず搴忓彿鏍囪
                    let html = `<img src="${item.imageUrl}" alt="鐢熸垚缁撴灉 ${idx + 1}">`;
                    if (item.isMjSplit && item.subIndex !== undefined) {
                        html += `<div class="mj-multi-badge">鏍?{item.index + 1}-鍥?{item.subIndex + 1}</div>`;
                    }
                    div.innerHTML = html;
                }
                
                div.onclick = () => toggleBatchImageSelect(idx);
                grid.appendChild(div);
            });
            
            document.getElementById('batchResultSection').style.display = 'block';
        }
        
        // 鍒囨崲閫変腑鐘舵€?        function toggleBatchImageSelect(idx) {
            // 馃敡 闃插尽鎬ф鏌ワ細纭繚鏁扮粍鍜岀储寮曟湁鏁?            if (!batchResults || !batchResults[idx]) return;
            if (batchResults[idx].error) return;
            batchResults[idx].selected = !batchResults[idx].selected;
            renderBatchResults();
        }
        
        // 鍏ㄩ€夊浘鐗?        function selectAllBatchImages() {
            batchResults.forEach(r => {
                if (!r.error) r.selected = true;
            });
            renderBatchResults();
            showToast('宸插叏閫?);
        }
        
        // 涓嬭浇閫変腑鍥剧墖
        async function downloadSelectedImages() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('璇峰厛閫夋嫨瑕佷笅杞界殑鍥剧墖');
                return;
            }
            
            showToast(`寮€濮嬩笅杞?${selected.length} 寮犲浘鐗?..`);
            
            for (let i = 0; i < selected.length; i++) {
                const item = selected[i];
                const a = document.createElement('a');
                a.href = item.imageUrl;
                a.download = `rollroll_batch_${Date.now()}_${i + 1}.png`;
                a.click();
                await new Promise(r => setTimeout(r, 300));  // 闂撮殧涓嬭浇
            }
        }
        
        // 鎵归噺鍘荤敓瑙嗛
        function useSelectedImages() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('璇峰厛閫夋嫨瑕佺敓瑙嗛鐨勫浘鐗?);
                return;
            }
            // 瀛樺偍鍒?localStorage 渚?video-tools.html 璇诲彇
            localStorage.setItem('banana_batch_images', JSON.stringify(selected.map(r => r.imageUrl)));
            location.href = 'video-tools.html?batch=1';
        }
        
        // ==================== 鎵归噺鏍煎瓙浜岀骇閫夋嫨鍣紙MJ 4鍥鹃€夋嫨锛?====================
        let __batchCellPickerIdx = -1;  // 褰撳墠鎵撳紑鐨勬牸瀛愮储寮?        let __batchCellPickerSelected = -1;  // 褰撳墠閫変腑鐨勫浘鐗囩储寮?        
        // 鎵撳紑浜岀骇閫夋嫨鍣?        function openBatchCellPicker(batchIdx) {
            const item = batchResults[batchIdx];
            if (!item || !item.isMjMulti || !item.allImages) {
                showToast('姝ら」涓嶆敮鎸佸鍥鹃€夋嫨');
                return;
            }
            
            __batchCellPickerIdx = batchIdx;
            __batchCellPickerSelected = item.selectedImageIndex || 0;
            
            const grid = document.getElementById('batchCellPickerGrid');
            grid.innerHTML = item.allImages.map((url, i) => `
                <div class="batch-cell-picker-item ${i === __batchCellPickerSelected ? 'selected' : ''}" onclick="selectBatchCellImage(${i})">
                    <div class="batch-cell-picker-item-idx">${i + 1}</div>
                    <img src="${url}" alt="鍥剧墖 ${i + 1}">
                </div>
            `).join('');
            
            // 鏇存柊鍓爣棰?            document.getElementById('batchCellPickerSubtitle').textContent = `绗?${item.index + 1} 鏍?- 鐐瑰嚮閫夋嫨鎮ㄥ枩娆㈢殑涓€寮燻;
            
            // 鏇存柊纭鎸夐挳鐘舵€?            updateBatchCellPickerConfirmBtn();
            
            document.getElementById('batchCellPicker').classList.add('show');
        }
        
        // 閫夋嫨鍥剧墖
        function selectBatchCellImage(imgIdx) {
            __batchCellPickerSelected = imgIdx;
            
            // 鏇存柊閫変腑鐘舵€?            const items = document.querySelectorAll('.batch-cell-picker-item');
            items.forEach((el, i) => {
                el.classList.toggle('selected', i === imgIdx);
            });
            
            updateBatchCellPickerConfirmBtn();
        }
        
        // 鏇存柊纭鎸夐挳
        function updateBatchCellPickerConfirmBtn() {
            const btn = document.getElementById('batchCellPickerConfirm');
            if (__batchCellPickerSelected >= 0) {
                btn.disabled = false;
                btn.textContent = `鉁?浣跨敤绗?${__batchCellPickerSelected + 1} 寮燻;
            } else {
                btn.disabled = true;
                btn.textContent = '璇峰厛閫夋嫨涓€寮犲浘鐗?;
            }
        }
        
        // 纭閫夋嫨
        function confirmBatchCellSelection() {
            if (__batchCellPickerIdx < 0 || __batchCellPickerSelected < 0) return;
            
            const item = batchResults[__batchCellPickerIdx];
            if (!item || !item.allImages) return;
            
            // 鏇存柊璇ユ牸瀛愮殑閫変腑鍥剧墖
            item.selectedImageIndex = __batchCellPickerSelected;
            item.imageUrl = item.allImages[__batchCellPickerSelected];
            
            closeBatchCellPicker();
            renderBatchResults();
            showToast(`宸查€夋嫨绗?${__batchCellPickerSelected + 1} 寮犲浘鐗嘸);
        }
        
        // 鍏抽棴閫夋嫨鍣?        function closeBatchCellPicker() {
            document.getElementById('batchCellPicker').classList.remove('show');
            __batchCellPickerIdx = -1;
            __batchCellPickerSelected = -1;
        }
    </script>
</body>

</html>
