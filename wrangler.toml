# Cloudflare Workers 配置文件
name = "ai-video-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2024-01-01"

# 账户信息（需要替换）
account_id = "YOUR_ACCOUNT_ID"  # 在 Cloudflare Dashboard 查看
workers_dev = true

# 环境变量（敏感信息）
[vars]
# VIP_SECRET = "NanoVideo2025_Secret"  # 部署时设置

# 路由配置（可选）
# [[routes]]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"

# 免费计划限制
# - 100,000 次请求/天
# - 10ms CPU 时间/请求

# 付费计划 ($5/月)
# - 10,000,000 次请求/月
# - 50ms CPU 时间/请求

