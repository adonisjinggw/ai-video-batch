<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent-gold: #fbbf24;
            --accent-orange: #f97316;
            --border-color: #333;
            --success-color: #22c55e;
            --error-color: #ef4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 420px;
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .logo p {
            color: var(--text-dim);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        
        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        
        .message.success {
            display: block;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--success-color);
        }
        
        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: var(--error-color);
        }
        
        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        
        .back-link a {
            color: var(--text-dim);
            font-size: 13px;
            text-decoration: none;
        }
        
        .back-link a:hover {
            color: var(--accent-gold);
        }
        
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: var(--bg-input);
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
        }
        
        .password-strength-bar.weak {
            width: 33%;
            background: #ef4444;
        }
        
        .password-strength-bar.medium {
            width: 66%;
            background: #f59e0b;
        }
        
        .password-strength-bar.strong {
            width: 100%;
            background: #22c55e;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">
                <h1>🔐 重置密码</h1>
                <p>请输入您的新密码</p>
            </div>
            
            <div id="message" class="message"></div>
            
            <form id="resetForm">
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input type="password" class="form-input" id="newPassword" placeholder="至少6位密码" required minlength="6" oninput="checkPasswordStrength(this.value)">
                    <div class="password-strength">
                        <div id="passwordStrengthBar" class="password-strength-bar"></div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">确认新密码</label>
                    <input type="password" class="form-input" id="confirmPassword" placeholder="再次输入新密码" required>
                </div>
                
                <button type="submit" class="submit-btn" id="submitBtn">确认重置</button>
            </form>
            
            <div class="back-link">
                <a href="auth.html">← 返回登录</a>
            </div>
        </div>
    </div>
    
    <script>
        function showMessage(text, type = 'error') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
        }
        
        function checkPasswordStrength(password) {
            const bar = document.getElementById('passwordStrengthBar');
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            bar.className = 'password-strength-bar';
            if (strength <= 2) bar.classList.add('weak');
            else if (strength <= 4) bar.classList.add('medium');
            else bar.classList.add('strong');
        }
        
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            
            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致');
                return;
            }
            
            if (newPassword.length < 6) {
                showMessage('密码至少需要6位');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = '处理中...';
            
            try {
                if (typeof NVAuth === 'undefined') {
                    throw new Error('系统初始化失败，请刷新页面重试');
                }
                
                const client = NVAuth.getSupabase();
                if (!client) {
                    throw new Error('无法连接到服务器');
                }
                
                // 更新密码
                const { error } = await client.auth.updateUser({
                    password: newPassword
                });
                
                if (error) throw error;
                
                showMessage('密码重置成功！3秒后跳转到登录页...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'auth.html';
                }, 3000);
                
            } catch (error) {
                console.error('重置失败:', error);
                showMessage(error.message || '重置失败，请重试');
                submitBtn.disabled = false;
                submitBtn.textContent = '确认重置';
            }
        });
        
        // 检查是否从重置邮件链接进来（URL中应该有access_token）
        (async function checkResetToken() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const access_token = hashParams.get('access_token');
            const type = hashParams.get('type');
            
            if (!access_token || type !== 'recovery') {
                showMessage('无效的重置链接，请重新申请密码重置', 'error');
                document.getElementById('resetForm').style.display = 'none';
                return;
            }
            
            // Token有效，可以重置密码
            console.log('✅ 重置令牌有效');
        })();
    </script>
</body>
</html>
