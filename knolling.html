<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📝 rollroll工坊 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .header {
            position: sticky;
            top: 0;
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            z-index: 100;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .main {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .input-section {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .input-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px;
            color: var(--text);
            font-size: 16px;
            resize: none;
            min-height: 80px;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .template-section {
            margin-bottom: 20px;
        }

        .template-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .template-item {
            padding: 12px;
            background: var(--bg-card);
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }

        .template-item:active {
            background: rgba(251, 191, 36, 0.2);
        }

        .template-item .icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .settings-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .setting-item {
            flex: 1;
        }

        .setting-item label {
            display: block;
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 6px;
        }

        .setting-item select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: var(--text);
            font-size: 14px;
        }

        .generate-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #f59e0b);
            border: none;
            border-radius: 12px;
            padding: 16px;
            color: #000;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .generate-btn:disabled {
            opacity: 0.5;
        }

        .result-section {
            margin-top: 24px;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
        }

        .result-title {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 12px;
        }

        .result-text {
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .result-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-input);
            color: var(--text);
            font-size: 14px;
            cursor: pointer;
        }

        .result-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-dim);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }

        .toast.show {
            display: block;
        }

        /* 🆕 批量模式样式 */
        .batch-toggle {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .batch-toggle-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #333;
            background: var(--bg-card);
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }
        .batch-toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }
        .batch-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .batch-item {
            position: relative;
            background: var(--bg-card);
            border: 1px solid #333;
            border-radius: 12px;
            overflow: hidden;
            min-height: 280px;
            display: flex;
            flex-direction: column;
        }
        .batch-item-index {
            position: absolute;
            top: 6px;
            left: 8px;
            font-size: 12px;
            color: #fbbf24;
            font-weight: 600;
            background: rgba(251, 191, 36, 0.15);
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 1;
        }
        .batch-item textarea {
            width: 100%;
            flex: 1;
            min-height: 60px;
            background: transparent;
            border: none;
            padding: 30px 10px 8px 10px;
            color: var(--text);
            font-size: 13px;
            resize: none;
            line-height: 1.5;
        }
        .batch-item textarea:focus {
            outline: none;
            background: rgba(251, 191, 36, 0.05);
        }
        .batch-item textarea::placeholder {
            color: #555;
            font-size: 12px;
        }
        .batch-item-params {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid #222;
            max-height: 180px;
            overflow-y: auto;
        }
        .batch-item-params select {
            width: 100%;
            padding: 6px 4px;
            font-size: 11px;
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
        }
        .batch-item-params select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .batch-item-params-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }
        .batch-item-params-row select {
            flex: 1;
            min-width: 0;
        }
        .batch-template-select {
            background: #2a2a1e !important;
            border-color: #fbbf24 !important;
            color: #fbbf24 !important;
        }
        .batch-template-select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        /* 批量格子填空样式 */
        .batch-blanks-container {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 6px 0;
            border-top: 1px dashed #444;
            margin-top: 4px;
            max-height: 120px;
            overflow-y: auto;
        }
        .batch-blanks-container.active {
            display: flex;
        }
        .batch-blank-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .batch-blank-row label {
            font-size: 10px;
            color: var(--accent);
            font-weight: 500;
        }
        .batch-blank-row input {
            width: 100%;
            padding: 5px 6px;
            font-size: 11px;
            background: #1a1a2e;
            border: 1px solid #444;
            border-radius: 4px;
            color: #e0e0e0;
        }
        .batch-blank-row input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .batch-blank-row input::placeholder {
            color: #666;
            font-size: 10px;
        }
        .batch-preview {
            font-size: 10px;
            color: #888;
            background: rgba(0,0,0,0.3);
            padding: 4px 6px;
            border-radius: 4px;
            margin-top: 4px;
            line-height: 1.4;
            max-height: 50px;
            overflow: hidden;
        }
        .batch-preview .filled {
            color: #22c55e;
            font-weight: bold;
        }
        .batch-preview .unfilled {
            color: var(--accent);
            font-weight: bold;
        }
        .batch-item-status {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 14px;
        }
        .batch-item.has-result {
            border-color: #22c55e;
        }
        .batch-item.generating {
            border-color: var(--accent);
            animation: pulse 1s infinite;
        }
        .batch-item.done {
            border-color: #22c55e;
        }
        .batch-item.error {
            border-color: #ef4444;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .batch-result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 16px;
        }
        .batch-result-item {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 8px;
            font-size: 11px;
            line-height: 1.4;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .batch-result-item:hover {
            border-color: var(--accent);
        }
        .batch-result-item.selected {
            border-color: #22c55e;
        }
        .batch-result-item.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        .batch-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .batch-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* 填空模式样式 */
        .mode-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .mode-tab {
            flex: 1;
            padding: 12px;
            background: var(--bg-card);
            border: 1px solid #333;
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }

        .mode-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .fill-section {
            display: none;
        }

        .fill-section.active {
            display: block;
        }

        .fill-row {
            margin-bottom: 12px;
        }

        .fill-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .fill-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
        }

        .fill-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .fill-preview {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-dim);
        }

        .fill-preview strong {
            color: var(--accent);
        }
        
        /* 🆕 下划线填空输入框样式 */
        .blank-inputs-container {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .blank-input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .blank-input-row label {
            font-size: 12px;
            color: var(--accent);
            min-width: 70px;
            flex-shrink: 0;
        }
        .blank-input-row input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text);
            font-size: 14px;
        }
        .blank-input-row input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.2);
        }
        .blank-input-row input::placeholder {
            color: #666;
        }
    </style>
</head>

        // 🆕 全局变量存储当前模板和填空值
        let currentFillTemplate = null;
        let blankInputValues = [];
        
        // 🆕 检测模板中的下划线数量和提示词
        function parseTemplateBlanks(template) {
            // 匹配 ______（下划线括号内容） 或 单独的 ______
            const pattern = /______（([^）]+)）|______\uff08([^）]+)\uff09|______\(([^)]+)\)|______/g;
            const blanks = [];
            let match;
            while ((match = pattern.exec(template)) !== null) {
                const hint = match[1] || match[2] || match[3] || '请输入内容';
                blanks.push({
                    fullMatch: match[0],
                    hint: hint,
                    index: match.index
                });
            }
            return blanks;
        }
        
        // 🆕 渲染填空输入框
        function renderBlankInputs(blanks) {
            const container = document.getElementById('blankInputsContainer');
            if (blanks.length === 0) {
                container.style.display = 'none';
                container.innerHTML = '';
                return;
            }
            
            let html = '';
            blanks.forEach((blank, i) => {
                const label = blanks.length === 1 ? '✉️ 填写' : `✉️ 填空 ${i + 1}`;
                html += `
                    <div class="blank-input-row">
                        <label>${label}</label>
                        <input type="text" id="blankInput_${i}" placeholder="${blank.hint}" 
                            oninput="updateBlankValue(${i}, this.value)">
                    </div>
                `;
            });
            container.innerHTML = html;
            container.style.display = 'flex';
            
            // 初始化填空值数组
            blankInputValues = new Array(blanks.length).fill('');
        }
        
        // 🆕 更新填空值并实时更新预览和输入框
        function updateBlankValue(index, value) {
            blankInputValues[index] = value;
            updateTemplatePreviewAndInput();
        }
        
        // 🆕 更新模板预览和输入框
        function updateTemplatePreviewAndInput() {
            if (!currentFillTemplate) return;
            
            const preview = document.getElementById('fillPreview');
            const input = document.getElementById('conceptInput');
            
            // 用填写的值替换下划线
            let filledTemplate = currentFillTemplate.template;
            let previewHtml = currentFillTemplate.template;
            let blankIndex = 0;
            
            // 替换模板中的下划线
            const pattern = /______（[^）]+）|______\uff08[^）]+\uff09|______\([^)]+\)|______/g;
            
            filledTemplate = currentFillTemplate.template.replace(pattern, (match) => {
                const value = blankInputValues[blankIndex] || '';
                blankIndex++;
                return value || match; // 如果没填写，保留原样
            });
            
            blankIndex = 0;
            previewHtml = currentFillTemplate.template.replace(pattern, (match) => {
                const value = blankInputValues[blankIndex] || '';
                blankIndex++;
                if (value) {
                    return `<span style="color:#22c55e;font-weight:bold;">${value}</span>`;
                } else {
                    return `<span style="color:var(--accent);font-weight:bold;">[${match}]</span>`;
                }
            });
            
            preview.innerHTML = '<b>' + currentFillTemplate.name + '</b><br>' + previewHtml;
            input.value = filledTemplate;
        }

            let previewHtml = tpl.template.replace(/______（[^）]+）|______\uff08[^）]+\uff09|______\([^)]+\)|______/g,

        // 🆕 批量模式填空值存储 { cellIndex: [values...] }
        let batchBlankValues = {};
        
        // 🆕 当批量模式中选择模板时，动态生成填空输入框
        function updateBatchItemBlanks(cellIndex) {
            const select = document.getElementById(`batchTemplate_${cellIndex}`);
            const blanksContainer = document.getElementById(`batchBlanks_${cellIndex}`);
            const key = select.value;
            
            if (!key || !fillTemplates[key]) {
                blanksContainer.innerHTML = '';
                blanksContainer.classList.remove('active');
                batchBlankValues[cellIndex] = [];
                return;
            }
            
            const tpl = fillTemplates[key];
            const blanks = parseTemplateBlanks(tpl.template);
            
            if (blanks.length === 0) {
                blanksContainer.innerHTML = '<div class="batch-preview">此模板无填空项，直接使用</div>';
                blanksContainer.classList.add('active');
                batchBlankValues[cellIndex] = [];
                return;
            }
            
            // 初始化填空值数组
            batchBlankValues[cellIndex] = new Array(blanks.length).fill('');
            
            // 生成填空输入框
            let html = '';
            blanks.forEach((blank, i) => {
                const label = blanks.length === 1 ? '✉️ 填写' : `✉️ 填空${i + 1}`;

                batchBlankValues[cellIndex] = [];

            updateBatchPreview(cellIndex);

            const filledTemplate = getBatchFilledTemplate(cellIndex);

        // 🆕 更新批量模式单个格子的预览
        function updateBatchPreview(cellIndex) {
            const select = document.getElementById(`batchTemplate_${cellIndex}`);
            const preview = document.getElementById(`batchPreview_${cellIndex}`);
            const key = select?.value;
            
            if (!preview || !key || !fillTemplates[key]) return;
            
            const tpl = fillTemplates[key];
            const values = batchBlankValues[cellIndex] || [];
            const pattern = /______（[^）]+）|______\uff08[^）]+\uff09|______\([^)]+\)|______/g;
            
            let blankIndex = 0;
            const previewHtml = tpl.template.replace(pattern, (match) => {
                const value = values[blankIndex] || '';
                blankIndex++;
                if (value) {
                    return `<span class="filled">${value}</span>`;
                } else {
                    // 截取提示词前10个字符
                    const hint = match.length > 15 ? match.substring(0, 15) + '...' : match;
                    return `<span class="unfilled">[${hint}]</span>`;
                }
            });
            
            // 只显示前100个字符
            const truncated = previewHtml.length > 100 ? previewHtml.substring(0, 100) + '...' : previewHtml;
            preview.innerHTML = truncated;
        }
        
        // 🆕 获取某个格子的完整填充模板内容
        function getBatchFilledTemplate(cellIndex) {
            const select = document.getElementById(`batchTemplate_${cellIndex}`);
            const key = select?.value;
            
            if (!key || !fillTemplates[key]) return null;
            
            const tpl = fillTemplates[key];
            const values = batchBlankValues[cellIndex] || [];
            const pattern = /______（[^）]+）|______\uff08[^）]+\uff09|______\([^)]+\)|______/g;
            
            let blankIndex = 0;
            const filled = tpl.template.replace(pattern, (match) => {
                const value = values[blankIndex] || '';
                blankIndex++;
                return value || match; // 如果没填写，保留原样
            });
            
            return filled;
        }

                        action: 'text',
                        model: 'gemini-2.5-flash',
                        prompt: `你是一个专业的AI绘画提示词专家。请将以下创意概念优化成一个专业的英文提示词，用于AI图像生成。

创意概念：${concept}
风格要求：${styleMap[style]}
详细程度：${detailMap[detail]}

要求：
1. 输出纯英文提示词
2. 包含主体描述、风格、光影、构图等元素
3. 使用逗号分隔各个描述词
4. 不要解释，直接输出提示词`,
                        userId: currentUser?.id
                    })
                });

                const data = await response.json();
                currentPrompt = data.content || data.response || data.text || '';

                if (currentPrompt) {
                    document.getElementById('resultText').textContent = currentPrompt;
                    result.style.display = 'block';
                    showToast('提示词生成成功！');
                } else {
                    showToast('生成失败，请重试');
                }
            } catch (error) {
                showToast('生成失败：' + error.message);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // 🆕 批量生成提示词：从8宫格收集数据并生成
        async function generateBatchPrompts() {
            // 从8宫格收集主题、模板和参数
            const items = [];
            for (let i = 0; i < BATCH_GRID_SIZE; i++) {
                const textarea = document.getElementById(`batchPrompt_${i}`);
                const templateSelect = document.getElementById(`batchTemplate_${i}`);
                const styleSelect = document.getElementById(`batchStyle_${i}`);
                const detailSelect = document.getElementById(`batchDetail_${i}`);
                const val = textarea?.value.trim();
                if (val) {
                    items.push({ 
                        index: i, 
                        concept: val,
                        templateKey: templateSelect?.value || '',
                        style: styleSelect?.value || 'realistic',
                        detail: detailSelect?.value || 'detailed'
                    });
                }
            }
            
            if (items.length === 0) {
                showToast('请至少在一个宫格中输入主题');
                return;
            }

            const totalCost = items.length * PROMPT_COST;
            if (userQuota < totalCost) {
                showToast(`余额不足，需要${totalCost}胶片`);
                return;
            }

            const styleMap = {
                realistic: 'realistic photography, professional lighting, high resolution',
                artistic: 'artistic painting style, oil painting texture, masterful composition',
                anime: 'Japanese anime style, vibrant colors, detailed linework',
                '3d': '3D rendered, Octane render, volumetric lighting',
                abstract: 'abstract art style, geometric composition, color contrast'
            };
            const detailMap = {
                simple: '',
                medium: ', detailed, refined',
                detailed: ', ultra detailed, 8K resolution',
                ultra: ', extreme detail, 16K ultra HD, award winning'
            };

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = `⛏️ 正在生成 0/${items.length}...`;
            batchGenerating = true;
            batchResults = [];
            let completed = 0;
            
            // 重置所有宫格状态
            for (let i = 0; i < BATCH_GRID_SIZE; i++) {
                const item = document.getElementById(`batchItem_${i}`);
                if (item) item.classList.remove('generating', 'done', 'error');
                const status = document.getElementById(`batchStatus_${i}`);
                if (status) status.textContent = '';
            }
            
            // 标记正在生成的宫格
            items.forEach(t => {
                const item = document.getElementById(`batchItem_${t.index}`);
                if (item) item.classList.add('generating');
                const status = document.getElementById(`batchStatus_${t.index}`);
                if (status) status.textContent = '✨';
            });

            // 并发生成所有概念
            const promises = items.map(async (itemData) => {
                const { index, concept, templateKey, style, detail } = itemData;
                const gridItem = document.getElementById(`batchItem_${index}`);
                const statusEl = document.getElementById(`batchStatus_${index}`);
                
                // 构建提示词：优先使用填充后的模板内容
                let basePrompt = concept;
                if (templateKey && fillTemplates[templateKey]) {
                    // 🆕 优先获取用户填写的填空内容
                    const filledTemplate = getBatchFilledTemplate(index);
                    if (filledTemplate) {
                        // 如果用户填写了模板内容，结合textarea的主题
                        basePrompt = concept ? `${filledTemplate}。主题：${concept}` : filledTemplate;
                    } else {
                        const tmpl = fillTemplates[templateKey];
                        // 回退：将模板中的空白填充主题
                        basePrompt = tmpl.template.replace(/______（[^）]*）/g, concept).replace(/______/g, concept);
                    }
                }
                
                try {
                    const response = await fetch('/api/yunwu', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'text',
                            model: 'gemini-2.5-flash',
                            prompt: `你是一个专业的AI绘画提示词专家。请将以下创意概念优化成一个专业的英文提示词。

创意概念：${basePrompt}
风格要求：${styleMap[style]}${detailMap[detail]}

要求：
1. 输出纯英文提示词
2. 包含主体描述、风格、光影、构图等元素
3. 使用逗号分隔各个描述词
4. 不要解释，直接输出提示词`,
                            userId: currentUser?.id
                        })
                    });

                    const data = await response.json();
                    const prompt = data.content || data.response || data.text || '';
                    
                    // 更新宫格状态
                    if (gridItem) {
                        gridItem.classList.remove('generating');
                        gridItem.classList.add(prompt ? 'done' : 'error');
                    }
                    if (statusEl) statusEl.textContent = prompt ? '✅' : '❌';

                    batchResults.push({
                        index: index,
                        concept: concept,
                        prompt: prompt,
                        error: prompt ? null : '生成失败',
                        selected: !!prompt
                    });
                } catch (error) {
                    if (gridItem) {
                        gridItem.classList.remove('generating');
                        gridItem.classList.add('error');
                    }
                    if (statusEl) statusEl.textContent = '❌';
                    
                    batchResults.push({
                        index: index,
                        concept: concept,
                        prompt: '',
                        error: error.message,
                        selected: false
                    });
                }

                completed++;
                btn.textContent = `⛏️ 生成中 ${completed}/${items.length}...`;
            });

            await Promise.all(promises);

            batchResults.sort((a, b) => a.index - b.index);
            renderBatchResults();

            btn.disabled = false;
            btn.textContent = '⚡ 批量生成提示词';
            batchGenerating = false;

            const successCount = batchResults.filter(r => !r.error).length;
            showToast(`生成完成！成功 ${successCount}/${items.length}`);

            await loadUserQuota();
        }

        // 渲染批量结果（九宫格显示）
        function renderBatchResults() {
            const grid = document.getElementById('batchResultGrid');
            grid.innerHTML = '';

            batchResults.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'batch-result-item' + (item.error ? ' error' : '') + (item.selected ? ' selected' : '');
                div.innerHTML = `
                    <div style="font-size:12px; font-weight:600; margin-bottom:4px; color:#fbbf24;">🎯 ${item.concept.substring(0, 15)}${item.concept.length > 15 ? '...' : ''}</div>
                    <div style="font-size:11px; color:#ccc; line-height:1.4; max-height:60px; overflow:hidden;">${item.error || item.prompt.substring(0, 100)}...</div>
                `;
                div.onclick = () => toggleBatchSelect(idx);
                grid.appendChild(div);
            });

            document.getElementById('batchResultSection').style.display = 'block';
        }

        // 切换选中状态
        function toggleBatchSelect(idx) {
            if (batchResults[idx].error) return;
            batchResults[idx].selected = !batchResults[idx].selected;
            renderBatchResults();
        }

        // 复制选中的提示词
        function copySelectedPrompts() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要复制的提示词');
                return;
            }
            const text = selected.map(r => r.prompt).join('\n\n---\n\n');
            navigator.clipboard.writeText(text);
            showToast(`已复制 ${selected.length} 个提示词`);
        }

        // 复制全部提示词
        function copyAllPrompts() {
            const valid = batchResults.filter(r => !r.error);
            if (valid.length === 0) {
                showToast('没有可复制的提示词');
                return;
            }
            const text = valid.map(r => r.prompt).join('\n\n---\n\n');
            navigator.clipboard.writeText(text);
            showToast(`已复制 ${valid.length} 个提示词`);
        }

        // 批量去生图
        function useSelectedPrompts() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要生图的提示词');
                return;
            }
            // 存储到 localStorage 供 banana.html 读取
            localStorage.setItem('knolling_batch_prompts', JSON.stringify(selected.map(r => r.prompt)));
            location.href = 'banana.html?batch=1';
        }
        
        // 🎬 批量去生视频
        function useSelectedPromptsForVideo() {
            const selected = batchResults.filter(r => r.selected && !r.error);
            if (selected.length === 0) {
                showToast('请先选择要生视频的提示词');
                return;
            }
            // 存储到 localStorage 供 video-continuity.html 读取
            localStorage.setItem('video_batch_prompts', JSON.stringify(selected.map(r => r.prompt)));
            // 跳转到分镜工具页面
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';
            const targetUrl = fromMobile ? 'video-continuity.html?force=mobile&batch=1' : 'video-continuity.html?batch=1';
            location.href = targetUrl;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 🔧 修复：确保按钮事件正确绑定（支持移动端触摸）
        document.addEventListener('DOMContentLoaded', async function() {
            console.log('[knolling] 页面加载完成，开始初始化...');
            
            // 初始化认证
            if (typeof NVAuth !== 'undefined') {
                await checkUser();
            }
            authInitialized = true;
            console.log('[knolling] 认证初始化完成, currentUser:', currentUser ? currentUser.email : 'null');
            
            // 生成按钮事件绑定
            const generateBtn = document.getElementById('generateBtn');
            if (generateBtn) {
                generateBtn.onclick = null;
                generateBtn.addEventListener('click', function(e) {
                    console.log('[knolling] 生成按钮被点击 (click)');
                    generatePrompt();
                });
                generateBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('[knolling] 生成按钮被点击 (touchend)');
                    generatePrompt();
                });
            }
            
            // 🔧 修复：返回按钮支持触摸事件
            const backBtn = document.querySelector('.back-btn');
            if (backBtn) {
                backBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    goBack();
                });
            }
            
            // 🔧 修复：模板项支持触摸事件
            document.querySelectorAll('.template-item').forEach(item => {
                item.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    const onclick = this.getAttribute('onclick');
                    if (onclick) eval(onclick);
                });
            });
            
            // 🔧 修复：结果按钮支持触摸事件
            document.querySelectorAll('.result-btn').forEach(btn => {
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    const onclick = this.getAttribute('onclick');
                    if (onclick) eval(onclick);
                });
            });
            
            console.log('[knolling] 初始化完成');
        });

        async function checkUser() {
            try {
                // 等待认证状态就绪
                await Promise.race([
                    typeof __nvAuthReadyPromise !== 'undefined' ? __nvAuthReadyPromise : Promise.resolve(),
                    new Promise(resolve => setTimeout(resolve, 3000))
                ]);
                
                currentUser = await NVAuth.getCurrentUser();
                if (currentUser) {
                    console.log('[knolling] 用户已登录:', currentUser.email);
                    await loadUserQuota();
                } else {
                    console.log('[knolling] 用户未登录');
                }
            } catch (e) { console.error('检查用户失败:', e); }
        }

        async function loadUserQuota() {
            try {
                const profile = await NVAuth.getUserProfile(currentUser.id);
                userQuota = profile?.quota_balance || 0;
                console.log('[knolling] 用户胶片:', userQuota);
            } catch (e) { console.error('加载配额失败:', e); }
        }

        // 预扣费函数
        async function preDeduct(cost, description) {
            // 🔧 修复：确保cost是整数（数据库是INTEGER类型）
            cost = Math.ceil(cost);
            
            // 等待认证初始化完成
            if (!authInitialized) {
                const waitStart = Date.now();
                while (!authInitialized && (Date.now() - waitStart) < 3000) {
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            
            if (!currentUser) { showToast('请先登录'); return false; }
            if (userQuota < cost) { showToast(`胶片不足，需要${cost}胶片`); return false; }
            try {
                const res = await fetch('/api/supabase-proxy', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consume', userId: currentUser.id, amount: cost, description })
                });
                const data = await res.json().catch(() => ({}));
                
                // 🔧 修复：先检查 HTTP 状态码
                if (!res.ok) {
                    if (res.status === 400 && data.error === 'INSUFFICIENT_BALANCE') {
                        throw new Error('余额不足，请先充值');
                    }
                    throw new Error(data.message || data.error || `服务器错误: ${res.status}`);
                }
                
                if (data.success || data.newBalance !== undefined) {
                    userQuota = data.newBalance ?? data.quotaBalance ?? userQuota - cost;
                    localStorage.setItem('film_balance', String(userQuota));
                    console.log(`🎞️ 预扣费成功: -${cost}胶片, 余额=${userQuota}`);
                    return true;
                }
                throw new Error(data.message || data.error || '扣费失败');
            } catch (e) { showToast('扣费失败: ' + e.message); return false; }
        }

        // ==================== 页面状态持久化 ====================
        function saveKnollingState() {
            try {
                const state = {
                    currentTemplateKey: currentFillTemplate ? Object.keys(fillTemplates).find(k => fillTemplates[k] === currentFillTemplate) : '',
                    blankInputValues: blankInputValues || [],
                    previewContent: document.getElementById('resultBox')?.textContent || '',
                    resultSectionVisible: document.getElementById('resultSection')?.style.display === 'block',
                    timestamp: Date.now()
                };
                sessionStorage.setItem('rollroll_knolling_state', JSON.stringify(state));
                console.log('[knolling] 状态已保存');
            } catch (e) { console.warn('[knolling] 保存状态失败:', e); }
        }

        function restoreKnollingState() {
            try {
                const saved = sessionStorage.getItem('rollroll_knolling_state');
                if (!saved) return;
                const state = JSON.parse(saved);
                if (state.timestamp && Date.now() - state.timestamp > 30 * 60 * 1000) {
                    sessionStorage.removeItem('rollroll_knolling_state');
                    return;
                }
                console.log('[knolling] 恢复状态...');

                // 恢复模板选择和填空值
                if (state.currentTemplateKey && fillTemplates[state.currentTemplateKey]) {
                    blankInputValues = state.blankInputValues || [];
                    selectTemplate(state.currentTemplateKey);
                    // 恢复填空输入
                    setTimeout(() => {
                        blankInputValues.forEach((val, i) => {
                            const input = document.getElementById(`blankInput_${i}`);
                            if (input && val) {
                                input.value = val;
                            }
                        });
                    }, 100);
                }

                // 恢复结果
                if (state.previewContent) {
                    document.getElementById('resultBox').textContent = state.previewContent;
                    currentPrompt = state.previewContent;
                    document.getElementById('resultSection').style.display = 'block';
                }

                console.log('[knolling] 状态恢复完成');
            } catch (e) { console.warn('[knolling] 恢复状态失败:', e); }
        }

        document.addEventListener('visibilitychange', () => { if (document.hidden) saveKnollingState(); });
        window.addEventListener('beforeunload', saveKnollingState);
        window.addEventListener('pagehide', saveKnollingState);
        window.addEventListener('load', () => setTimeout(restoreKnollingState, 300));
    </script>
</body>
