<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频连续性生成 - RollRoll</title>
    <!-- 🔐 认证模块 -->
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #1a1a2e;
            --bg-input: #16162a;
            --accent: #fbbf24;
            --accent-hover: #f59e0b;
            --text: #ffffff;
            --text-dim: #9ca3af;
            --border: #333;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            color: var(--text);
        }
        .header {
            background: var(--bg-card);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 {
            font-size: 18px;
            color: var(--text);
        }
        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
            padding: 8px 12px;
        }
        .main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .subtitle {
            color: var(--text-dim);
            margin-bottom: 20px;
            font-size: 13px;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }
        .feature-card {
            padding: 14px;
            background: var(--bg-card);
            border-radius: 10px;
            border-left: 3px solid var(--accent);
            text-align: center;
        }
        .feature-card h3 {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .feature-card p {
            font-size: 11px;
            color: var(--text-dim);
        }
        .section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 12px;
        }
        textarea, input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea {
            resize: vertical;
            min-height: 120px;
        }
        /* 宫格分镜列表 */
        .segments-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .segment-card {
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            position: relative;
            min-height: 120px;
        }
        .segment-card:focus-within {
            border-color: var(--accent);
        }
        .segment-number {
            position: absolute;
            top: -8px;
            left: 12px;
            background: var(--accent);
            color: #000;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }
        .segment-card textarea {
            background: transparent;
            border: none;
            min-height: 80px;
            padding: 4px;
            font-size: 12px;
            line-height: 1.4;
        }
        .segment-card textarea:focus {
            outline: none;
        }
        .segment-delete {
            position: absolute;
            top: -8px;
            right: 8px;
            background: #ef4444;
            color: white;
            border: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .add-segment-btn {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 2px dashed var(--border);
            border-radius: 10px;
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-segment-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }
        .option-group label {
            font-size: 12px;
            color: var(--text-dim);
            display: block;
            margin-bottom: 6px;
        }
        .cost-info {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 16px;
        }
        .cost-info h3 {
            color: var(--accent);
            font-size: 14px;
            margin-bottom: 8px;
        }
        .cost-breakdown {
            font-size: 12px;
            color: var(--text-dim);
            line-height: 1.6;
        }
        .generate-btn {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .generate-btn:hover {
            background: var(--accent-hover);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .progress-container {
            margin-top: 20px;
            display: none;
        }
        .progress-bar {
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }
        .progress-text {
            font-size: 13px;
            color: var(--text-dim);
            text-align: center;
        }
        .results-container {
            margin-top: 20px;
            display: none;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .result-item {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
        }
        .result-item video {
            width: 100%;
            display: block;
        }
        .result-item-info {
            padding: 10px;
        }
        .result-item-info h4 {
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .result-item-info p {
            font-size: 11px;
            color: var(--text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        @media (max-width: 768px) {
            .feature-grid { grid-template-columns: repeat(2, 1fr); }
            .segments-grid { grid-template-columns: repeat(2, 1fr); }
            .options-grid { grid-template-columns: 1fr; }
            .results-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .segments-grid { grid-template-columns: 1fr; }
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>🎬 视频连续性生成</h1>
        <div style="width: 50px;"></div>
    </header>

    <main class="main">
        <p class="subtitle">使用前一个视频的最后一帧作为下一个视频的起始帧，确保画面连续性</p>

        <div class="feature-grid">
            <div class="feature-card">
                <h3>🤖 AI自动分镜</h3>
                <p>输入故事自动拆分</p>
            </div>
            <div class="feature-card">
                <h3>✨ 自动串联</h3>
                <p>分镜之间自动衔接</p>
            </div>
            <div class="feature-card">
                <h3>✏️ 可编辑</h3>
                <p>支持手动二次修改</p>
            </div>
            <div class="feature-card">
                <h3>⏱️ 异步处理</h3>
                <p>后台生成实时进度</p>
            </div>
        </div>

        <!-- AI 自动分镜输入区 -->
        <div class="section">
            <div class="section-title">📝 输入故事内容</div>
            <textarea 
                id="story-input" 
                placeholder="粘贴或输入您的故事内容，AI将自动拆分成多个分镜..."
            ></textarea>
            <div style="display: flex; gap: 12px; margin-top: 12px; align-items: center;">
                <button class="generate-btn" onclick="autoGenerateSegments()" style="width: auto; padding: 12px 24px; font-size: 14px;">
                    🤖 AI自动分镜
                </button>
                <span style="color: var(--text-dim); font-size: 12px;">AI会自动将故事拆分成3-10个连续分镜</span>
            </div>
        </div>

        <!-- 分镜宫格列表 -->
        <div class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom:0;">🎬 分镜列表</div>
                <span style="font-size: 11px; color: var(--text-dim);">💡 可手动编辑AI生成的分镜</span>
            </div>
            <div class="segments-grid" id="segments-list">
                <!-- 动态生成 -->
            </div>
            <button class="add-segment-btn" onclick="addSegment()">+ 添加分镜</button>
        </div>

        <div class="options-grid">
            <div class="option-group">
                <label>模型</label>
                <select id="model" onchange="onModelChange()">
                    <option value="sora-2-all">Sora-2 (文生视频)</option>
                    <option value="veo3.1">Veo-3.1 (快速+音频)</option>
                    <option value="grok-video-3">Grok Video 3</option>
                </select>
            </div>
            <div class="option-group">
                <label>默认时长（秒）</label>
                <input type="number" id="duration" value="15" min="3" max="25" readonly>
            </div>
            <div class="option-group">
                <label>默认比例</label>
                <select id="aspect_ratio">
                    <option value="16:9">16:9 横屏</option>
                    <option value="9:16">9:16 竖屏</option>
                    <option value="1:1">1:1 方形</option>
                </select>
            </div>
        </div>

        <!-- 🎭 Sora2 角色选择区 -->
        <div class="section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <div class="section-title" style="margin-bottom:0;">🎭 Sora2 固定角色 <span style="color: var(--text-dim); font-weight: normal; font-size:11px;">(可选)</span></div>
                <button onclick="openSora2CharacterPanel()" style="padding: 6px 12px; background: var(--accent); border: none; border-radius: 6px; color: #000; font-size: 12px; cursor: pointer; font-weight:600;">管理角色</button>
            </div>
            <div id="selectedCharacterDisplay" style="display: none; padding: 12px; background: var(--bg-input); border: 2px solid var(--accent); border-radius: 8px; margin-bottom: 8px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="selectedCharacterName" style="font-size: 13px; color: var(--text); font-weight: 500;"></span>
                    <button onclick="clearSelectedCharacter()" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px;">✕ 清除</button>
                </div>
            </div>
            <div style="display: flex; gap: 8px;">
                <select id="sora2CharacterSelect" onchange="onCharacterSelectChange()" style="flex: 1;">
                    <option value="">不使用固定角色</option>
                </select>
                <button onclick="toggleMultiSelectMode()" id="multiSelectBtn" style="padding: 10px 16px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--text);">👥 多选</button>
            </div>
            <p style="font-size: 11px; color: var(--text-dim); margin-top: 8px;">💡 点击"多选"可选择多个角色（最多6个）</p>
        </div>

        <div class="cost-info" id="cost-info">
            <h3>💰 预估费用</h3>
            <div class="cost-breakdown" id="cost-breakdown">
                请添加分镜以查看费用预估
            </div>
        </div>

        <button class="generate-btn" id="generate-btn" onclick="generateVideo()">
            开始生成
        </button>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="progress-text" id="progress-text">正在初始化...</div>
        </div>

        <div class="results-container" id="results-container">
            <div class="section">
                <div class="section-title">✨ 生成结果</div>
                <div class="results-grid" id="results-list"></div>
            </div>
        </div>
    </main>

    <script>
        let segments = ['', '', ''];
        let taskId = null;
        let pollInterval = null;
        let currentUser = null;  // 🔐 当前用户
        let selectedSora2Characters = [];  // 🎭 选中的 Sora2 角色列表（多角色）

        // 🔐 初始化认证
        async function initAuth() {
            try {
                if (typeof NVAuth !== 'undefined') {
                    currentUser = await NVAuth.getCurrentUser();
                    if (currentUser) {
                        console.log('[video-continuity] 用户已登录:', currentUser.email);
                    } else {
                        console.log('[video-continuity] 用户未登录');
                    }
                }
            } catch (e) {
                console.error('[video-continuity] 认证初始化失败:', e);
            }
        }

        // 🔙 返回工作页（智能判断移动端/PC端，不使用history.back避免返回欢迎页）
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';
            const referrer = document.referrer || '';
            
            // 判断来源
            const isMobileReferrer = referrer.includes('mobile.html');
            const isMobileScreen = window.innerWidth <= 768;
            
            if (fromMobile || isMobileReferrer || (isMobileScreen && !referrer.includes('index.html'))) {
                location.href = 'mobile.html?skip_welcome=1';
            } else {
                location.href = 'index.html';
            }
        }

        // 初始化
        async function init() {
            await initAuth();  // 🔐 先初始化认证
            
            // 🎬 从 localStorage 读取批量提示词（从提示词填空页面跳转过来）
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('batch') === '1') {
                const savedPrompts = localStorage.getItem('video_batch_prompts');
                if (savedPrompts) {
                    try {
                        const prompts = JSON.parse(savedPrompts);
                        if (prompts && prompts.length > 0) {
                            segments = prompts;  // 直接用提示词作为分镜
                            localStorage.removeItem('video_batch_prompts');
                            console.log('[video-continuity] 从 localStorage 加载了', prompts.length, '个提示词');
                        }
                    } catch (e) {
                        console.error('[video-continuity] 解析提示词失败:', e);
                    }
                }
            }
            
            renderSegments();
            updateCost();
            refreshCharacterSelect();  // 🎭 刷新角色列表
            onModelChange();  // 初始化时长
        }
        
        // 🎬 模型切换时自动更新时长
        function onModelChange() {
            const model = document.getElementById('model').value;
            const durationInput = document.getElementById('duration');
            
            // 根据模型设置固定时长
            const modelDurations = {
                'sora-2-all': 15,
                'sora-2-pro-all': 15,
                'veo3.1': 8,
                'grok-video-3': 6
            };
            
            const duration = modelDurations[model] || 15;
            durationInput.value = duration;
            
            // 更新费用估算
            updateCost();
            
            console.log(`[模型切换] ${model} -> 时长 ${duration}秒`);
        }
        
        // ==================== 🎭 Sora2 角色管理 ====================
        
        // 获取 Sora2 角色列表
        function getSora2Characters() {
            try {
                return JSON.parse(localStorage.getItem('sora2_characters') || '{}');
            } catch (e) {
                return {};
            }
        }
        
        // 保存 Sora2 角色
        function saveSora2CharacterLocal(name, username, videoUrl = '', timestamps = '1,3', profilePicture = '') {
            const chars = getSora2Characters();
            chars[name] = {
                username: username,
                videoUrl: videoUrl,
                timestamps: timestamps,
                profilePicture: profilePicture,
                createdAt: new Date().toISOString()
            };
            localStorage.setItem('sora2_characters', JSON.stringify(chars));
        }
        
        // 删除 Sora2 角色
        function deleteSora2CharacterLocal(name) {
            const chars = getSora2Characters();
            delete chars[name];
            localStorage.setItem('sora2_characters', JSON.stringify(chars));
        }
        
        // 刷新角色选择下拉框
        function refreshCharacterSelect() {
            const select = document.getElementById('sora2CharacterSelect');
            if (!select) return;
            
            const chars = getSora2Characters();
            const entries = Object.entries(chars);
            
            select.innerHTML = '<option value="">不使用固定角色</option>';
            entries.forEach(([name, data]) => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = `🎭 ${name}`;
                select.appendChild(option);
            });
            
            // 更新显示
            updateCharacterDisplayUI();
        }
        
        // 角色选择改变（下拉框单选）
        function onCharacterSelectChange() {
            const select = document.getElementById('sora2CharacterSelect');
            const name = select.value;
            
            if (!name) {
                clearSelectedCharacter();
                return;
            }
            
            const chars = getSora2Characters();
            const char = chars[name];
            if (!char) {
                clearSelectedCharacter();
                return;
            }
            
            // 单选模式：清空后添加
            selectedSora2Characters = [{ name: name, username: char.username }];
            updateCharacterDisplayUI();
        }
        
        // 更新角色显示 UI
        function updateCharacterDisplayUI() {
            const display = document.getElementById('selectedCharacterDisplay');
            const nameSpan = document.getElementById('selectedCharacterName');
            const select = document.getElementById('sora2CharacterSelect');
            
            if (selectedSora2Characters.length > 0) {
                if (display) display.style.display = 'block';
                if (nameSpan) {
                    if (selectedSora2Characters.length === 1) {
                        nameSpan.textContent = `🎭 ${selectedSora2Characters[0].name} (ID: ${selectedSora2Characters[0].username})`;
                    } else {
                        nameSpan.textContent = `🎭 ${selectedSora2Characters.length}个角色: ${selectedSora2Characters.map(c => c.name).join(', ')}`;
                    }
                }
                if (select && selectedSora2Characters.length === 1) {
                    select.value = selectedSora2Characters[0].name;
                }
            } else {
                if (display) display.style.display = 'none';
                if (select) select.value = '';
            }
        }
        
        // 清除所有选中的角色
        function clearSelectedCharacter() {
            selectedSora2Characters = [];
            updateCharacterDisplayUI();
            renderCharacterList();
        }
        
        // 切换多选模式（打开角色管理面板进行多选）
        function toggleMultiSelectMode() {
            openSora2CharacterPanel();
        }
        
        // 打开 Sora2 角色管理面板
        function openSora2CharacterPanel() {
            const old = document.getElementById('sora2CharPanel');
            if (old) old.remove();
            
            const modal = document.createElement('div');
            modal.id = 'sora2CharPanel';
            modal.style.cssText = 'display:flex; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:10000; justify-content:center; align-items:center;';
            
            modal.innerHTML = `
                <div style="width: 90%; max-width: 600px; max-height: 90vh; background: white; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;">
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid #e2e8f0; background:linear-gradient(135deg, #667eea, #764ba2);">
                        <h2 style="margin:0; color:white; font-size:18px;">🎭 Sora2 角色管理</h2>
                        <button onclick="closeSora2CharacterPanel()" style="background:none; border:none; color:white; font-size:24px; cursor:pointer;">&times;</button>
                    </div>
                    
                    <div style="padding:16px 24px; background:#f7fafc; border-bottom:1px solid #e2e8f0; font-size:13px; color:#4a5568; line-height:1.5;">
                        💡 <strong>使用方法：</strong>创建角色后，在下拉框选择角色，生成视频时将自动应用角色一致性。<br>
                        <span style="color:#c53030;">⚠️ 视频中不能出现真人，否则会失败。</span>
                    </div>
                    
                    <div style="flex:1; overflow-y:auto; padding:0;">
                        <!-- 手动创建角色 -->
                        <div style="padding:20px 24px; border-bottom:1px solid #e2e8f0;">
                            <h4 style="margin:0 0 12px 0; color:#2d3748; font-size:14px;">📹 手动创建角色</h4>
                            <input type="text" id="sora2CharVideoUrl" placeholder="视频URL 或 任务ID（如 task_xxx）" 
                                style="width:100%; padding:10px 12px; margin-bottom:8px; border:2px solid #e2e8f0; border-radius:8px; font-size:14px; box-sizing:border-box;">
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
                                <input type="text" id="sora2CharTimestamps" placeholder="时间范围" value="1,3" 
                                    style="padding:10px 12px; border:2px solid #e2e8f0; border-radius:8px; font-size:14px;">
                                <input type="text" id="sora2CharName" placeholder="角色名称" 
                                    style="padding:10px 12px; border:2px solid #e2e8f0; border-radius:8px; font-size:14px;">
                            </div>
                            <button onclick="createSora2Character()" id="sora2CreateBtn"
                                style="width:100%; padding:12px; background:linear-gradient(135deg, #667eea, #764ba2); border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer; font-size:14px;">
                                ✨ 创建角色
                            </button>
                            <div id="sora2CreateProgress" style="display:none; margin-top:10px; padding:10px; background:#f7fafc; border-radius:8px; font-size:12px; color:#4a5568;"></div>
                        </div>
                        
                        <!-- 角色列表 -->
                        <div style="padding:20px 24px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                                <h4 style="margin:0; color:#2d3748; font-size:14px;">📋 已保存的角色</h4>
                                <div style="display:flex; gap:8px;">
                                    <button onclick="clearSelectedCharacter()" style="padding:4px 10px; background:#e2e8f0; border:none; border-radius:4px; color:#4a5568; font-size:11px; cursor:pointer;">清除选择</button>
                                    <button onclick="closeSora2CharacterPanel()" style="padding:4px 10px; background:linear-gradient(135deg, #667eea, #764ba2); border:none; border-radius:4px; color:white; font-size:11px; font-weight:600; cursor:pointer;">完成</button>
                                </div>
                            </div>
                            <div style="margin-bottom:10px; padding:8px 12px; background:#eef2ff; border-radius:6px; font-size:11px; color:#667eea;">
                                💡 点击「多选」可选择多个角色（最多6个），点击「使用」单选一个角色
                            </div>
                            <div id="sora2CharList"></div>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            modal.addEventListener('click', (e) => { if (e.target === modal) closeSora2CharacterPanel(); });
            renderCharacterList();
        }
        
        // 关闭角色管理面板
        function closeSora2CharacterPanel() {
            const modal = document.getElementById('sora2CharPanel');
            if (modal) modal.remove();
            refreshCharacterSelect();  // 刷新选择框
        }
        
        // 渲染角色列表（支持多选）
        function renderCharacterList() {
            const list = document.getElementById('sora2CharList');
            if (!list) return;
            
            const chars = getSora2Characters();
            const entries = Object.entries(chars);
            const selectedNames = selectedSora2Characters.map(c => c.name);
            
            if (entries.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center; padding:40px 20px; color:#718096;">
                        <div style="font-size:48px; margin-bottom:12px;">📭</div>
                        <div style="font-size:14px;">暂无角色</div>
                        <div style="font-size:12px; margin-top:4px;">创建角色后可在多个视频中复用</div>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = entries.map(([name, data]) => {
                const safeName = name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const hasImage = data.profilePicture && data.profilePicture.startsWith('http');
                const isSelected = selectedNames.includes(name);
                return `
                <div style="background:#f7fafc; border-radius:10px; padding:14px; margin-bottom:10px; border:2px solid ${isSelected ? '#667eea' : '#e2e8f0'};">
                    <div style="display:flex; gap:12px; align-items:flex-start;">
                        ${hasImage ? `
                            <img src="${data.profilePicture}" alt="${name}" 
                                style="width:60px; height:60px; border-radius:8px; object-fit:cover; flex-shrink:0; background:#e2e8f0;">
                        ` : `
                            <div style="width:60px; height:60px; border-radius:8px; background:#e2e8f0; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:24px;">🎭</div>
                        `}
                        <div style="flex:1; min-width:0;">
                            <div style="font-size:15px; font-weight:600; color:#2d3748; margin-bottom:4px;">
                                ${isSelected ? '✅ ' : ''}${name}
                            </div>
                            <div style="font-size:11px; color:#718096; word-break:break-all; overflow:hidden; text-overflow:ellipsis;">
                                <span style="color:#667eea;">ID:</span> ${data.username || '未知'}
                            </div>
                            <div style="font-size:10px; color:#a0aec0; margin-top:4px;">
                                创建于 ${data.createdAt ? new Date(data.createdAt).toLocaleDateString() : '未知'}
                            </div>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:6px;">
                            <button onclick="selectCharacterFromPanel('${safeName}')" 
                                style="padding:6px 12px; background:linear-gradient(135deg, #667eea, #764ba2); border:none; border-radius:6px; color:white; font-size:12px; font-weight:600; cursor:pointer;">使用</button>
                            <button onclick="toggleCharacterSelection('${safeName}')" 
                                style="padding:6px 12px; background:${isSelected ? '#667eea' : '#e2e8f0'}; border:none; border-radius:6px; color:${isSelected ? 'white' : '#4a5568'}; font-size:12px; cursor:pointer;">多选</button>
                            <button onclick="deleteCharacterUI('${safeName}')" 
                                style="padding:6px 10px; background:#fff5f5; border:1px solid #fc8181; border-radius:6px; color:#c53030; font-size:12px; cursor:pointer;">🗑️</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        }
        
        // 切换角色选择（多选模式）
        function toggleCharacterSelection(name) {
            const chars = getSora2Characters();
            const char = chars[name];
            if (!char) return;
            
            const existingIndex = selectedSora2Characters.findIndex(c => c.name === name);
            
            if (existingIndex >= 0) {
                // 已选中，取消选择
                selectedSora2Characters.splice(existingIndex, 1);
            } else {
                // 未选中，添加（最多6个）
                if (selectedSora2Characters.length >= 6) {
                    alert('最多支持6个角色');
                    return;
                }
                selectedSora2Characters.push({ name: name, username: char.username });
            }
            
            updateCharacterDisplayUI();
            renderCharacterList();
        }
        
        // 从面板选择角色（单选模式）
        function selectCharacterFromPanel(name) {
            const chars = getSora2Characters();
            const char = chars[name];
            if (!char) {
                alert('角色不存在');
                return;
            }
            
            // 单选模式：清空后添加
            selectedSora2Characters = [{ name: name, username: char.username }];
            
            updateCharacterDisplayUI();
            closeSora2CharacterPanel();
            alert(`✅ 已选择角色: ${name}`);
        }
        
        // 删除角色
        function deleteCharacterUI(name) {
            if (!confirm(`确定删除角色 "${name}" 吗？`)) return;
            
            deleteSora2CharacterLocal(name);
            if (selectedSora2Character && selectedSora2Character.name === name) {
                clearSelectedCharacter();
            }
            renderCharacterList();
        }
        
        // 创建 Sora2 角色
        async function createSora2Character() {
            const videoUrl = document.getElementById('sora2CharVideoUrl').value.trim();
            const timestamps = document.getElementById('sora2CharTimestamps').value.trim() || '1,3';
            const charName = document.getElementById('sora2CharName').value.trim();
            const btn = document.getElementById('sora2CreateBtn');
            const progress = document.getElementById('sora2CreateProgress');
            
            if (!videoUrl) { alert('请输入视频URL或任务ID'); return; }
            if (!charName) { alert('请输入角色名称'); return; }
            
            btn.disabled = true;
            btn.textContent = '创建中...';
            progress.style.display = 'block';
            progress.textContent = '正在创建角色...';
            progress.style.color = '#4a5568';
            
            try {
                if (!currentUser) {
                    if (typeof NVAuth !== 'undefined') {
                        currentUser = await NVAuth.getCurrentUser();
                    }
                    if (!currentUser) throw new Error('请先登录');
                }
                
                const isTaskId = videoUrl.startsWith('task_');
                const requestBody = {
                    action: 'create-character',
                    userId: currentUser.id,
                    timestamps: timestamps
                };
                
                if (isTaskId) {
                    requestBody.from_task = videoUrl;
                } else {
                    requestBody.url = videoUrl;
                }
                
                const res = await fetch('/api/sora2', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || data.error || '角色创建失败');
                
                const username = data.character?.username;
                if (!username) throw new Error('未返回角色username');
                const profilePicture = data.character?.profile_picture_url || '';
                
                saveSora2CharacterLocal(charName, username, videoUrl, timestamps, profilePicture);
                
                document.getElementById('sora2CharVideoUrl').value = '';
                document.getElementById('sora2CharName').value = '';
                
                renderCharacterList();
                progress.textContent = `✅ 角色 "${charName}" 创建成功！`;
                progress.style.color = '#38a169';
                
            } catch (error) {
                console.error('创建角色失败:', error);
                progress.textContent = '❌ ' + error.message;
                progress.style.color = '#c53030';
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ 创建角色';
            }
        }

        // AI自动分镜
        async function autoGenerateSegments() {
            const storyInput = document.getElementById('story-input');
            const story = storyInput.value.trim();
            
            if (!story) {
                alert('请先输入故事内容');
                return;
            }

            if (story.length < 50) {
                alert('故事内容太短，请至少输入50个字');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '🤖 AI分析中...';

            try {
                // 构建提示词：让AI将故事拆分成分镜
                const prompt = `请将以下故事拆分成3-10个连续的视频分镜描述。每个分镜应该：
1. 描述具体的画面内容
2. 适合用于AI视频生成（Sora/Veo）
3. 保持场景的连贯性和逻辑性
4. 每个分镜20-50字

故事内容：
${story}

请直接输出分镜列表，每行一个分镜，格式如下：
1. [第一个分镜的画面描述]
2. [第二个分镜的画面描述]
3. [第三个分镜的画面描述]
...

只输出分镜列表，不要有其他解释。`;

                // 🔐 检查登录状态
                if (!currentUser) {
                    if (typeof NVAuth !== 'undefined') {
                        currentUser = await NVAuth.getCurrentUser();
                    }
                    if (!currentUser) {
                        throw new Error('请先登录后再使用AI分镜功能');
                    }
                }

                // 调用魔塔文本生成API
                const response = await fetch('/api/modelscope', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'text',
                        prompt: prompt,
                        userId: currentUser.id  // 🔐 传递用户ID
                    })
                });

                if (!response.ok) {
                    throw new Error('AI分析失败，请重试');
                }

                const result = await response.json();
                const text = result.text || result.content || '';

                // 解析AI返回的分镜列表
                const lines = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .map(line => {
                        // 移除序号（如 "1. " 或 "1、" 或 "- "）
                        return line.replace(/^\d+[\.\、]\s*/, '').replace(/^[-\*]\s*/, '');
                    })
                    .filter(line => line.length > 10); // 过滤太短的行

                if (lines.length === 0) {
                    throw new Error('AI未能生成有效的分镜，请重试或手动输入');
                }

                // 限制最多10个分镜
                segments = lines.slice(0, 10);
                
                // 如果少于3个，补充到3个
                while (segments.length < 3) {
                    segments.push('');
                }

                renderSegments();
                updateCost();

                alert(`✅ 成功生成 ${segments.filter(s => s).length} 个分镜！\n您可以手动修改后再生成视频。`);
                
                // 滚动到分镜列表
                document.querySelector('.segments-container').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                alert('错误：' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '🤖 AI自动分镜';
            }
        }

        // 渲染分镜列表（宫格样式）
        function renderSegments() {
            const list = document.getElementById('segments-list');
            list.innerHTML = segments.map((seg, i) => `
                <div class="segment-card">
                    <div class="segment-number">${i + 1}</div>
                    ${segments.length > 1 ? `<button class="segment-delete" onclick="removeSegment(${i})">×</button>` : ''}
                    <textarea 
                        placeholder="描述第 ${i + 1} 个分镜的内容..." 
                        onchange="updateSegment(${i}, this.value)"
                        oninput="updateCost()"
                    >${seg}</textarea>
                </div>
            `).join('');
        }

        // 从指定分镜开始生成（续写功能）
        async function generateFromSegment(startIndex) {
            if (!confirm(`确定从第 ${startIndex + 1} 个分镜开始生成吗？\n这将保留前 ${startIndex} 个分镜的结果。`)) {
                return;
            }
            
            // TODO: 实现续写功能
            // 需要传入前一个分镜的视频URL作为起始帧
            alert('续写功能开发中...\n当前版本请使用"开始生成"按钮生成全部分镜。');
        }

        // 添加分镜
        function addSegment() {
            if (segments.length >= 10) {
                alert('最多支持10个分镜');
                return;
            }
            segments.push('');
            renderSegments();
            updateCost();
        }

        // 删除分镜
        function removeSegment(index) {
            if (segments.length <= 1) {
                alert('至少需要1个分镜');
                return;
            }
            segments.splice(index, 1);
            renderSegments();
            updateCost();
        }

        // 更新分镜内容
        function updateSegment(index, value) {
            segments[index] = value;
        }

        // 更新费用预估
        function updateCost() {
            const duration = parseInt(document.getElementById('duration').value) || 5;
            const segmentCount = segments.filter(s => s.trim()).length;
            
            // 第一个分镜：文生视频（3胶片/15秒）
            // 后续分镜：图生视频（3胶片/15秒）
            const costPerSegment = (duration / 15) * 3;
            const totalCost = segmentCount * costPerSegment;
            const totalPrice = totalCost * 0.3;

            document.getElementById('cost-breakdown').innerHTML = `
                <div><strong>分镜数量：</strong>${segmentCount} 个</div>
                <div><strong>单镜时长：</strong>${duration} 秒</div>
                <div><strong>单镜费用：</strong>${costPerSegment.toFixed(1)} 胶片 (¥${(costPerSegment * 0.3).toFixed(2)})</div>
                <div><strong>总费用：</strong>${totalCost.toFixed(1)} 胶片 = ¥${totalPrice.toFixed(2)}</div>
                <div style="margin-top: 8px; color: #c53030;">⚠️ 注意：必须串行生成，总耗时约 ${(segmentCount * 1.5).toFixed(1)} 分钟</div>
            `;
        }

        // 生成视频
        async function generateVideo() {
            // 🔐 检查登录状态
            if (!currentUser) {
                // 尝试重新获取用户
                if (typeof NVAuth !== 'undefined') {
                    currentUser = await NVAuth.getCurrentUser();
                }
                if (!currentUser) {
                    alert('请先登录后再使用此功能');
                    return;
                }
            }

            const validSegments = segments.filter(s => s.trim());
            if (validSegments.length === 0) {
                alert('请至少填写一个分镜内容');
                return;
            }

            const btn = document.getElementById('generate-btn');
            const progressContainer = document.getElementById('progress-container');
            
            btn.disabled = true;
            btn.textContent = '正在创建任务...';
            progressContainer.style.display = 'block';

            try {
                const requestBody = {
                    segments: validSegments,
                    model: document.getElementById('model').value,
                    duration: parseInt(document.getElementById('duration').value),
                    aspect_ratio: document.getElementById('aspect_ratio').value,
                    async: true,
                    userId: currentUser.id  // 🔐 传递用户ID
                };
                
                // 🎭 如果选择了 Sora2 角色，添加 _character 参数（支持多角色）
                if (selectedSora2Characters && selectedSora2Characters.length > 0) {
                    const usernames = selectedSora2Characters.map(c => c.username).filter(Boolean);
                    if (usernames.length > 0) {
                        requestBody._character = usernames.join(',');
                        console.log('[video-continuity] 使用 Sora2 角色(多人):', selectedSora2Characters.map(c => c.name).join(', '), 'usernames:', usernames.join(','));
                    }
                }
                
                const response = await fetch('/api/video-continuity', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });

                const result = await response.json();
                
                if (response.ok) {
                    taskId = result.taskId;
                    btn.textContent = '生成中...';
                    startPolling();
                } else {
                    throw new Error(result.message || '创建任务失败');
                }
            } catch (error) {
                alert('错误：' + error.message);
                btn.disabled = false;
                btn.textContent = '开始生成';
                progressContainer.style.display = 'none';
            }
        }

        // 开始轮询进度
        function startPolling() {
            // 每个分镜至少需要60秒，使用10秒轮询间隔
            pollInterval = setInterval(checkProgress, 10000); // 10秒一次
            checkProgress();
        }

        // 查询进度
        async function checkProgress() {
            if (!taskId) return;

            try {
                const response = await fetch(`/api/video-continuity?taskId=${taskId}`);
                const status = await response.json();

                updateProgress(status);

                if (status.status === 'completed' || status.status === 'failed') {
                    clearInterval(pollInterval);
                    showResults(status);
                }
            } catch (error) {
                console.error('查询进度失败:', error);
            }
        }

        // 更新进度条
        function updateProgress(status) {
            const progress = ((status.currentSegment + 1) / status.totalSegments) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';
            
            let text = '';
            if (status.status === 'pending') {
                text = '正在初始化...';
            } else if (status.status === 'processing') {
                text = `正在处理第 ${status.currentSegment + 1}/${status.totalSegments} 个分镜`;
                if (status.currentPrompt) {
                    text += `：${status.currentPrompt.substring(0, 20)}...`;
                }
            } else if (status.status === 'completed') {
                text = '✅ 全部完成！';
            } else if (status.status === 'failed') {
                text = '❌ 生成失败';
            }
            
            document.getElementById('progress-text').textContent = text;
        }

        // 显示结果（宫格样式）
        function showResults(status) {
            const btn = document.getElementById('generate-btn');
            const resultsContainer = document.getElementById('results-container');
            const resultsList = document.getElementById('results-list');

            btn.disabled = false;
            btn.textContent = '重新生成';
            resultsContainer.style.display = 'block';

            if (status.status === 'failed') {
                resultsList.innerHTML = `
                    <div class="result-item" style="border: 2px solid #ef4444;">
                        <div class="result-item-info">
                            <h4 style="color: #ef4444;">❌ 生成失败</h4>
                            <p>${status.error || '未知错误'}</p>
                        </div>
                    </div>
                `;
                return;
            }

            resultsList.innerHTML = status.results.map((result, i) => `
                <div class="result-item">
                    ${result.status === 'completed' ? `<video controls src="${result.url}"></video>` : ''}
                    <div class="result-item-info">
                        <h4>分镜 ${i + 1}</h4>
                        <p title="${result.prompt}">${result.prompt}</p>
                        ${result.status === 'completed' ? `
                            <a href="${result.url}" download style="color: var(--accent); font-size: 11px;">⬇️ 下载</a>
                        ` : `
                            <span style="color: #ef4444; font-size: 11px;">${result.status === 'failed' ? '失败' : '处理中...'}</span>
                        `}
                    </div>
                </div>
            `).join('');
        }

        // 页面加载时初始化
        init();

        // ==================== 页面状态持久化 ====================
        function saveVideoContinuityState() {
            try {
                const state = {
                    segments,
                    model: document.getElementById('model')?.value || '',
                    duration: document.getElementById('duration')?.value || '',
                    aspect_ratio: document.getElementById('aspect_ratio')?.value || '',
                    selectedSora2Characters,
                    timestamp: Date.now()
                };
                sessionStorage.setItem('rollroll_videocontinuity_state', JSON.stringify(state));
                console.log('[video-continuity] 状态已保存');
            } catch (e) { console.warn('[video-continuity] 保存状态失败:', e); }
        }

        function restoreVideoContinuityState() {
            try {
                const saved = sessionStorage.getItem('rollroll_videocontinuity_state');
                if (!saved) return;
                const state = JSON.parse(saved);
                if (state.timestamp && Date.now() - state.timestamp > 30 * 60 * 1000) {
                    sessionStorage.removeItem('rollroll_videocontinuity_state');
                    return;
                }
                console.log('[video-continuity] 恢复状态...');

                if (state.segments && state.segments.length > 0) {
                    segments = state.segments;
                    renderSegments();
                }
                if (state.model) document.getElementById('model').value = state.model;
                if (state.duration) document.getElementById('duration').value = state.duration;
                if (state.aspect_ratio) document.getElementById('aspect_ratio').value = state.aspect_ratio;
                if (state.selectedSora2Characters) {
                    selectedSora2Characters = state.selectedSora2Characters;
                    updateSelectedCharactersDisplay();
                }

                console.log('[video-continuity] 状态恢复完成');
            } catch (e) { console.warn('[video-continuity] 恢复状态失败:', e); }
        }

        document.addEventListener('visibilitychange', () => { if (document.hidden) saveVideoContinuityState(); });
        window.addEventListener('beforeunload', saveVideoContinuityState);
        window.addEventListener('pagehide', saveVideoContinuityState);
        window.addEventListener('load', () => setTimeout(restoreVideoContinuityState, 300));
    </script>
</body>
