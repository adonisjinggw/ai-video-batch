<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI对话 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <script src="/js/api-core.js"></script>
    <script src="/js/skill-system.js"></script>
    <script src="/js/skill-presets.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .quota-display {
            font-size: 12px;
            color: var(--accent);
            padding: 4px 10px;
            background: rgba(251, 191, 36, 0.15);
            border-radius: 12px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            user-select: text;  /* 允许选中复制 */
            -webkit-user-select: text;
        }

        .message.user {
            background: var(--accent);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: var(--bg-card);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.ai pre {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .input-area {
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            background: var(--bg-dark);
            border-top: 1px solid #222;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .input-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 24px;
            padding: 12px 20px;
            color: var(--text);
            font-size: 16px;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            opacity: 0.5;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 8px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .quick-q {
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .quick-q:active {
            background: rgba(251, 191, 36, 0.2);
        }

        /* 消息复制按钮 */
        .message {
            position: relative;
        }
        .message .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #888;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message:hover .copy-btn {
            opacity: 1;
        }
        .message .copy-btn:active {
            background: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
        .toast.show { display: block; }

        .cost-hint {
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            padding: 4px;
        }

        /* 上传文件功能样式 */
        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .upload-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid #333;
        }
        .upload-preview:empty {
            display: none;
        }
        .preview-item {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
        }
        .preview-item img,
        .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-item .file-icon {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent);
        }
        .preview-item .file-icon span {
            font-size: 8px;
            color: var(--text-dim);
            margin-top: 2px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: #ef4444;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid #333;
            color: var(--text-dim);
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn:active {
            background: rgba(251, 191, 36, 0.2);
            color: var(--accent);
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        /* 消息中的图片/文件预览 */
        .message-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .message-attachments img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            cursor: pointer;
        }
        .message-attachments video {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
        }
        .message-attachments .file-badge {
            padding: 6px 12px;
            background: rgba(251, 191, 36, 0.15);
            border-radius: 8px;
            font-size: 12px;
            color: var(--accent);
        }
        /* 上传菜单 */
        .upload-menu {
            position: absolute;
            bottom: 100%;
            left: 0;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid #333;
            padding: 8px 0;
            margin-bottom: 8px;
            display: none;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }
        .upload-menu.show {
            display: block;
        }
        .upload-menu-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .upload-menu-item:active {
            background: rgba(251, 191, 36, 0.15);
        }
        .upload-menu-item .icon {
            font-size: 18px;
        }
        
        /* 🧩 技能选择弹窗 */
        .skill-drawer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }
        .skill-drawer.show {
            display: flex;
        }
        .skill-drawer-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }
        .skill-drawer-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .skill-drawer-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }
        .skill-filters {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
        }
        .skill-filter-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
        }
        .skill-filter-btn.active {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }
        .skill-filter-btn:not(.active) {
            background: #333;
            color: #fff;
        }
        .skill-search {
            padding: 0 20px 12px;
        }
        .skill-search input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 2px solid #2a2a35;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
        }
        .skill-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .skill-card {
            padding: 16px;
            background: var(--bg-card);
            border: 2px solid #222;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .skill-card:active {
            border-color: var(--accent);
            background: rgba(251,191,36,0.1);
        }
        .skill-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .skill-card-icon {
            font-size: 32px;
        }
        .skill-card-category {
            font-size: 11px;
            padding: 4px 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            color: #888;
        }
        .skill-card-title {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }
        .skill-card-desc {
            font-size: 12px;
            color: #888;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* 技能配置弹窗 */
        .skill-config-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1001;
            display: none;
            overflow-y: auto;
            padding: 20px;
        }
        .skill-config-modal.show {
            display: block;
        }
        .skill-config-content {
            max-width: 500px;
            margin: 0 auto;
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
        }
        .skill-config-header {
            padding: 16px 20px;
            background: #1a1a24;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .skill-config-header h3 {
            margin: 0;
            font-size: 18px;
        }
        .skill-config-body {
            padding: 20px;
        }
        .skill-config-desc {
            color: #aaa;
            font-size: 13px;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .skill-config-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .skill-param-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #ccc;
            font-weight: 600;
        }
        .skill-param-input {
            width: 100%;
            padding: 12px;
            background: var(--bg-input);
            border: 2px solid #2a2a35;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
        }
        .skill-param-hint {
            margin-top: 4px;
            font-size: 11px;
            color: #666;
        }
        .skill-config-footer {
            padding: 16px 20px;
            background: #1a1a24;
            display: flex;
            gap: 12px;
        }
        .skill-config-footer button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
        }
        .skill-config-cancel {
            background: #333;
            color: #fff;
        }
        .skill-config-execute {
            flex: 2 !important;
            background: linear-gradient(135deg, var(--accent), #f97316);
            color: #000;
            font-weight: 700;
        }
        
        /* 技能执行进度 */
        .skill-progress-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1002;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .skill-progress-modal.show {
            display: flex;
        }
        .skill-progress-content {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .skill-progress-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .skill-progress-text {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .skill-progress-bar-container {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .skill-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #f97316);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }
        .skill-progress-steps {
            text-align: left;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .skill-progress-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .skill-progress-buttons button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>🤖 AI对话</h1>
        <span class="quota-display" id="quotaDisplay">🎞️ --</span>
    </header>

    <!-- 🧩 快捷按钮区域（始终显示） -->
    <div class="quick-actions" style="padding:12px 20px; background:var(--bg-dark); border-bottom:1px solid #222;">
        <div class="quick-questions" style="margin-top:0;">
            <span class="quick-q" onclick="askQuestion('帮我写一个短视频剧本')">📝 写剧本</span>
            <span class="quick-q" onclick="askQuestion('给我一些创意灵感')">💡 找灵感</span>
            <span class="quick-q" onclick="askQuestion('帮我优化这段文案')">✨ 优化文案</span>
            <span class="quick-q" onclick="startStoryboardMode()">🎬 分镜设计</span>
            <span class="quick-q" onclick="openSkillDrawer()">🧩 技能</span>
            <span class="quick-q" onclick="askQuestion('最新AI视频技术动态')">🌐 联网搜索</span>
        </div>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h2>👋 你好！</h2>
            <p>我是你的AI助手，有什么可以帮你的？</p>
            <p class="cost-hint">按实际token消耗计费，最低1胶片</p>
        </div>
    </div>

    <div class="input-area">
        <div style="position:relative;">
            <button class="upload-btn" id="uploadBtn" onclick="toggleUploadMenu()">➕</button>
            <div class="upload-menu" id="uploadMenu">
                <div class="upload-menu-item" onclick="triggerUpload('image')">
                    <span class="icon">🖼️</span>
                    <span>上传图片</span>
                </div>
                <div class="upload-menu-item" onclick="triggerUpload('video')">
                    <span class="icon">🎬</span>
                    <span>上传视频</span>
                </div>
                <div class="upload-menu-item" onclick="triggerUpload('file')">
                    <span class="icon">📄</span>
                    <span>上传文件</span>
                </div>
            </div>
        </div>
        <div class="input-wrapper">
            <div class="upload-preview" id="uploadPreview"></div>
            <textarea class="input-box" id="inputBox" placeholder="输入消息..." rows="1"
                onkeydown="handleKeydown(event)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    
    <!-- 隐藏的文件上传输入框 -->
    <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleFileSelect(event, 'image')">
    <input type="file" id="videoInput" accept="video/*" style="display:none;" onchange="handleFileSelect(event, 'video')">
    <input type="file" id="fileInput" accept=".txt,.pdf,.doc,.docx,.md,.json,.csv,.xml" style="display:none;" onchange="handleFileSelect(event, 'file')">
    

    <div class="toast" id="toast"></div>
    
    <!-- 🧩 技能选择弹窗 -->
    <div class="skill-drawer" id="skillDrawer">
        <div class="skill-drawer-header">
            <h3>🧩 技能库</h3>
            <button class="skill-drawer-close" onclick="closeSkillDrawer()">&times;</button>
        </div>
        <div class="skill-filters" id="skillFilters">
            <button class="skill-filter-btn active" data-category="all" onclick="filterSkills('all')">全部</button>
            <button class="skill-filter-btn" data-category="video" onclick="filterSkills('video')">🎬 视频</button>
            <button class="skill-filter-btn" data-category="image" onclick="filterSkills('image')">🎨 图像</button>
            <button class="skill-filter-btn" data-category="content" onclick="filterSkills('content')">📝 内容</button>
            <button class="skill-filter-btn" data-category="automation" onclick="filterSkills('automation')">🤖 自动化</button>
        </div>
        <div class="skill-search">
            <input type="text" id="skillSearch" placeholder="🔍 搜索技能..." oninput="searchSkills(this.value)">
        </div>
        <div class="skill-list" id="skillList">
            <!-- 由 JS 动态渲染 -->
        </div>
    </div>
    
    <!-- 技能配置弹窗 -->
    <div class="skill-config-modal" id="skillConfigModal">
        <div class="skill-config-content">
            <div class="skill-config-header">
                <h3 id="skillConfigTitle">🧩 技能配置</h3>
                <button class="skill-drawer-close" onclick="closeSkillConfig()">&times;</button>
            </div>
            <div class="skill-config-body">
                <div class="skill-config-desc" id="skillConfigDesc"></div>
                <div class="skill-config-form" id="skillConfigForm">
                    <!-- 由 JS 动态生成 -->
                </div>
            </div>
            <div class="skill-config-footer">
                <button class="skill-config-cancel" onclick="closeSkillConfig()">取消</button>
                <button class="skill-config-execute" onclick="executeSelectedSkill()">🚀 开始执行</button>
            </div>
        </div>
    </div>
    
    <!-- 技能执行进度 -->
    <div class="skill-progress-modal" id="skillProgressModal">
        <div class="skill-progress-content">
            <div class="skill-progress-icon" id="skillProgressIcon">🚀</div>
            <div class="skill-progress-text" id="skillProgressText">准备中...</div>
            <div class="skill-progress-bar-container">
                <div class="skill-progress-bar" id="skillProgressBar"></div>
            </div>
            <div class="skill-progress-steps" id="skillProgressSteps">
                <!-- 由 JS 动态添加 -->
            </div>
            <div class="skill-progress-buttons">
                <button style="background:rgba(244,67,54,0.2); border:1px solid rgba(244,67,54,0.4); color:#ff8a80;" onclick="cancelSkillExecution()">⏹️ 取消</button>
                <button style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#aaa;" onclick="hideSkillProgress()">↙️ 后台运行</button>
            </div>
        </div>
    </div>

    <script>
        // 使用 NVAuth 模块
        var _sbClient = null, currentUser = null, userQuota = 0;
        let authInitialized = false;
        // 💰 AI对话费用（后端按token实际消耗计费，1胶片=¥0.3）

        // 预扣费函数
        async function preDeduct(cost, description) {
            // 🔧 修复：确保cost是整数（数据库是INTEGER类型）
            cost = Math.ceil(cost);
            
            // 等待认证初始化完成
            if (!authInitialized) {
                const waitStart = Date.now();
                while (!authInitialized && (Date.now() - waitStart) < 3000) {
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            
            if (!currentUser) { showToast('请先登录'); return false; }
            if (userQuota < cost) { showToast(`胶片不足，需要${cost}胶片`); return false; }
            try {
                const res = await fetch('/api/supabase-proxy', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consume', userId: currentUser.id, amount: cost, description })
                });
                const data = await res.json().catch(() => ({}));
                
                // 🔧 修复：先检查 HTTP 状态码
                if (!res.ok) {
                    if (res.status === 400 && data.error === 'INSUFFICIENT_BALANCE') {
                        throw new Error('余额不足，请先充值');
                    }
                    throw new Error(data.message || data.error || `服务器错误: ${res.status}`);
                }
                
                if (data.success || data.newBalance !== undefined) {
                    userQuota = data.newBalance ?? data.quotaBalance ?? userQuota - cost;
                    localStorage.setItem('film_balance', String(userQuota));
                    updateQuotaDisplay();
                    console.log(`🎞️ 预扣费成功: -${cost}胶片, 余额=${userQuota}`);
                    return true;
                }
                throw new Error(data.message || data.error || '扣费失败');
            } catch (e) { showToast('扣费失败: ' + e.message); return false; }
        }

        let messages = [];

        // 🧠 智能模型路由：根据用户输入自动选择性价比最高的模型
        // 🌟 默认首选 grok-4-fast：生成文章、提示词优化、生成提示词
        // 模型价格参考 (yunwu.ai):
        // - grok-4-fast: 输入￥1.5/1M, 输出￥6.0/1M (首选对话模型)
        // - gemini-3-flash-preview: 输入￥0.15/1M, 输出￥0.9/1M (最便宜)
        // - qwen-plus: 输入￥0.24/1M, 输出￥0.6/1M (中文优化)
        // - gemini-3-pro-preview: 输入￥0.6/1M, 输出￥3.6/1M (多模态)
        // - gemini-3-pro-preview-thinking: 输入￥0.6/1M, 输出￥3.6/1M (思考模式)
        function selectModelByIntent(text) {
            const lower = text.toLowerCase();
            
            // 🎬 分镜/视觉/电影相关 → Gemini-3 Pro Thinking (深度推理)
            const visualKeywords = ['分镜', '视觉', '电影', '场景', '画面', '镜头', '拍摄', '运镜', '组成', '構图', '光影', '布光', '角度', '景别', '特写', '远景', '中景', '近景', 'storyboard', '策划分镜', '视觉冲击'];
            if (visualKeywords.some(kw => lower.includes(kw))) {
                return { model: 'gemini-3-pro-preview-thinking', type: 'visual', icon: '🎬', cost: 2 };
            }
            
            // 🧠 深度分析/推理 → Gemini-3 Pro Thinking
            const thinkingKeywords = ['深度分析', '详细分析', '思考', '推理', '论证', '证明', '复杂问题', '多步骤'];
            if (thinkingKeywords.some(kw => lower.includes(kw))) {
                return { model: 'gemini-3-pro-preview-thinking', type: 'thinking', icon: '🧠', cost: 2 };
            }
            
            // 🔍 普通分析/理解/解释 → Qwen Plus (中文优化且便宜)
            const analysisKeywords = ['分析', '解释', '为什么', '原因', '理解', '比较', '区别', '优劣', '评价', '总结', '归纳'];
            if (analysisKeywords.some(kw => lower.includes(kw))) {
                return { model: 'qwen-plus', type: 'analysis', icon: '🔍', cost: 1 };
            }
            
            // 💻 编程/代码 → Qwen Plus (代码能力强且便宜)
            const codeKeywords = ['代码', '编程', '函数', '算法', '报错', 'bug', 'code', 'python', 'javascript', 'java', 'html', 'css', 'sql', '调试', '开发', '程序', '脚本'];
            if (codeKeywords.some(kw => lower.includes(kw))) {
                return { model: 'qwen-plus', type: 'code', icon: '💻', cost: 1 };
            }
            
            // 🌐 联网搜索/实时信息 → Gemini-3 Flash (快速且便宜)
            const searchKeywords = ['搜索', '查找', '最新', '今天', '新闻', '实时', '现在', '当前', '天气', '股价', '热约', '赛事', '比赛', '哪里', '谁是', '多少钱'];
            if (searchKeywords.some(kw => lower.includes(kw))) {
                return { model: 'gemini-3-flash-preview', type: 'search', icon: '🌐', enableSearch: true, cost: 1 };
            }
            
            // 🌟 默认：生成文章/提示词优化/创意写作/对话 → Grok-4 Fast (首选)
            return { model: 'grok-4-fast', type: 'chat', icon: '🌟', cost: 2 };
        }
        
        // 📝 模型名称映射
        const MODEL_NAMES = {
            'grok-4-fast': 'Grok-4 Fast',
            'gemini-3-flash-preview': 'Gemini Flash',
            'gemini-3-pro-preview': 'Gemini Pro',
            'gemini-3-pro-preview-thinking': 'Gemini 思考',
            'qwen-plus': '通义千问'
        };
        
        // 🎬 好莱坎视觉指导系统提示词（简洁版）
        const HOLLYWOOD_VISUAL_DIRECTOR_PROMPT = `你是专业分镜设计师。直接输出分镜表，不要废话。

格式（每个分镜一行）：
【镜号】景别 | 画面内容 | 镜头运动 | 时长

示例：

注意：
- 只输出分镜表，不要其他内容
- 每个分镜一行，简洁明了`;

        // 填充输入框（不自动发送，让用户继续编辑）

        // 🎬 分镜设计模式：先询问用户

        async function sendMessage() {
            const input = document.getElementById('inputBox');
            const text = input.value.trim();
            if (!text || isGenerating) return;

            // 🧠 智能模型路由（每次都根据内容重新选择）
            let routing;
            
            // 🎬 分镜模式：强制使用视觉指导模型
            if (isStoryboardMode) {
                routing = { model: 'gemini-3-pro-preview', type: 'storyboard', icon: '🎬', cost: 2 };
                console.log(`🎬 分镜模式: ${routing.model}`);
            } else {
                // 每次都根据内容智能选择模型
                routing = selectModelByIntent(text);
                console.log(`🧠 智能路由: ${routing.icon} ${routing.type} → ${routing.model}`);
            }

            // ✅ 检查余额是否足够（最低1胶片）
            if (userQuota < MIN_CHAT_COST) {
                showToast('余额不足，请先充值');
                return;
            }

            // 隐藏欢迎
            const welcomeEl = document.getElementById('welcome');
            if (welcomeEl) welcomeEl.style.display = 'none';

            // 添加用户消息（含附件预览）
            let userDisplayText = text;
            if (uploadedFiles.length > 0) {
                const fileNames = uploadedFiles.map(f => `📎${f.name}`).join(' ');
                userDisplayText = `${fileNames}\n${text}`;
            }
            addMessage(userDisplayText, 'user');
            messages.push({ role: 'user', content: text });
            input.value = '';
            
            // 保存当前上传的文件（发送后清空）
            const currentFiles = [...uploadedFiles];
            uploadedFiles = [];
            updateUploadPreview();

            // 显示typing + 模型提示
            const container = document.getElementById('chatContainer');
            const typingEl = document.createElement('div');
            typingEl.className = 'message ai';
            const typeNames = { storyboard: '分镜设计', visual: '视觉指导', writing: '创意写作', thinking: '深度思考', analysis: '智能分析', search: '联网搜索', code: '代码助手', chat: '智能对话' };
            const modelName = MODEL_NAMES[routing.model] || routing.model;
            typingEl.innerHTML = `<div class="typing"><span></span><span></span><span></span></div><div style="font-size:11px;color:#888;margin-top:4px;">${routing.icon} ${typeNames[routing.type] || '对话'} · ${modelName}</div>`;
            container.appendChild(typingEl);
            container.scrollTop = container.scrollHeight;

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                // 📝 构建带上下文记忆的消息列表（最近6轮对话）
                const contextMessages = messages.slice(-6).map(m => ({
                    role: m.role === 'user' ? 'user' : 'assistant',
                    content: m.content
                }));
                
                // 🎬 分镜/视觉指导模式：添加系统提示词
                let systemPrompt = '';
                let finalPrompt = text;
                if (routing.type === 'storyboard' || routing.type === 'visual') {
                    systemPrompt = HOLLYWOOD_VISUAL_DIRECTOR_PROMPT;
                    // 分镜模式完成后重置
                    if (isStoryboardMode) {
                        isStoryboardMode = false;
                        document.getElementById('inputBox').placeholder = '输入消息...';
                    }
                }
                
                // 📎 构建最终消息（支持多模态）
                let finalMessage;
                if (currentFiles.length > 0) {
                    // 有文件时，构建多模态消息
                    const contentParts = [];
                    
                    // 添加文件内容
                    for (const file of currentFiles) {
                        if (file.type === 'image') {
                            contentParts.push({
                                type: 'image_url',
                                image_url: { url: file.data }
                            });
                        } else if (file.type === 'file') {
                            // 文本文件尝试解析内容
                            if (file.data.startsWith('data:text/') || file.data.startsWith('data:application/json')) {
                                try {
                                    const base64Content = file.data.split(',')[1];
                                    const textContent = atob(base64Content);
                                    contentParts.push({
                                        type: 'text',
                                        text: `[文件: ${file.name}]\n${textContent}`
                                    });
                                } catch(e) {
                                    contentParts.push({
                                        type: 'text',
                                        text: `[文件: ${file.name}] (无法解析)`
                                    });
                                }
                            } else {
                                // 其他文件类型作为附件信息
                                contentParts.push({
                                    type: 'text',
                                    text: `[附件: ${file.name}, 大小: ${(file.size/1024).toFixed(1)}KB]`
                                });
                            }
                        } else if (file.type === 'video') {
                            // 视频文件作为附件信息（大部分AI不支持视频）
                            contentParts.push({
                                type: 'text',
                                text: `[视频附件: ${file.name}, 大小: ${(file.size/1024/1024).toFixed(1)}MB]`
                            });
                        }
                    }
                    
                    // 添加文本内容
                    if (finalPrompt) {
                        contentParts.push({ type: 'text', text: finalPrompt });
                    }
                    
                    finalMessage = { role: 'user', content: contentParts };
                    
                    // 有图片时切换到视觉模型
                    const hasImages = currentFiles.some(f => f.type === 'image');
                    if (hasImages && !routing.model.includes('vision') && !routing.model.includes('gemini') && !routing.model.includes('gpt-4')) {
                        routing.model = 'gemini-2.0-flash';  // 切换到支持视觉的模型
                        console.log('🖼️ 检测到图片，切换到视觉模型:', routing.model);
                    }
                } else {
                    // 无文件时，普通文本消息
                    finalMessage = { role: 'user', content: finalPrompt };
                }
                
                const response = await fetch('/api/yunwu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'chat',  // 使用chat action支持多轮对话
                        messages: contextMessages.concat([finalMessage]),
                        system: systemPrompt,
                        model: routing.model,
                        userId: currentUser.id,
                        enableSearch: routing.enableSearch || false
                    })
                });

                // 检查响应状态
                if (!response.ok) {
                    const errText = await response.text().catch(() => '');
                    throw new Error(`服务器错误 (${response.status}): ${errText.substring(0, 100) || '请稍后重试'}`);
                }

                const data = await response.json();
                typingEl.remove();

                if (data.error) {
                    throw new Error(data.error);
                }

                const aiText = data.content || data.text || data.response || '抱歉，我没有理解你的问题。';
                const actualCost = data.billed || 0;  // 后端返回的实际扣费

                const usedModel = data.model || routing.model;

                const tokenInfo = usage.totalTokens ? ` · ${usage.totalTokens}tk` : '';
                const modelBadge = `<div style="font-size:10px;color:#666;margin-bottom:4px;">${routing.icon} ${displayModelName}${tokenInfo} · -${actualCost}胶片</div>`;

                if (actualCost > 0) {

                    updateQuotaDisplay();

            } catch (error) {
                typingEl.remove();
                addMessage('出错了：' + error.message, 'ai');
                // ✅ 后端成功才扣费，失败不扣费，无需退款
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }
        
        // 添加带标识的消息

            msg.innerHTML = copyBtn + badge + formatMessage(text);

            msg.dataset.rawText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;

        function addMessage(text, type) {
            const container = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            // AI消息添加复制按钮
            const copyBtn = type === 'ai' ? `<button class="copy-btn" onclick="copyMessageText(this)">📋 复制</button>` : '';
            msg.innerHTML = copyBtn + formatMessage(text);
            // 保存原始文本用于复制
            msg.dataset.rawText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }
        
        // 复制消息文本
        function copyMessageText(btn) {
            const msg = btn.closest('.message');
            const text = msg.dataset.rawText || msg.innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅ 已复制';
                setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
            }).catch(() => {
                // 备用方法
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✅ 已复制';
                setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
            });
        }

        function formatMessage(text) {
            // 简单的代码块处理
            return text
                .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code style="background:#333;padding:2px 6px;border-radius:4px;">$1</code>')
                .replace(/\n/g, '<br>');
        }

        // 自动调整输入框高度
        document.getElementById('inputBox').addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';

        // ==================== 文件上传功能 ====================
        let uploadedFiles = [];  // 已上传的文件
        
        function toggleUploadMenu() {

            menu.classList.toggle('show');
        }
        
        // 点击其他地方关闭菜单
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('uploadMenu');
            const btn = document.getElementById('uploadBtn');
            if (menu && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('show');
            }
        });
        
        function triggerUpload(type) {
            document.getElementById('uploadMenu').classList.remove('show');
            if (type === 'image') {
                document.getElementById('imageInput').click();
            } else if (type === 'video') {
                document.getElementById('videoInput').click();
            } else if (type === 'file') {
                document.getElementById('fileInput').click();
            }
        }
        
        async function handleFileSelect(event, type) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            const previewContainer = document.getElementById('uploadPreview');
            
            for (const file of files) {
                // 检查文件大小
                const maxSize = type === 'video' ? 50 * 1024 * 1024 : 10 * 1024 * 1024;
                if (file.size > maxSize) {
                    showToast(`文件过大，最大${maxSize / 1024 / 1024}MB`);
                    continue;
                }
                
                // 读取文件为base64
                const base64 = await fileToBase64(file);
                
                const fileObj = {
                    type: type,
                    name: file.name,
                    size: file.size,
                    data: base64
                };
                uploadedFiles.push(fileObj);
                
                // 显示预览
                const preview = document.createElement('div');
                preview.className = 'preview-item';
                preview.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:#333;padding:4px 8px;border-radius:6px;margin:4px;font-size:12px;';
                
                if (type === 'image') {
                    preview.innerHTML = `<img src="${base64}" style="width:24px;height:24px;object-fit:cover;border-radius:4px;"><span>${file.name.substring(0, 15)}${file.name.length > 15 ? '...' : ''}</span><button onclick="removeUploadedFile(${uploadedFiles.length - 1})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                } else if (type === 'video') {
                    preview.innerHTML = `<span>🎬</span><span>${file.name.substring(0, 15)}${file.name.length > 15 ? '...' : ''}</span><button onclick="removeUploadedFile(${uploadedFiles.length - 1})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                } else {
                    preview.innerHTML = `<span>📄</span><span>${file.name.substring(0, 15)}${file.name.length > 15 ? '...' : ''}</span><button onclick="removeUploadedFile(${uploadedFiles.length - 1})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                }
                
                previewContainer.appendChild(preview);
            }
            
            // 清空 input
            event.target.value = '';
        }
        
        function removeUploadedFile(index) {
            uploadedFiles.splice(index, 1);
            updateUploadPreview();
        }
        
        function updateUploadPreview() {
            const previewContainer = document.getElementById('uploadPreview');
            previewContainer.innerHTML = '';
            
            uploadedFiles.forEach((file, index) => {
                const preview = document.createElement('div');
                preview.className = 'preview-item';
                preview.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:#333;padding:4px 8px;border-radius:6px;margin:4px;font-size:12px;';
                
                if (file.type === 'image') {
                    preview.innerHTML = `<img src="${file.data}" style="width:24px;height:24px;object-fit:cover;border-radius:4px;"><span>${file.name.substring(0, 15)}</span><button onclick="removeUploadedFile(${index})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                } else {
                    const icon = file.type === 'video' ? '🎬' : '📄';
                    preview.innerHTML = `<span>${icon}</span><span>${file.name.substring(0, 15)}</span><button onclick="removeUploadedFile(${index})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                }
                
                previewContainer.appendChild(preview);
            });
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ==================== 页面状态持久化 ====================
        function saveChatState() {
            try {
                const state = {
                    messages,
                    inputValue: document.getElementById('inputBox')?.value || '',
                    welcomeHidden: document.getElementById('welcome')?.style.display === 'none',
                    timestamp: Date.now()
                };
                sessionStorage.setItem('rollroll_chat_state', JSON.stringify(state));
                console.log('[chat] 状态已保存');
            } catch (e) { console.warn('[chat] 保存状态失败:', e); }
        }

        function restoreChatState() {
            try {
                const saved = sessionStorage.getItem('rollroll_chat_state');
                if (!saved) return;
                const state = JSON.parse(saved);
                if (state.timestamp && Date.now() - state.timestamp > 30 * 60 * 1000) {
                    sessionStorage.removeItem('rollroll_chat_state');
                    return;
                }
                console.log('[chat] 恢复状态...');

                // 恢复输入框
                if (state.inputValue) document.getElementById('inputBox').value = state.inputValue;

                // 恢复对话历史
                if (state.messages && state.messages.length > 0) {
                    messages = state.messages;
                    const welcomeEl = document.getElementById('welcome');
                    if (welcomeEl) welcomeEl.style.display = 'none';
                    const container = document.getElementById('chatContainer');
                    // 保留welcome元素，只清除消息
                    const existingMsgs = container.querySelectorAll('.message');
                    existingMsgs.forEach(m => m.remove());
                    messages.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai');
                    });
                }

                console.log('[chat] 状态恢复完成');
            } catch (e) { console.warn('[chat] 恢复状态失败:', e); }
        }

        document.addEventListener('visibilitychange', () => { if (document.hidden) saveChatState(); });
        window.addEventListener('beforeunload', saveChatState);
        window.addEventListener('pagehide', saveChatState);
        window.addEventListener('load', () => setTimeout(restoreChatState, 200));

        // 打开技能配置弹窗
        function openSkillConfig(skillId) {
            if (typeof SkillManager === 'undefined') return;
            const skill = SkillManager.getById(skillId);
            if (!skill) return;
            
            selectedSkillId = skillId;
            closeSkillDrawer();
            
            document.getElementById('skillConfigTitle').textContent = `${skill.icon} ${skill.name}`;
            document.getElementById('skillConfigDesc').textContent = skill.description;
            
            // 渲染参数表单
            const formContainer = document.getElementById('skillConfigForm');
            if (!skill.parameters || skill.parameters.length === 0) {
                formContainer.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">此技能无需额外配置参数</div>';
            } else {
                formContainer.innerHTML = skill.parameters.map(param => {
                    let inputHtml = '';
                    switch (param.type) {
                        case 'textarea':
                            inputHtml = `<textarea id="skill_param_${param.key}" class="skill-param-input" placeholder="${param.placeholder || ''}" style="min-height:80px; resize:vertical;">${param.default || ''}</textarea>`;
                            break;
                        case 'number':
                            inputHtml = `<input type="number" id="skill_param_${param.key}" class="skill-param-input" value="${param.default || ''}" min="${param.min ?? ''}" max="${param.max ?? ''}">`;
                            break;
                        case 'select':
                            const options = (param.options || []).map(opt => `<option value="${opt.value}" ${opt.value === param.default ? 'selected' : ''}>${opt.label}</option>`).join('');
                            inputHtml = `<select id="skill_param_${param.key}" class="skill-param-input">${options}</select>`;
                            break;
                        case 'checkbox':
                            inputHtml = `<label style="display:flex; align-items:center; gap:10px; cursor:pointer;"><input type="checkbox" id="skill_param_${param.key}" ${param.default ? 'checked' : ''} style="width:20px; height:20px; accent-color:var(--accent);"><span style="color:#ccc;">${param.checkboxLabel || '启用'}</span></label>`;
                            break;
                        case 'image':
                            inputHtml = `<div>
                                <input type="file" id="skill_param_${param.key}" accept="image/*" style="display:none;" onchange="(function(el){var p=el.closest('div').querySelector('.skill-img-preview');if(el.files&&el.files[0]){var r=new FileReader();r.onload=function(e){p.src=e.target.result;p.style.display='block';};r.readAsDataURL(el.files[0]);}else{p.style.display='none';}})(this)">
                                <div onclick="this.parentElement.querySelector('input[type=file]').click()" style="border:2px dashed #444; border-radius:10px; padding:20px; text-align:center; cursor:pointer; color:#888;">
                                    <div style="font-size:24px; margin-bottom:4px;">📷</div>
                                    <div style="font-size:13px;">点击上传图片</div>
                                    <img class="skill-img-preview" src="" style="display:none; max-width:100%; max-height:120px; margin-top:10px; border-radius:8px;">
                                </div>
                            </div>`;
                            break;
                        default:
                            inputHtml = `<input type="text" id="skill_param_${param.key}" class="skill-param-input" placeholder="${param.placeholder || ''}" value="${param.default || ''}">`;
                    }
                    return `
                        <div>
                            <label class="skill-param-label">${param.label}${param.required ? '<span style="color:#ef4444; margin-left:2px;">*</span>' : ''}</label>
                            ${inputHtml}
                            ${param.hint ? `<div class="skill-param-hint">${param.hint}</div>` : ''}
                        </div>
                    `;
                }).join('');
            }
            
            document.getElementById('skillConfigModal').classList.add('show');
        }
        
        // 关闭技能配置弹窗
        function closeSkillConfig() {
            document.getElementById('skillConfigModal').classList.remove('show');
            selectedSkillId = null;
        }
        
        // 收集表单参数
        function collectSkillParams() {
            if (!selectedSkillId || typeof SkillManager === 'undefined') return {};
            const skill = SkillManager.getById(selectedSkillId);
            if (!skill) return {};
            
            const params = {};
            for (const param of skill.parameters || []) {
                const el = document.getElementById(`skill_param_${param.key}`);
                if (!el) continue;
                switch (param.type) {
                    case 'checkbox':
                        params[param.key] = el.checked;
                        break;
                    case 'number':
                        params[param.key] = el.value ? Number(el.value) : param.default;
                        break;
                    case 'image':
                        params[param.key] = el.files || null;
                        break;
                    default:
                        params[param.key] = el.value || param.default;
                }
            }
            return params;
        }
        
        // 执行选中的技能
        async function executeSelectedSkill() {
            if (!selectedSkillId || typeof SkillManager === 'undefined') return;
            
            // 🔧 先保存 skillId，因为 closeSkillConfig 会清空它
            const skillIdToExecute = selectedSkillId;
            const params = collectSkillParams();
            const skill = SkillManager.getById(skillIdToExecute);
            
            // 关闭配置弹窗（会清空 selectedSkillId）
            document.getElementById('skillConfigModal').classList.remove('show');
            
            // 显示进度弹窗
            const progressModal = document.getElementById('skillProgressModal');
            const progressBar = document.getElementById('skillProgressBar');
            const progressText = document.getElementById('skillProgressText');
            const progressSteps = document.getElementById('skillProgressSteps');
            const progressIcon = document.getElementById('skillProgressIcon');
            
            progressModal.classList.add('show');
            progressBar.style.width = '0%';
            progressText.textContent = '准备中...';
            progressSteps.innerHTML = '';
            progressIcon.textContent = skill?.icon || '🚀';
            
            // 添加到对话中
            const welcomeEl = document.getElementById('welcome');
            if (welcomeEl) welcomeEl.style.display = 'none';
            addMessage(`🧩 执行技能: ${skill?.name || selectedSkillId}`, 'user');
            
            // 🎯 收集所有生成的媒体内容
            const generatedMedia = [];
            
            try {
                await SkillManager.execute(skillIdToExecute, params, {
                    onProgress: (step, progress, message) => {
                        progressBar.style.width = `${progress}%`;
                        progressText.textContent = message || `正在执行: ${step}`;
                    },
                    onStepComplete: (stepName, result) => {
                        const stepEl = document.createElement('div');
                        stepEl.style.cssText = 'display:flex; align-items:center; gap:8px; padding:8px 0; color:#4ade80; font-size:13px;';
                        stepEl.innerHTML = `<span>✅</span><span>${stepName}</span>`;
                        progressSteps.appendChild(stepEl);
                        
                        // 🎯 收集生成的媒体内容
                        if (result) {
                            console.log(`[onStepComplete] ${stepName}:`, JSON.stringify(result).substring(0, 200));
                            // 检查各种可能的URL格式
                            const imgUrl = result.imageUrl || null;
                            const vidUrl = result.videoUrl || null;
                            // result.url 可能是图片或视频（来自character_design_pack等）
                            const rawUrl = (result.url && typeof result.url === 'string' && result.url.startsWith('http')) ? result.url : null;
                            
                            if (imgUrl) {
                                generatedMedia.push({ type: 'image', url: imgUrl, step: stepName });
                            } else if (rawUrl && !rawUrl.match(/\.(mp4|webm|mov)($|\?)/i)) {
                                generatedMedia.push({ type: 'image', url: rawUrl, step: stepName });
                            }
                            
                            if (vidUrl) {
                                generatedMedia.push({ type: 'video', url: vidUrl, step: stepName });
                            } else if (rawUrl && rawUrl.match(/\.(mp4|webm|mov)($|\?)/i)) {
                                generatedMedia.push({ type: 'video', url: rawUrl, step: stepName });
                            }
                            
                            if (result.script) generatedMedia.push({ type: 'text', content: result.script, step: stepName });
                        }
                    },
                    onComplete: (result) => {
                        progressText.textContent = '✅ 执行完成！';
                        progressBar.style.width = '100%';
                        setTimeout(() => {
                            progressModal.classList.remove('show');
                            
                            // 🎯 展示生成结果
                            displaySkillResults(skill?.name || skillIdToExecute, result, generatedMedia);
                            
                            showToast(`✅ ${skill?.name || '技能'}执行完成！`);
                        }, 1500);
                    },
                    onError: (error) => {
                        progressText.textContent = `❌ 执行失败: ${error.message}`;
                        const stepEl = document.createElement('div');
                        stepEl.style.cssText = 'display:flex; align-items:center; gap:8px; padding:8px 0; color:#f87171; font-size:13px;';
                        stepEl.innerHTML = `<span>❌</span><span>${error.message}</span>`;
                        progressSteps.appendChild(stepEl);
                        addMessage(`❌ 技能执行失败: ${error.message}`, 'ai');
                    }
                });
            } catch (error) {
                console.error('[chat] Skill执行失败:', error);
                progressModal.classList.remove('show');
                addMessage(`❌ 技能执行失败: ${error.message}`, 'ai');
            }
        }

        // 🎯 展示技能执行结果
        function displaySkillResults(skillName, result, generatedMedia) {
            console.log('[displaySkillResults] result:', JSON.stringify(result, null, 2));
            console.log('[displaySkillResults] generatedMedia:', generatedMedia);
            
            // 构建结果消息
            let messageContent = `✅ 技能「${skillName}」执行完成\n\n`;
            
            // 💾 统计保存数量
            let savedImages = 0;
            let savedVideos = 0;
            let savedCharacters = 0;
            
            // 🔧 合并所有媒体到一个统一数组（用于最终展示）
            const allMedia = [...(generatedMedia || [])];
            
            // 检查 result 中是否有 videos 数组（批量生成结果）
            if (result && result.videos && Array.isArray(result.videos)) {
                const successCount = result.videos.filter(v => v.status === 'success').length;
                messageContent += `🎉 成功生成 ${successCount}/${result.videos.length} 个视频\n\n`;
                
                result.videos.forEach((v, idx) => {
                    if (v.status === 'success' && v.videoUrl && typeof saveVideoToLibrary === 'function') {
                        saveVideoToLibrary(v.videoUrl, `${skillName} - 视频${idx + 1}`, 'skill');
                        savedVideos++;
                        if (!allMedia.some(m => m.url === v.videoUrl)) {
                            allMedia.push({ type: 'video', url: v.videoUrl, step: `视频${idx + 1}` });
                        }
                    }
                    if (v.imageUrl && typeof saveImageToLibrary === 'function') {
                        saveImageToLibrary(v.imageUrl, `${skillName} - 封面${idx + 1}`, 'skill');
                        savedImages++;
                    }
                });
            }
            
            // 检查 result 中是否有 characterName（角色设定包结果）
            if (result && result.characterName && result.assets) {
                const assets = result.assets;
                const posterUrl = assets.poster || assets.turnaround;
                
                // 只在有实际图片URL时才保存角色
                if (posterUrl && typeof posterUrl === 'string' && posterUrl.startsWith('http')) {
                    if (typeof saveCharacterToLibrary === 'function') {
                        saveCharacterToLibrary(
                            result.characterName,
                            '',
                            posterUrl,
                            null,
                            typeof assets.turnaround === 'string' ? assets.turnaround : null
                        );
                        savedCharacters++;
                    }
                } else {
                    console.warn('[displaySkillResults] 角色图片URL无效, 跳过保存角色:', posterUrl);
                }
                
                // 保存所有角色图片到素材库，同时加入展示数组
                Object.entries(result.assets).forEach(([key, url]) => {
                    if (url && typeof url === 'string' && url.startsWith('http')) {
                        if (typeof saveImageToLibrary === 'function') {
                            saveImageToLibrary(url, `${result.characterName} - ${key}`, 'character');
                            savedImages++;
                        }
                        if (!allMedia.some(m => m.url === url)) {
                            allMedia.push({ type: 'image', url: url, step: `${result.characterName} - ${key}` });
                        }
                    }
                });
            }
            
            // 检查 result 中是否有 images 数组（风格统一出图结果）
            if (result && result.images && Array.isArray(result.images)) {
                result.images.forEach((img, idx) => {
                    if (img.status === 'success' && img.imageUrl && typeof saveImageToLibrary === 'function') {
                        saveImageToLibrary(img.imageUrl, `${skillName} - ${img.subject || '图片' + (idx + 1)}`, 'skill');
                        savedImages++;
                        if (!allMedia.some(m => m.url === img.imageUrl)) {
                            allMedia.push({ type: 'image', url: img.imageUrl, step: img.subject || `图片${idx + 1}` });
                        }
                    }
                });
            }
            
            // 检查 result 中是否有 pages 数组（漫画分镜结果）
            if (result && result.pages && Array.isArray(result.pages)) {
                result.pages.forEach((page, idx) => {
                    if (page.status === 'success' && page.imageUrl && typeof saveImageToLibrary === 'function') {
                        saveImageToLibrary(page.imageUrl, `${skillName} - 第${page.page}页`, 'comic');
                        savedImages++;
                        if (!allMedia.some(m => m.url === page.imageUrl)) {
                            allMedia.push({ type: 'image', url: page.imageUrl, step: `第${page.page}页` });
                        }
                    }
                });
            }
            
            // 💾 从 generatedMedia 中保存（作为补充，去重）
            if (generatedMedia && generatedMedia.length > 0) {
                generatedMedia.forEach((m, idx) => {
                    if (m.type === 'image' && m.url && typeof saveImageToLibrary === 'function') {
                        const lib = JSON.parse(localStorage.getItem('material_library') || '[]');
                        if (!lib.some(item => item.url === m.url)) {
                            saveImageToLibrary(m.url, m.step || `${skillName} - 图片${idx + 1}`, 'skill');
                            savedImages++;
                        }
                    }
                    if (m.type === 'video' && m.url && typeof saveVideoToLibrary === 'function') {
                        const lib = JSON.parse(localStorage.getItem('material_library') || '[]');
                        if (!lib.some(item => item.url === m.url)) {
                            saveVideoToLibrary(m.url, m.step || `${skillName} - 视频${idx + 1}`, 'skill');
                            savedVideos++;
                        }
                    }
                });
            }
            
            // 展示所有媒体内容统计
            const allImages = allMedia.filter(m => m.type === 'image' && m.url);
            const allVideos = allMedia.filter(m => m.type === 'video' && m.url);
            
            if (allImages.length > 0 || allVideos.length > 0) {
                messageContent += `🎨 生成内容：\n`;
                if (allImages.length > 0) messageContent += `• ${allImages.length} 张图片\n`;
                if (allVideos.length > 0) messageContent += `• ${allVideos.length} 个视频\n`;
            }
            
            // 💾 显示保存结果
            if (savedImages > 0 || savedVideos > 0 || savedCharacters > 0) {
                messageContent += `\n💾 已保存到本地：\n`;
                if (savedCharacters > 0) messageContent += `• ${savedCharacters} 个角色 → 角色库\n`;
                if (savedImages > 0) messageContent += `• ${savedImages} 张图片 → 素材库\n`;
                if (savedVideos > 0) messageContent += `• ${savedVideos} 个视频 → 素材库\n`;
            }
            
            // 📝 处理文本类结果（文案、分镜脚本等）
            let hasTextContent = false;
            if (result && result.copywritings && Array.isArray(result.copywritings) && result.copywritings.length > 0) {
                hasTextContent = true;
                messageContent += `📝 生成 ${result.copywritings.length} 条文案\n`;
            }
            if (result && result.segments && Array.isArray(result.segments) && result.segments.length > 0) {
                hasTextContent = true;
                messageContent += `✂️ 拆分为 ${result.segments.length} 个片段\n`;
            }
            if (result && result.outline && typeof result.outline === 'string') {
                hasTextContent = true;
            }
            // generatedMedia 中的文本
            const textItems = (generatedMedia || []).filter(m => m.type === 'text' && m.content);
            if (textItems.length > 0) hasTextContent = true;
            
            // 无任何结果时提示
            if (allImages.length === 0 && allVideos.length === 0 && savedCharacters === 0 && !hasTextContent) {
                messageContent += `⚠️ 未生成有效内容，可能API调用失败，请检查网络或重试\n`;
            }
            
            // 📊 添加存储验证信息（帮助诊断问题）
            try {
                const charsCount = JSON.parse(localStorage.getItem('library_chars') || '[]').length;
                const scenesCount = JSON.parse(localStorage.getItem('library_scenes') || '[]').length;
                const pcCharsCount = JSON.parse(localStorage.getItem('character_library') || '[]').length;
                messageContent += `\n📊 当前库存：角色库 ${charsCount} 条 | 素材库 ${scenesCount} 条 | PC角色库 ${pcCharsCount} 条`;
                
                // 如果result有assets但都不是有效URL，额外提示
                if (result && result.assets) {
                    const assetKeys = Object.keys(result.assets);
                    const validUrls = Object.values(result.assets).filter(v => v && typeof v === 'string' && v.startsWith('http')).length;
                    messageContent += `\n📎 result.assets: ${assetKeys.length}项, 有效URL: ${validUrls}个`;
                }
                if (generatedMedia) {
                    messageContent += ` | generatedMedia: ${generatedMedia.length}项`;
                }
            } catch (e) { }
            
            // 添加文本消息
            addMessage(messageContent, 'ai');
            
            // 📝 展示文案内容（热点文案等文本类技能）
            if (result && result.copywritings && Array.isArray(result.copywritings) && result.copywritings.length > 0) {
                const textMsg = result.copywritings.map((c, i) => `${i + 1}. ${c}`).join('\n');
                addMessage(textMsg, 'ai');
            }
            // 展示脚本拆分结果
            if (result && result.segments && Array.isArray(result.segments) && result.segments.length > 0) {
                const segMsg = result.segments.map((s, i) => `片段${i + 1}: ${typeof s === 'string' ? s : (s.description || s.content || JSON.stringify(s)).substring(0, 200)}`).join('\n\n');
                addMessage(segMsg, 'ai');
            }
            
            // 🎨 展示图片和视频（使用合并后的 allMedia）
            if (allImages.length > 0 || allVideos.length > 0) {
                const mediaContainer = document.createElement('div');
                mediaContainer.className = 'message ai';
                mediaContainer.style.cssText = 'display:flex; flex-direction:column; gap:12px; max-width:90%;';
                
                // 展示图片
                if (allImages.length > 0) {
                    const imagesGrid = document.createElement('div');
                    imagesGrid.style.cssText = 'display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px;';
                    
                    allImages.forEach((img, idx) => {
                        const imgWrapper = document.createElement('div');
                        imgWrapper.style.cssText = 'position:relative; border-radius:8px; overflow:hidden;';
                        
                        const imgEl = document.createElement('img');
                        imgEl.src = img.url;
                        imgEl.alt = img.step || `图片 ${idx + 1}`;
                        imgEl.style.cssText = 'width:100%; height:auto; display:block; cursor:pointer;';
                        imgEl.onclick = () => window.open(img.url, '_blank');
                        
                        const label = document.createElement('div');
                        label.style.cssText = 'padding:4px 8px; background:rgba(0,0,0,0.7); color:#aaa; font-size:11px; text-align:center;';
                        label.textContent = img.step || `图片 ${idx + 1}`;
                        
                        imgWrapper.appendChild(imgEl);
                        imgWrapper.appendChild(label);
                        imagesGrid.appendChild(imgWrapper);
                    });
                    
                    mediaContainer.appendChild(imagesGrid);
                }
                
                // 展示视频
                if (allVideos.length > 0) {
                    allVideos.forEach((vid, idx) => {
                        const videoWrapper = document.createElement('div');
                        videoWrapper.style.cssText = 'border-radius:8px; overflow:hidden; background:#000;';
                        
                        const videoEl = document.createElement('video');
                        videoEl.src = vid.url;
                        videoEl.controls = true;
                        videoEl.style.cssText = 'width:100%; max-height:300px;';
                        videoEl.setAttribute('playsinline', '');
                        
                        const label = document.createElement('div');
                        label.style.cssText = 'padding:6px 10px; background:#1a1a1a; color:#888; font-size:12px;';
                        label.textContent = vid.step || `视频 ${idx + 1}`;
                        
                        videoWrapper.appendChild(videoEl);
                        videoWrapper.appendChild(label);
                        mediaContainer.appendChild(videoWrapper);
                    });
                }
                
                document.getElementById('chatContainer').appendChild(mediaContainer);
                mediaContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }
        }
    </script>
</body>

</html>
