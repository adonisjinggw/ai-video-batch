<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 AI对话 - RollRoll</title>
    <script src="/api/supabase-sdk?version=2.45.1"></script>
    <script src="/js/supabase-config.js"></script>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #1a1a1a;
            --bg-input: #222;
            --text: #fff;
            --text-dim: #888;
            --accent: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-dark);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 18px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            cursor: pointer;
        }

        .quota-display {
            font-size: 12px;
            color: var(--accent);
            padding: 4px 10px;
            background: rgba(251, 191, 36, 0.15);
            border-radius: 12px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            user-select: text;  /* 允许选中复制 */
            -webkit-user-select: text;
        }

        .message.user {
            background: var(--accent);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            background: var(--bg-card);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.ai pre {
            background: var(--bg-input);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .input-area {
            padding: 16px 20px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            background: var(--bg-dark);
            border-top: 1px solid #222;
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }

        .input-box {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid #333;
            border-radius: 24px;
            padding: 12px 20px;
            color: var(--text);
            font-size: 16px;
            resize: none;
            max-height: 120px;
            font-family: inherit;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--accent);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            opacity: 0.5;
        }

        .typing {
            display: flex;
            gap: 4px;
            padding: 8px;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: var(--text-dim);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-dim);
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 12px;
            color: var(--text);
        }

        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 20px;
        }

        .quick-q {
            padding: 8px 16px;
            background: var(--bg-card);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .quick-q:active {
            background: rgba(251, 191, 36, 0.2);
        }

        /* 消息复制按钮 */
        .message {
            position: relative;
        }
        .message .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(255,255,255,0.1);
            border: none;
            color: #888;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .message:hover .copy-btn {
            opacity: 1;
        }
        .message .copy-btn:active {
            background: rgba(251, 191, 36, 0.3);
            color: #fbbf24;
        }

        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
        .toast.show { display: block; }

        .cost-hint {
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            padding: 4px;
        }

        /* 上传文件功能样式 */
        .input-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .upload-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px;
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid #333;
        }
        .upload-preview:empty {
            display: none;
        }
        .preview-item {
            position: relative;
            width: 60px;
            height: 60px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
        }
        .preview-item img,
        .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .preview-item .file-icon {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--accent);
        }
        .preview-item .file-icon span {
            font-size: 8px;
            color: var(--text-dim);
            margin-top: 2px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0 4px;
        }
        .preview-item .remove-btn {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: #ef4444;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid #333;
            color: var(--text-dim);
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn:active {
            background: rgba(251, 191, 36, 0.2);
            color: var(--accent);
        }
        .input-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }
        /* 消息中的图片/文件预览 */
        .message-attachments {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .message-attachments img {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
            cursor: pointer;
        }
        .message-attachments video {
            max-width: 200px;
            max-height: 150px;
            border-radius: 8px;
        }
        .message-attachments .file-badge {
            padding: 6px 12px;
            background: rgba(251, 191, 36, 0.15);
            border-radius: 8px;
            font-size: 12px;
            color: var(--accent);
        }
        /* 上传菜单 */
        .upload-menu {
            position: absolute;
            bottom: 100%;
            left: 0;
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid #333;
            padding: 8px 0;
            margin-bottom: 8px;
            display: none;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        }
        .upload-menu.show {
            display: block;
        }
        .upload-menu-item {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
        }
        .upload-menu-item:active {
            background: rgba(251, 191, 36, 0.15);
        }
        .upload-menu-item .icon {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <header class="header">
        <button class="back-btn" onclick="goBack()">← 返回</button>
        <h1>🤖 AI对话</h1>
        <span class="quota-display" id="quotaDisplay">🎞️ --</span>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h2>👋 你好！</h2>
            <p>我是你的AI助手，有什么可以帮你的？</p>
            <p class="cost-hint">按实际token消耗计费，最低1胶片</p>
            <div class="quick-questions">
                <span class="quick-q" onclick="askQuestion('帮我写一个短视频剧本')">📝 写剧本</span>
                <span class="quick-q" onclick="askQuestion('给我一些创意灵感')">💡 找灵感</span>
                <span class="quick-q" onclick="askQuestion('帮我优化这段文案')">✨ 优化文案</span>
                <span class="quick-q" onclick="startStoryboardMode()">🎬 分镜设计</span>
                <span class="quick-q" onclick="askQuestion('最新AI视频技术动态')">🌐 联网搜索</span>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div style="position:relative;">
            <button class="upload-btn" id="uploadBtn" onclick="toggleUploadMenu()">➕</button>
            <div class="upload-menu" id="uploadMenu">
                <div class="upload-menu-item" onclick="triggerUpload('image')">
                    <span class="icon">🖼️</span>
                    <span>上传图片</span>
                </div>
                <div class="upload-menu-item" onclick="triggerUpload('video')">
                    <span class="icon">🎬</span>
                    <span>上传视频</span>
                </div>
                <div class="upload-menu-item" onclick="triggerUpload('file')">
                    <span class="icon">📄</span>
                    <span>上传文件</span>
                </div>
            </div>
        </div>
        <div class="input-wrapper">
            <div class="upload-preview" id="uploadPreview"></div>
            <textarea class="input-box" id="inputBox" placeholder="输入消息..." rows="1"
                onkeydown="handleKeydown(event)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
    
    <!-- 隐藏的文件上传输入框 -->
    <input type="file" id="imageInput" accept="image/*" multiple style="display:none;" onchange="handleFileSelect(event, 'image')">
    <input type="file" id="videoInput" accept="video/*" style="display:none;" onchange="handleFileSelect(event, 'video')">
    <input type="file" id="fileInput" accept=".txt,.pdf,.doc,.docx,.md,.json,.csv,.xml" style="display:none;" onchange="handleFileSelect(event, 'file')">
    

    <div class="toast" id="toast"></div>

    <script>
        // 使用 NVAuth 模块
        var _sbClient = null, currentUser = null, userQuota = 0;
        let authInitialized = false;
        // 💰 AI对话费用（后端按token实际消耗计费，1胶片=¥0.3）
        const MIN_CHAT_COST = 1;  // 最低1胶片（用于余额检查）

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[chat] 页面加载完成，开始初始化...');
            
            // 🔧 修复：确保发送按钮事件正确绑定（支持移动端触摸）
            const sendBtn = document.getElementById('sendBtn');
            if (sendBtn) {
                sendBtn.onclick = null;
                sendBtn.addEventListener('click', function(e) {
                    console.log('[chat] 发送按钮被点击 (click)');
                    sendMessage();
                });
                sendBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    console.log('[chat] 发送按钮被点击 (touchend)');
                    sendMessage();
                });
                console.log('[chat] 发送按钮事件已绑定');
            }
            
            // 🔧 修复：快捷输入按钮支持触摸事件
            document.querySelectorAll('.quick-q').forEach(btn => {
                btn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    const text = this.textContent.replace(/^[^\s]+\s*/, ''); // 移除emoji前缀
                    const questionMap = {
                        '写剧本': '帮我写一个短视频剧本',
                        '找灵感': '给我一些创意灵感',
                        '优化文案': '帮我优化这段文案',
                        'AI视频': '解释一下AI视频制作'
                    };
                    const question = questionMap[text] || text;
                    console.log('[chat] 快捷输入被点击:', question);
                    askQuestion(question);
                });
            });
            
            // 🔧 修复：返回按钮支持触摸事件
            const backBtn = document.querySelector('.back-btn');
            if (backBtn) {
                backBtn.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    goBack();
                });
            }
            
            if (typeof NVAuth !== 'undefined') {
                await checkUser();
            }
            updateQuotaDisplay();
            console.log('[chat] 初始化完成');
        });

        async function checkUser() {
            try {
                // 等待认证状态就绪
                await Promise.race([
                    typeof __nvAuthReadyPromise !== 'undefined' ? __nvAuthReadyPromise : Promise.resolve(),
                    new Promise(resolve => setTimeout(resolve, 3000))
                ]);
                
                currentUser = await NVAuth.getCurrentUser();
                if (currentUser) {
                    console.log('[chat] 用户已登录:', currentUser.email);
                    await loadUserQuota();
                } else {
                    console.log('[chat] 用户未登录');
                }
            } catch (e) { console.error('检查用户失败:', e); }
            
            // 标记认证初始化完成
            authInitialized = true;
            console.log('[chat] 认证初始化完成, currentUser:', currentUser ? currentUser.email : 'null');
        }

        async function loadUserQuota() {
            try {
                const profile = await NVAuth.getUserProfile(currentUser.id);
                userQuota = profile?.quota_balance || 0;
                updateQuotaDisplay();
                console.log('[chat] 用户胶片:', userQuota);
            } catch (e) { console.error('加载配额失败:', e); }
        }

        function updateQuotaDisplay() {
            const el = document.getElementById('quotaDisplay');
            if (currentUser) {
                el.textContent = `🎞️ ${userQuota}`;
            } else {
                el.textContent = '🎞️ 未登录';
            }
        }

        // 预扣费函数
        async function preDeduct(cost, description) {
            // 🔧 修复：确保cost是整数（数据库是INTEGER类型）
            cost = Math.ceil(cost);
            
            // 等待认证初始化完成
            if (!authInitialized) {
                const waitStart = Date.now();
                while (!authInitialized && (Date.now() - waitStart) < 3000) {
                    await new Promise(r => setTimeout(r, 100));
                }
            }
            
            if (!currentUser) { showToast('请先登录'); return false; }
            if (userQuota < cost) { showToast(`胶片不足，需要${cost}胶片`); return false; }
            try {
                const res = await fetch('/api/supabase-proxy', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'consume', userId: currentUser.id, amount: cost, description })
                });
                const data = await res.json().catch(() => ({}));
                
                // 🔧 修复：先检查 HTTP 状态码
                if (!res.ok) {
                    if (res.status === 400 && data.error === 'INSUFFICIENT_BALANCE') {
                        throw new Error('余额不足，请先充值');
                    }
                    throw new Error(data.message || data.error || `服务器错误: ${res.status}`);
                }
                
                if (data.success || data.newBalance !== undefined) {
                    userQuota = data.newBalance ?? data.quotaBalance ?? userQuota - cost;
                    localStorage.setItem('film_balance', String(userQuota));
                    updateQuotaDisplay();
                    console.log(`🎞️ 预扣费成功: -${cost}胶片, 余额=${userQuota}`);
                    return true;
                }
                throw new Error(data.message || data.error || '扣费失败');
            } catch (e) { showToast('扣费失败: ' + e.message); return false; }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // 返回函数 - 直接返回 mobile.html 工作区
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const fromMobile = urlParams.get('force') === 'mobile';
            
            if (fromMobile) {
                location.href = 'mobile.html?skip_welcome=1';
            } else {
                location.href = 'index.html';
            }
        }

        let messages = [];
        let isGenerating = false;

        // 🧠 智能模型路由：根据用户输入自动选择性价比最高的模型
        // 模型价格参考 (yunwu.ai):
        // - gemini-3-flash-preview: 输入￥0.15/1M, 输出￥0.9/1M (最便宜)
        // - qwen-plus: 输入￥0.24/1M, 输出￥0.6/1M (中文优化)
        // - gemini-3-pro-preview: 输入￥0.6/1M, 输出￥3.6/1M (多模态)
        // - gemini-3-pro-preview-thinking: 输入￥0.6/1M, 输出￥3.6/1M (思考模式)
        function selectModelByIntent(text) {
            const lower = text.toLowerCase();
            
            // 🎬 分镜/视觉/电影相关 → Gemini-3 Pro Thinking (深度推理)
            const visualKeywords = ['分镜', '视觉', '电影', '场景', '画面', '镜头', '拍摄', '运镜', '组成', '構图', '光影', '布光', '角度', '景别', '特写', '远景', '中景', '近景', 'storyboard', '策划分镜', '视觉冲击'];
            if (visualKeywords.some(kw => lower.includes(kw))) {
                return { model: 'gemini-3-pro-preview-thinking', type: 'visual', icon: '🎬', cost: 2 };
            }
            
            // ✍️ 写作/剧本/文案 → Gemini-3 Pro (擅长创意写作)
            const writingKeywords = ['写', '剧本', '文案', '故事', '小说', '文章', '写作', '广告', '创意', '灵感', '标题', '口号', '旇白', '对白', '营销', '推广', '文学'];
            if (writingKeywords.some(kw => lower.includes(kw))) {
                return { model: 'gemini-3-pro-preview', type: 'writing', icon: '✍️', cost: 2 };
            }
            
            // 🧠 深度分析/推理 → Gemini-3 Pro Thinking
            const thinkingKeywords = ['深度分析', '详细分析', '思考', '推理', '论证', '证明', '复杂问题', '多步骤'];
            if (thinkingKeywords.some(kw => lower.includes(kw))) {
                return { model: 'gemini-3-pro-preview-thinking', type: 'thinking', icon: '🧠', cost: 2 };
            }
            
            // 🔍 普通分析/理解/解释 → Qwen Plus (中文优化且便宜)
            const analysisKeywords = ['分析', '解释', '为什么', '原因', '理解', '比较', '区别', '优劣', '评价', '总结', '归纳'];
            if (analysisKeywords.some(kw => lower.includes(kw))) {
                return { model: 'qwen-plus', type: 'analysis', icon: '🔍', cost: 1 };
            }
            
            // 💻 编程/代码 → Qwen Plus (代码能力强且便宜)
            const codeKeywords = ['代码', '编程', '函数', '算法', '报错', 'bug', 'code', 'python', 'javascript', 'java', 'html', 'css', 'sql', '调试', '开发', '程序', '脚本'];
            if (codeKeywords.some(kw => lower.includes(kw))) {
                return { model: 'qwen-plus', type: 'code', icon: '💻', cost: 1 };
            }
            
            // 🌐 联网搜索/实时信息 → Gemini-3 Flash (快速且便宜)
            const searchKeywords = ['搜索', '查找', '最新', '今天', '新闻', '实时', '现在', '当前', '天气', '股价', '热约', '赛事', '比赛', '哪里', '谁是', '多少钱'];
            if (searchKeywords.some(kw => lower.includes(kw))) {
                return { model: 'gemini-3-flash-preview', type: 'search', icon: '🌐', enableSearch: true, cost: 1 };
            }
            
            // 🎇 中文对话优化 → Qwen Plus (中文能力强且便宜)
            const chineseRatio = (text.match(/[\u4e00-\u9fa5]/g) || []).length / text.length;
            if (chineseRatio > 0.7 && text.length < 100) {
                return { model: 'qwen-plus', type: 'chat', icon: '🎇', cost: 1 };
            }
            
            // 💬 默认：简单对话 → Gemini-3 Flash (最便宜)
            return { model: 'gemini-3-flash-preview', type: 'chat', icon: '💬', cost: 1 };
        }
        
        // 📝 模型名称映射
        const MODEL_NAMES = {
            'gemini-3-flash-preview': 'Gemini Flash',
            'gemini-3-pro-preview': 'Gemini Pro',
            'gemini-3-pro-preview-thinking': 'Gemini 思考',
            'qwen-plus': '通义千问'
        };
        
        // 🎬 好莱坎视觉指导系统提示词（简洁版）
        const HOLLYWOOD_VISUAL_DIRECTOR_PROMPT = `你是专业分镜设计师。直接输出分镜表，不要废话。

格式（每个分镜一行）：
【镜号】景别 | 画面内容 | 镜头运动 | 时长

示例：
【1】远景 | 日落海边，人物剑影走来 | 推镜 | 3s
【2】中景 | 人物正面，表情坚毅 | 固定 | 2s

注意：
- 只输出分镜表，不要其他内容
- 每个分镜一行，简洁明了`;

        // 填充输入框（不自动发送，让用户继续编辑）
        function fillInput(text) {
            const input = document.getElementById('inputBox');
            input.value = text;
            input.focus();
            // 光标移到末尾
            input.setSelectionRange(text.length, text.length);
        }
        
        // 快捷问题（直接发送）
        function askQuestion(q) {
            document.getElementById('inputBox').value = q;
            sendMessage();
        }
        
        // 🎬 分镜设计模式：先询问用户
        let isStoryboardMode = false;
        function startStoryboardMode() {
            isStoryboardMode = true;
            // 隐藏欢迎
            const welcomeEl = document.getElementById('welcome');
            if (welcomeEl) welcomeEl.style.display = 'none';
            // 显示AI询问
            addMessage('🎬 分镜设计模式\n\n请描述你想要的场景或故事，我来帮你规划分镜。\n\n例如：\n• 一个女孩在海边看日落\n• 美食探店vlog开场\n• 产品广告展示', 'ai');
            // 设置输入框提示
            document.getElementById('inputBox').placeholder = '描述你的场景或故事...';
            document.getElementById('inputBox').focus();
        }

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('inputBox');
            const text = input.value.trim();
            if (!text || isGenerating) return;

            // 🧠 智能模型路由（每次都根据内容重新选择）
            let routing;
            
            // 🎬 分镜模式：强制使用视觉指导模型
            if (isStoryboardMode) {
                routing = { model: 'gemini-3-pro-preview', type: 'storyboard', icon: '🎬', cost: 2 };
                console.log(`🎬 分镜模式: ${routing.model}`);
            } else {
                // 每次都根据内容智能选择模型
                routing = selectModelByIntent(text);
                console.log(`🧠 智能路由: ${routing.icon} ${routing.type} → ${routing.model}`);
            }

            // ✅ 检查余额是否足够（最低1胶片）
            if (userQuota < MIN_CHAT_COST) {
                showToast('余额不足，请先充值');
                return;
            }

            // 隐藏欢迎
            const welcomeEl = document.getElementById('welcome');
            if (welcomeEl) welcomeEl.style.display = 'none';

            // 添加用户消息（含附件预览）
            let userDisplayText = text;
            if (uploadedFiles.length > 0) {
                const fileNames = uploadedFiles.map(f => `📎${f.name}`).join(' ');
                userDisplayText = `${fileNames}\n${text}`;
            }
            addMessage(userDisplayText, 'user');
            messages.push({ role: 'user', content: text });
            input.value = '';
            
            // 保存当前上传的文件（发送后清空）
            const currentFiles = [...uploadedFiles];
            uploadedFiles = [];
            updateUploadPreview();

            // 显示typing + 模型提示
            const container = document.getElementById('chatContainer');
            const typingEl = document.createElement('div');
            typingEl.className = 'message ai';
            const typeNames = { storyboard: '分镜设计', visual: '视觉指导', writing: '创意写作', thinking: '深度思考', analysis: '智能分析', search: '联网搜索', code: '代码助手', chat: '智能对话' };
            const modelName = MODEL_NAMES[routing.model] || routing.model;
            typingEl.innerHTML = `<div class="typing"><span></span><span></span><span></span></div><div style="font-size:11px;color:#888;margin-top:4px;">${routing.icon} ${typeNames[routing.type] || '对话'} · ${modelName}</div>`;
            container.appendChild(typingEl);
            container.scrollTop = container.scrollHeight;

            isGenerating = true;
            document.getElementById('sendBtn').disabled = true;

            try {
                // 📝 构建带上下文记忆的消息列表（最近6轮对话）
                const contextMessages = messages.slice(-6).map(m => ({
                    role: m.role === 'user' ? 'user' : 'assistant',
                    content: m.content
                }));
                
                // 🎬 分镜/视觉指导模式：添加系统提示词
                let systemPrompt = '';
                let finalPrompt = text;
                if (routing.type === 'storyboard' || routing.type === 'visual') {
                    systemPrompt = HOLLYWOOD_VISUAL_DIRECTOR_PROMPT;
                    // 分镜模式完成后重置
                    if (isStoryboardMode) {
                        isStoryboardMode = false;
                        document.getElementById('inputBox').placeholder = '输入消息...';
                    }
                }
                
                // 📎 构建最终消息（支持多模态）
                let finalMessage;
                if (currentFiles.length > 0) {
                    // 有文件时，构建多模态消息
                    const contentParts = [];
                    
                    // 添加文件内容
                    for (const file of currentFiles) {
                        if (file.type === 'image') {
                            contentParts.push({
                                type: 'image_url',
                                image_url: { url: file.data }
                            });
                        } else if (file.type === 'file') {
                            // 文本文件尝试解析内容
                            if (file.data.startsWith('data:text/') || file.data.startsWith('data:application/json')) {
                                try {
                                    const base64Content = file.data.split(',')[1];
                                    const textContent = atob(base64Content);
                                    contentParts.push({
                                        type: 'text',
                                        text: `[文件: ${file.name}]\n${textContent}`
                                    });
                                } catch(e) {
                                    contentParts.push({
                                        type: 'text',
                                        text: `[文件: ${file.name}] (无法解析)`
                                    });
                                }
                            } else {
                                // 其他文件类型作为附件信息
                                contentParts.push({
                                    type: 'text',
                                    text: `[附件: ${file.name}, 大小: ${(file.size/1024).toFixed(1)}KB]`
                                });
                            }
                        } else if (file.type === 'video') {
                            // 视频文件作为附件信息（大部分AI不支持视频）
                            contentParts.push({
                                type: 'text',
                                text: `[视频附件: ${file.name}, 大小: ${(file.size/1024/1024).toFixed(1)}MB]`
                            });
                        }
                    }
                    
                    // 添加文本内容
                    if (finalPrompt) {
                        contentParts.push({ type: 'text', text: finalPrompt });
                    }
                    
                    finalMessage = { role: 'user', content: contentParts };
                    
                    // 有图片时切换到视觉模型
                    const hasImages = currentFiles.some(f => f.type === 'image');
                    if (hasImages && !routing.model.includes('vision') && !routing.model.includes('gemini') && !routing.model.includes('gpt-4')) {
                        routing.model = 'gemini-2.0-flash';  // 切换到支持视觉的模型
                        console.log('🖼️ 检测到图片，切换到视觉模型:', routing.model);
                    }
                } else {
                    // 无文件时，普通文本消息
                    finalMessage = { role: 'user', content: finalPrompt };
                }
                
                const response = await fetch('/api/yunwu', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'chat',  // 使用chat action支持多轮对话
                        messages: contextMessages.concat([finalMessage]),
                        system: systemPrompt,
                        model: routing.model,
                        userId: currentUser.id,
                        enableSearch: routing.enableSearch || false
                    })
                });

                // 检查响应状态
                if (!response.ok) {
                    const errText = await response.text().catch(() => '');
                    throw new Error(`服务器错误 (${response.status}): ${errText.substring(0, 100) || '请稍后重试'}`);
                }

                const data = await response.json();
                typingEl.remove();

                if (data.error) {
                    throw new Error(data.error);
                }

                const aiText = data.content || data.text || data.response || '抱歉，我没有理解你的问题。';
                const actualCost = data.billed || 0;  // 后端返回的实际扣费
                const usage = data.usage || {};
                
                // 添加模型标识（显示实际消耗）
                const usedModel = data.model || routing.model;
                const displayModelName = MODEL_NAMES[usedModel] || usedModel;
                const tokenInfo = usage.totalTokens ? ` · ${usage.totalTokens}tk` : '';
                const modelBadge = `<div style="font-size:10px;color:#666;margin-bottom:4px;">${routing.icon} ${displayModelName}${tokenInfo} · -${actualCost}胶片</div>`;
                addMessageWithBadge(aiText, 'ai', modelBadge);
                messages.push({ role: 'assistant', content: aiText });

                // 更新余额显示（用后端返回的实际扣费）
                if (actualCost > 0) {
                    userQuota = Math.max(0, userQuota - actualCost);
                    updateQuotaDisplay();
                }
                // 同步后端余额
                loadUserQuota();

            } catch (error) {
                typingEl.remove();
                addMessage('出错了：' + error.message, 'ai');
                // ✅ 后端成功才扣费，失败不扣费，无需退款
            } finally {
                isGenerating = false;
                document.getElementById('sendBtn').disabled = false;
            }
        }
        
        // 添加带标识的消息
        function addMessageWithBadge(text, type, badge) {
            const container = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            // AI消息添加复制按钮
            const copyBtn = type === 'ai' ? `<button class="copy-btn" onclick="copyMessageText(this, '${encodeURIComponent(text)}')">📋 复制</button>` : '';
            msg.innerHTML = copyBtn + badge + formatMessage(text);
            // 保存原始文本用于复制
            msg.dataset.rawText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function addMessage(text, type) {
            const container = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            // AI消息添加复制按钮
            const copyBtn = type === 'ai' ? `<button class="copy-btn" onclick="copyMessageText(this)">📋 复制</button>` : '';
            msg.innerHTML = copyBtn + formatMessage(text);
            // 保存原始文本用于复制
            msg.dataset.rawText = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }
        
        // 复制消息文本
        function copyMessageText(btn) {
            const msg = btn.closest('.message');
            const text = msg.dataset.rawText || msg.innerText;
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = '✅ 已复制';
                setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
            }).catch(() => {
                // 备用方法
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                btn.textContent = '✅ 已复制';
                setTimeout(() => { btn.textContent = '📋 复制'; }, 1500);
            });
        }

        function formatMessage(text) {
            // 简单的代码块处理
            return text
                .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code style="background:#333;padding:2px 6px;border-radius:4px;">$1</code>')
                .replace(/\n/g, '<br>');
        }

        // 自动调整输入框高度
        document.getElementById('inputBox').addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        
        // ==================== 文件上传功能 ====================
        let uploadedFiles = [];  // 已上传的文件
        
        function toggleUploadMenu() {
            const menu = document.getElementById('uploadMenu');
            menu.classList.toggle('show');
        }
        
        // 点击其他地方关闭菜单
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('uploadMenu');
            const btn = document.getElementById('uploadBtn');
            if (menu && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.remove('show');
            }
        });
        
        function triggerUpload(type) {
            document.getElementById('uploadMenu').classList.remove('show');
            if (type === 'image') {
                document.getElementById('imageInput').click();
            } else if (type === 'video') {
                document.getElementById('videoInput').click();
            } else if (type === 'file') {
                document.getElementById('fileInput').click();
            }
        }
        
        async function handleFileSelect(event, type) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            
            const previewContainer = document.getElementById('uploadPreview');
            
            for (const file of files) {
                // 检查文件大小
                const maxSize = type === 'video' ? 50 * 1024 * 1024 : 10 * 1024 * 1024;
                if (file.size > maxSize) {
                    showToast(`文件过大，最大${maxSize / 1024 / 1024}MB`);
                    continue;
                }
                
                // 读取文件为base64
                const base64 = await fileToBase64(file);
                
                const fileObj = {
                    type: type,
                    name: file.name,
                    size: file.size,
                    data: base64
                };
                uploadedFiles.push(fileObj);
                
                // 显示预览
                const preview = document.createElement('div');
                preview.className = 'preview-item';
                preview.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:#333;padding:4px 8px;border-radius:6px;margin:4px;font-size:12px;';
                
                if (type === 'image') {
                    preview.innerHTML = `<img src="${base64}" style="width:24px;height:24px;object-fit:cover;border-radius:4px;"><span>${file.name.substring(0, 15)}${file.name.length > 15 ? '...' : ''}</span><button onclick="removeUploadedFile(${uploadedFiles.length - 1})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                } else if (type === 'video') {
                    preview.innerHTML = `<span>🎬</span><span>${file.name.substring(0, 15)}${file.name.length > 15 ? '...' : ''}</span><button onclick="removeUploadedFile(${uploadedFiles.length - 1})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                } else {
                    preview.innerHTML = `<span>📄</span><span>${file.name.substring(0, 15)}${file.name.length > 15 ? '...' : ''}</span><button onclick="removeUploadedFile(${uploadedFiles.length - 1})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                }
                
                previewContainer.appendChild(preview);
            }
            
            // 清空 input
            event.target.value = '';
        }
        
        function removeUploadedFile(index) {
            uploadedFiles.splice(index, 1);
            updateUploadPreview();
        }
        
        function updateUploadPreview() {
            const previewContainer = document.getElementById('uploadPreview');
            previewContainer.innerHTML = '';
            
            uploadedFiles.forEach((file, index) => {
                const preview = document.createElement('div');
                preview.className = 'preview-item';
                preview.style.cssText = 'display:inline-flex;align-items:center;gap:4px;background:#333;padding:4px 8px;border-radius:6px;margin:4px;font-size:12px;';
                
                if (file.type === 'image') {
                    preview.innerHTML = `<img src="${file.data}" style="width:24px;height:24px;object-fit:cover;border-radius:4px;"><span>${file.name.substring(0, 15)}</span><button onclick="removeUploadedFile(${index})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                } else {
                    const icon = file.type === 'video' ? '🎬' : '📄';
                    preview.innerHTML = `<span>${icon}</span><span>${file.name.substring(0, 15)}</span><button onclick="removeUploadedFile(${index})" style="background:none;border:none;color:#f00;cursor:pointer;">×</button>`;
                }
                
                previewContainer.appendChild(preview);
            });
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // ==================== 页面状态持久化 ====================
        function saveChatState() {
            try {
                const state = {
                    messages,
                    inputValue: document.getElementById('inputBox')?.value || '',
                    welcomeHidden: document.getElementById('welcome')?.style.display === 'none',
                    timestamp: Date.now()
                };
                sessionStorage.setItem('rollroll_chat_state', JSON.stringify(state));
                console.log('[chat] 状态已保存');
            } catch (e) { console.warn('[chat] 保存状态失败:', e); }
        }

        function restoreChatState() {
            try {
                const saved = sessionStorage.getItem('rollroll_chat_state');
                if (!saved) return;
                const state = JSON.parse(saved);
                if (state.timestamp && Date.now() - state.timestamp > 30 * 60 * 1000) {
                    sessionStorage.removeItem('rollroll_chat_state');
                    return;
                }
                console.log('[chat] 恢复状态...');

                // 恢复输入框
                if (state.inputValue) document.getElementById('inputBox').value = state.inputValue;

                // 恢复对话历史
                if (state.messages && state.messages.length > 0) {
                    messages = state.messages;
                    const welcomeEl = document.getElementById('welcome');
                    if (welcomeEl) welcomeEl.style.display = 'none';
                    const container = document.getElementById('chatContainer');
                    // 保留welcome元素，只清除消息
                    const existingMsgs = container.querySelectorAll('.message');
                    existingMsgs.forEach(m => m.remove());
                    messages.forEach(msg => {
                        addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai');
                    });
                }

                console.log('[chat] 状态恢复完成');
            } catch (e) { console.warn('[chat] 恢复状态失败:', e); }
        }

        document.addEventListener('visibilitychange', () => { if (document.hidden) saveChatState(); });
        window.addEventListener('beforeunload', saveChatState);
        window.addEventListener('pagehide', saveChatState);
        window.addEventListener('load', () => setTimeout(restoreChatState, 200));
    </script>
</body>
